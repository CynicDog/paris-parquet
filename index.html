<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>paris-parquet</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#fff; --ink:#1c1c1a; --dim:#6b6b66; --faint:#9a9a94;
  --line:#e2e2dd; --line2:#efefea; --accent:#2f6fdd; --accent-soft:#e8f0fd;
  --num:#1a6b4a; --str:#8a4b1f; --bool:#7a3fa0; --time:#1d5f8a; --bin:#6b6b66;
  --warn:#b3541e; --err:#b32020; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
/* dark follows the browser unless the theme button has picked a side */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --panel:#1c1e22; --ink:#e6e6e3; --dim:#9b9d9f; --faint:#6e7073;
    --line:#2c2f34; --line2:#242024; --accent:#6ea3ff; --accent-soft:#22293a;
    --num:#6fd0a3; --str:#e0a06a; --bool:#c59cf0; --time:#7cc4ef; --bin:#9b9d9f;
    --warn:#e09a5e; --err:#f08a8a;
  }
}
:root[data-theme="dark"]{
    --bg:#16171a; --panel:#1c1e22; --ink:#e6e6e3; --dim:#9b9d9f; --faint:#6e7073;
    --line:#2c2f34; --line2:#242024; --accent:#6ea3ff; --accent-soft:#22293a;
    --num:#6fd0a3; --str:#e0a06a; --bool:#c59cf0; --time:#7cc4ef; --bin:#9b9d9f;
    --warn:#e09a5e; --err:#f08a8a;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);
  background:var(--panel);flex:none;overflow:hidden}
h1{font:600 13px/1 var(--mono);margin:0;letter-spacing:.02em;white-space:nowrap;flex:none}
h1 span{color:var(--faint);font-weight:400}
.grow{flex:1}
button,label.btn{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:5px;
  background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;flex:none}
button:hover,label.btn:hover{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.45;cursor:default;border-color:var(--line);color:var(--dim)}
input[type=file]{display:none}
#fileline{font:11px/1.4 var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
#fileline b{color:var(--ink);font-weight:600}

/* ---------- drop zone / states ---------- */
#stage{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#drop{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim);text-align:center;padding:30px}
#drop .big{font:500 15px/1.4 var(--mono);color:var(--ink)}
#drop .hint{font-size:12px;max-width:44em;color:var(--faint)}
body.dragging #drop{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-14px}
#err{margin:14px;padding:10px 12px;border:1px solid var(--err);border-radius:6px;color:var(--err);
  font:12px/1.5 var(--mono);white-space:pre-wrap;background:var(--panel)}
#busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--bg) 80%,transparent);font:12px var(--mono);color:var(--dim);z-index:30}

/* ---------- pagination ---------- */
#pager{flex:none;display:flex;align-items:center;gap:7px;padding:4px 10px;border-top:1px solid var(--line);
  background:var(--panel);font:11px/1.6 var(--mono);color:var(--dim);flex-wrap:wrap}
#pager button{padding:1px 8px;font-size:12px;line-height:1.3;min-width:26px}
#pager input,#pager select{font:11px var(--mono);background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:1px 4px}
#pager input{width:52px;text-align:right}
#pager b{color:var(--accent);font-weight:600}
.pinfo{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.psep{width:1px;height:13px;background:var(--line);display:inline-block}
#pager .grow{flex:1;min-width:8px}
#pager #expscope{max-width:130px}

/* ---------- grid ---------- */
#gridwrap{flex:1;overflow:auto;min-height:0;position:relative}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;font:12px/1.4 var(--mono)}
table.grid th,table.grid td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
  padding:0 7px;text-align:left;vertical-align:top;overflow:hidden;background:var(--panel)}
table.grid thead th{position:sticky;background:var(--panel);z-index:3}
tr.r-name th{top:0;z-index:4;border-bottom:1px solid var(--line);padding:5px 7px}
tr.r-sum th{top:var(--nameh,28px);z-index:4;border-bottom:2px solid var(--line);padding:5px 7px;height:116px}
table.grid th.rownum,table.grid td.rownum{position:sticky;left:0;z-index:2;width:62px;min-width:62px;
  text-align:right;color:var(--faint);border-right:1px solid var(--line);font-size:11px}
tr.r-name th.rownum,tr.r-sum th.rownum{z-index:6}
tbody td{height:22px;line-height:22px;padding-top:0;padding-bottom:0;white-space:nowrap;text-overflow:ellipsis}
tbody tr:hover td{background:var(--accent-soft)}
td.pad{height:auto;padding:0;border:0}

i.grip{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;z-index:5}
i.grip:hover,body.colsizing i.grip{background:var(--accent);opacity:.45}
th.sortable{cursor:pointer}
th.sortable:hover .cname{color:var(--accent)}
.sortmark{float:right;color:var(--accent);font-size:10px;line-height:14px;padding-left:3px}
.sortmark i{font-style:normal;font-size:8px;vertical-align:super;color:var(--faint)}
.cname{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctype{display:block;color:var(--faint);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-number{color:var(--num)} .t-string{color:var(--str)} .t-bool{color:var(--bool)}
.t-temporal{color:var(--time)} .t-binary{color:var(--bin)} .t-nested{color:var(--dim)}
table.grid td.v-number{text-align:right}
td.v-bool{color:var(--bool)} td.v-binary{color:var(--dim)} td.v-nested{color:var(--dim)}
.null{color:var(--faint);font-style:italic}

/* ---------- summary cards ---------- */
.sum{font-size:10.5px;line-height:1.35;color:var(--dim);display:flex;flex-direction:column;gap:2px;height:106px;overflow:hidden}
.sum .kv{display:flex;justify-content:space-between;gap:6px}
.sum .kv span:last-child{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum .lab{color:var(--faint)}
.nullbar{height:4px;background:var(--line2);border-radius:2px;overflow:hidden;display:flex}
.nullbar i{display:block;height:100%}
.nullbar i.v{background:var(--accent)} .nullbar i.n{background:var(--line)}
.hist{display:flex;align-items:flex-end;gap:1px;height:26px;margin-top:1px}
.hist i{flex:1;background:var(--accent);opacity:.65;min-height:1px;border-radius:1px 1px 0 0}
.hist i:hover{opacity:1}
.top{display:flex;flex-direction:column;gap:1px}
.top .row{position:relative;display:flex;justify-content:space-between;gap:6px;padding:0 3px;border-radius:2px;overflow:hidden}
.top .row i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.16}
.top .row span{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .row span.c{color:var(--faint);flex:none}
.bools{display:flex;height:12px;border-radius:2px;overflow:hidden;font-size:9px;color:#fff;line-height:12px}
.bools i{display:block;text-align:center;overflow:hidden}
.bools i.t{background:var(--bool)} .bools i.f{background:var(--dim)} .bools i.n{background:var(--line)}

/* ---------- cell inspector ---------- */
#inspect{position:fixed;z-index:40;max-width:min(620px,92vw);max-height:60vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 6px 24px rgba(0,0,0,.18)}
.ihead{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line2);
  font:11px var(--mono)}
.ihead b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ihead button{padding:0 7px;font-size:11px;line-height:18px;min-width:0}
.imeta{display:flex;gap:9px;flex-wrap:wrap;padding:4px 8px;border-bottom:1px solid var(--line2);
  font:10.5px var(--mono)}
.ibody{margin:0;padding:8px;overflow:auto;font:11.5px/1.5 var(--mono);white-space:pre-wrap;
  word-break:break-word;color:var(--ink)}
.ibody.null{color:var(--faint);font-style:italic}

/* ---------- column picker ---------- */
#colpick{position:fixed;z-index:41;width:318px;max-height:70vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#cphead .muted{font-size:10px}
#cphead button{padding:0 6px;font-size:10.5px;line-height:18px;min-width:0}
.cpsearchwrap{padding:6px 8px;border-bottom:1px solid var(--line2)}
#cpsearch{width:100%;font:11px var(--mono);background:var(--bg);color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.cplist{overflow:auto;padding:2px 0}
.cprow{display:flex;align-items:center;gap:6px;padding:2px 8px;font:11px var(--mono);cursor:grab;
  border-top:1px solid transparent;border-bottom:1px solid transparent}
.cprow:hover{background:var(--accent-soft)}
.cprow.pinned{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.cprow.dropbefore{border-top-color:var(--accent)}
.cprow.dropafter{border-bottom-color:var(--accent)}
.cprow input[type=checkbox]{accent-color:var(--accent);margin:0}
.cpname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.cpname.off{color:var(--faint);text-decoration:line-through}
.cppin{font-size:9.5px;padding:0 5px;border:1px solid var(--line);border-radius:3px;background:var(--panel);
  color:var(--faint);min-width:0;line-height:15px}
.cppin.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- query builder ---------- */
#query{flex:none;height:var(--queryh,258px);display:flex;flex-direction:column;overflow:hidden;
  border-top:1px solid var(--line);background:var(--panel)}
.qbar{flex:none;display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid var(--line2);
  font:11px var(--mono);color:var(--dim);flex-wrap:wrap}
.qtitle{font-weight:700;letter-spacing:.08em;color:var(--dim)}
#qstat b{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:2px 9px;font-size:11px;background:var(--panel);color:var(--dim)}
.seg button.on{background:var(--accent);color:#fff}
.qbody{flex:1;display:flex;min-height:0}
.qcols{flex:0 0 196px;overflow:auto;border-right:1px solid var(--line2);background:var(--bg)}
.qhead{position:sticky;top:0;background:var(--bg);padding:5px 10px;font:10px var(--mono);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line2);
  display:flex;justify-content:space-between;align-items:center;z-index:1}
.qcol{display:flex;align-items:center;gap:6px;padding:3px 10px;cursor:grab;font:11px var(--mono);
  border-bottom:1px solid var(--line2);user-select:none}
.qcol:hover{background:var(--accent-soft)}
.qgrab{color:var(--faint);font-size:10px;flex:none}
.qcname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.qtag{font-size:9px;font-weight:700;border:1px solid var(--line);border-radius:3px;padding:0 3px;flex:none}
.qzones{flex:1;overflow:auto;padding:9px 12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.qzone{min-width:0}
.qzlabel{font:10px var(--mono);font-weight:700;letter-spacing:.08em;color:var(--faint);margin-bottom:3px}
.qdrop{min-height:30px;border:1px dashed var(--line);border-radius:5px;padding:4px 7px;display:flex;
  flex-wrap:wrap;gap:4px;align-items:center;background:var(--panel)}
.qdrop.empty{background:var(--bg)}
.qdrop.over{border-color:var(--accent);background:var(--accent-soft)}
.qhint{font:11px var(--mono);color:var(--faint);user-select:none}
.qchip{display:inline-flex;align-items:center;gap:3px;font:11px var(--mono);background:var(--bg);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink)}
.qrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;width:100%}
.qrow code{font:11px var(--mono);background:var(--bg);border:1px solid var(--line2);border-radius:3px;
  padding:1px 6px;color:var(--ink)}
.qbtns{display:inline-flex;gap:2px}
.qb{font:10px var(--mono);padding:1px 5px;border:1px solid var(--line);border-radius:3px;background:var(--panel);
  color:var(--dim);font-weight:600;min-width:0}
.qb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.qlink{font:10px var(--mono);font-weight:700;color:var(--accent);background:none;border:1px solid var(--accent);
  border-radius:3px;padding:0 5px;width:36px}
.qin{font:11px var(--mono);background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:3px;padding:1px 5px}
.qx{background:none;border:0;color:var(--faint);cursor:pointer;font-size:13px;line-height:1;padding:0 2px;min-width:0}
.qx:hover{color:var(--err)}
.qin.bad{border-color:var(--err);color:var(--err)}
.qwarn{color:var(--warn);font-style:normal}
.qlimit{display:flex;align-items:center;gap:8px}
.qlimit .qzlabel{margin:0}
.qsqlwrap{flex:0 0 272px;border-left:1px solid var(--line2);display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg)}
.qsqlwrap .qhead button{font:10px var(--mono);padding:0 6px;border-radius:3px}
#qsql{margin:0;padding:8px 10px;overflow:auto;flex:1;font:11px/1.55 var(--mono);color:var(--ink);
  white-space:pre-wrap;word-break:break-word}

/* ---------- footer / metadata ---------- */
#mgrip{flex:none;height:7px;background:var(--bg);cursor:row-resize;position:relative;z-index:6}
#mgrip::after{content:"";position:absolute;left:50%;top:2px;margin-left:-19px;width:38px;height:3px;
  border-radius:2px;background:var(--line)}
#mgrip:hover::after,body.rowsizing #mgrip::after{background:var(--accent)}
#meta{flex:none;height:var(--metah,38vh);overflow:auto;border-top:1px solid var(--line);background:var(--panel)}
#meta.collapsed{height:auto;overflow:visible}
body.rowsizing{cursor:row-resize} body.colsizing{cursor:col-resize}
body.rowsizing,body.colsizing{user-select:none}
#meta.collapsed .mbody{display:none}
.mbar{display:flex;align-items:center;gap:10px;padding:6px 14px;border-bottom:1px solid var(--line2);
  position:sticky;top:0;background:var(--panel);z-index:2;font:11px var(--mono);color:var(--dim);flex-wrap:wrap}
#meta.collapsed .mbar{border-bottom:0}
.mbar .tag{border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink)}
.mbar .tag b{color:var(--accent);font-weight:600}
.mbody{padding:4px 14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:2px 22px;align-items:start}
.mcard{padding:8px 0;min-width:0}
.mcard h3{font:600 11px/1 var(--mono);margin:0 0 6px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
table.kvt{border-collapse:collapse;width:100%;font:11px/1.5 var(--mono);table-layout:fixed}
table.kvt td,table.kvt th{padding:1px 6px 1px 0;text-align:left;vertical-align:top;
  border-bottom:1px solid var(--line2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.kvt th{color:var(--faint);font-weight:400}
table.kvt td.k{color:var(--faint);width:40%}
table.kvt td.n{text-align:right}
table.kvt tr:hover td{background:var(--accent-soft)}
.wide{grid-column:1/-1}
.scrollx{overflow-x:auto}
.tree{font:11px/1.55 var(--mono);white-space:pre;overflow-x:auto}
.tree .nm{color:var(--ink)} .tree .ty{color:var(--accent)} .tree .rp{color:var(--faint)}
details>summary{cursor:pointer;font:11px var(--mono);color:var(--dim);padding:3px 0;list-style:none}
details>summary::before{content:"▸ ";color:var(--faint)}
details[open]>summary::before{content:"▾ "}
.muted{color:var(--faint)}
.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:5px;padding:6px 9px;margin:8px 0;font:11px/1.5 var(--mono)}
</style>
<style id="colstyle"></style>

<body>
<header>
  <h1>paris-parquet <span>· single-file parquet viewer</span></h1>
  <label class="btn" for="picker">Open .parquet</label>
  <input type="file" id="picker" accept=".parquet,.pq,application/octet-stream">
  <div id="fileline"></div>
  <div class="grow"></div>
  <button id="more" hidden>Load more rows</button>
  <button id="all" hidden>Load all</button>
  <button id="toggleCols" hidden>Columns</button>
  <button id="toggleQuery" hidden>Query</button>
  <button id="toggleMeta" hidden>Hide metadata</button>
  <button id="theme" title="Colour theme: follow the browser, or force light or dark">auto</button>
</header>

<div id="stage">
  <div id="drop">
    <div class="big">Drop a .parquet file here</div>
    <div class="hint">Everything runs in this page: no server, no install, no network.
      The file never leaves your machine.</div>
  </div>
  <div id="gridwrap" hidden><table class="grid" id="grid"></table></div>
  <div id="pager" hidden></div>
  <div id="busy" hidden>reading…</div>
</div>

<div id="inspect" hidden></div>
<div id="colpick" hidden>
  <div class="ihead" id="cphead"></div>
  <div class="cpsearchwrap"><input id="cpsearch" placeholder="search name or type"></div>
  <div class="cplist" id="cplist"></div>
</div>
<div id="qgrip" hidden title="Drag to resize the query panel"></div>
<section id="query" hidden>
  <div class="qbar">
    <span class="qtitle">QUERY</span>
    <span class="seg" id="qmode"><button data-mode="rows" class="on">Rows</button><button data-mode="agg">Aggregate</button></span>
    <button id="qrun" title="Run the query (Enter)">Run</button>
    <button id="qclear" disabled>Reset</button>
    <span id="qstat"></span>
    <span class="grow"></span>
    <span class="muted">drag a column into a zone, or double-click it</span>
  </div>
  <div class="qbody">
    <div class="qcols" id="qcols"></div>
    <div class="qzones" id="qzones"></div>
    <div class="qsqlwrap"><div class="qhead">SQL<button id="qcopy">copy</button></div><pre id="qsql"></pre></div>
  </div>
</section>
<div id="mgrip" hidden title="Drag to resize the metadata panel"></div>
<div id="meta" hidden>
  <div class="mbar" id="mbar"></div>
  <div class="mbody" id="mbody"></div>
</div>

<script>
"use strict";
/* =====================================================================
   paris-parquet — a self-contained parquet reader + viewer.
   No dependencies: thrift, snappy, lz4, zstd, gzip and every parquet
   encoding below are decoded in this file.
   ===================================================================== */

/* ---------------------------------------------------------------- bytes */
const utf8 = new TextDecoder("utf-8");

class Cursor {
  constructor(bytes, pos) {
    this.b = bytes;
    this.p = pos || 0;
    this.view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  }
  byte() { return this.b[this.p++]; }
  bytes(n) { const s = this.b.subarray(this.p, this.p + n); this.p += n; return s; }
  /** unsigned LEB128; uses float math so values above 2^31 stay correct */
  uvarint() {
    let shift = 1, out = 0, b;
    do { b = this.b[this.p++]; out += (b & 0x7f) * shift; shift *= 128; } while (b & 0x80);
    return out;
  }
  zigzag() { const v = this.uvarint(); return v % 2 ? -(v + 1) / 2 : v / 2; }
}

/* --------------------------------------------------- thrift compact read */
const TSTOP = 0, TTRUE = 1, TFALSE = 2, TBYTE = 3, TI16 = 4, TI32 = 5, TI64 = 6,
      TDOUBLE = 7, TBINARY = 8, TLIST = 9, TSET = 10, TMAP = 11, TSTRUCT = 12;

/** Reads a thrift-compact struct into a plain object keyed by field id. */
function thriftStruct(c) {
  const out = {};
  let last = 0;
  for (;;) {
    const head = c.byte();
    const type = head & 0x0f;
    if (type === TSTOP) return out;
    const delta = head >> 4;
    const id = delta ? last + delta : c.zigzag();
    last = id;
    out[id] = thriftValue(c, type);
  }
}
function thriftValue(c, type) {
  switch (type) {
    case TTRUE: return true;
    case TFALSE: return false;
    case TBYTE: return (c.byte() << 24) >> 24;
    case TI16: case TI32: case TI64: return c.zigzag();

/** Decompresses a zstd frame stream. Returns a Uint8Array. */

function zstdFrame(src, p, grow, getOut, setO, getO) {

      }

    }

  }

}

/* ------------------------------------------------------- codec dispatch */
async function decompress(codec, src, uncompressedSize) {
  switch (codec) {
    case "UNCOMPRESSED": return src;
    case "SNAPPY": return snappyDecompress(src, uncompressedSize);
    case "GZIP": return await gzipDecompress(src);
    case "ZSTD": return zstdDecompress(src, uncompressedSize);
    case "LZ4_RAW": return lz4BlockDecompress(src, uncompressedSize);
    case "LZ4": return lz4HadoopDecompress(src, uncompressedSize);
    case "BROTLI":
      try { return await inflate(src, "brotli"); }
      catch (e) { throw new Error("BROTLI pages need a brotli decoder this browser does not expose."); }
    default:
      throw new Error("Unsupported compression codec: " + codec + ".");
  }
}

/* ======================================================================
   Parquet encodings
   ====================================================================== */
const bitWidth = (max) => (max === 0 ? 0 : 32 - Math.clz32(max));
const u32le = (b, p) => (b[p] | (b[p + 1] << 8) | (b[p + 2] << 16) | (b[p + 3] << 24)) >>> 0;

/** RLE / bit-packing hybrid (parquet's level + dictionary-index encoding). */
function rleHybrid(b, pos, end, width, count, out) {
  out = out || new Int32Array(count);
  let n = 0;
  const byteWidth = (width + 7) >> 3;
  while (n < count && pos < end) {
    let shift = 1, header = 0, by;
    do { by = b[pos++]; header += (by & 0x7f) * shift; shift *= 128; } while (by & 0x80);
    if (header & 1) {
      const groups = header >> 1;
      const runBytes = groups * width;
      let bp = pos, buf = 0, bits = 0;
      for (let g = 0; g < groups; g++) {
        for (let i = 0; i < 8; i++) {
          while (bits < width) { buf += b[bp++] * POW2[bits]; bits += 8; }
          const v = buf % POW2[width];
          buf = (buf - v) / POW2[width];
          bits -= width;
          if (n < count) out[n++] = v;
        }
        if (n >= count) break;
      }
      pos += runBytes;
    } else {
      const run = header >> 1;
      let v = 0;
      for (let i = 0; i < byteWidth; i++) v += b[pos + i] * POW2[8 * i];
      pos += byteWidth;
      const stop = Math.min(count, n + run);
      while (n < stop) out[n++] = v;
    }
  }
  return out;
}

/** Legacy BIT_PACKED level encoding: MSB-first, no run headers. */
function bitPackedLegacy(b, pos, end, width, count) {
  const out = new Int32Array(count);
  if (width === 0) return out;
  let buf = 0, bits = 0, n = 0, p = pos;
  while (n < count && (p < end || bits >= width)) {
    while (bits < width && p < end) { buf = buf * 256 + b[p++]; bits += 8; }
    if (bits < width) break;
    const v = Math.floor(buf / POW2[bits - width]);
    bits -= width;
    buf -= v * POW2[bits];
    out[n++] = v;
  }
  return out;
}

/** PLAIN. Appends `count` physical values to `out`. */
function decodePlain(b, pos, end, type, count, typeLength, out) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  switch (type) {
    case "BOOLEAN":
      for (let i = 0; i < count; i++) out.push(((b[pos + (i >> 3)] >> (i & 7)) & 1) === 1);
      return pos + ((count + 7) >> 3);
    case "INT32":
      for (let i = 0; i < count; i++) out.push(dv.getInt32(pos + i * 4, true));
      return pos + count * 4;
    case "INT64":
      for (let i = 0; i < count; i++) {
        const v = dv.getBigInt64(pos + i * 8, true);
        out.push(v >= -9007199254740991n && v <= 9007199254740991n ? Number(v) : v);
      }
      return pos + count * 8;
    case "INT96":
      for (let i = 0; i < count; i++) {
        const p = pos + i * 12;
        const nanos = dv.getBigUint64(p, true);
        const julian = dv.getUint32(p + 8, true);
        out.push({ int96: true, julian, nanos });
      }
      return pos + count * 12;
    case "FLOAT":
      for (let i = 0; i < count; i++) out.push(dv.getFloat32(pos + i * 4, true));
      return pos + count * 4;
    case "DOUBLE":
      for (let i = 0; i < count; i++) out.push(dv.getFloat64(pos + i * 8, true));
      return pos + count * 8;
    case "BYTE_ARRAY":
      for (let i = 0; i < count; i++) {
        const len = u32le(b, pos); pos += 4;
        out.push(b.subarray(pos, pos + len)); pos += len;
      }
      return pos;
    case "FIXED_LEN_BYTE_ARRAY":
      for (let i = 0; i < count; i++) { out.push(b.subarray(pos, pos + typeLength)); pos += typeLength; }
      return pos;
    default: throw new Error("PLAIN: unsupported type " + type);
  }
}

/** DELTA_BINARY_PACKED. Returns {values, pos}; int64 accumulates in BigInt. */
function deltaBinaryPacked(b, pos, end, count, big) {
  const rv = () => { let shift = 1, v = 0, by; do { by = b[pos++]; v += (by & 0x7f) * shift; shift *= 128; } while (by & 0x80); return v; };
  const zz = () => { const v = rv(); return v % 2 ? -(v + 1) / 2 : v / 2; };

  let first = zz();
  const perMini = blockSize / miniPerBlock;

  let cur = big ? BigInt(first) : first;
  out.push(cur);
  while (out.length < total) {
    const minDelta = big ? BigInt(zz()) : zz();
    const widths = [];
    for (let i = 0; i < miniPerBlock; i++) widths.push(b[pos++]);
    for (let m = 0; m < miniPerBlock && out.length < total; m++) {
      const w = widths[m];
      if (w === 0) {
        for (let i = 0; i < perMini && out.length < total; i++) {
          cur = big ? cur + minDelta : cur + minDelta;
          out.push(cur);
        }
        continue;
      }
      let bp = pos, buf = 0, bits = 0;
      for (let i = 0; i < perMini; i++) {
        let d;
        if (w <= 32) {
          while (bits < w) { buf += b[bp++] * POW2[bits]; bits += 8; }
          d = buf % POW2[w];
          buf = (buf - d) / POW2[w];
          bits -= w;
          if (big) d = BigInt(d);
        } else {
          let lo, hi;
          while (bits < 32) { buf += b[bp++] * POW2[bits]; bits += 8; }
          lo = buf % POW2[32]; buf = (buf - lo) / POW2[32]; bits -= 32;
          const rest = w - 32;
          while (bits < rest) { buf += b[bp++] * POW2[bits]; bits += 8; }

        }

      }
      pos += Math.ceil(perMini * w / 8);
    }

  if (big) {
    for (let i = 0; i < out.length; i++) {
      const v = out[i];
      if (v >= -9007199254740991n && v <= 9007199254740991n) out[i] = Number(v);
    }
  }
  return { values: out, pos };

/** BYTE_STREAM_SPLIT: k independent byte streams, one per byte position. */
function byteStreamSplit(b, pos, count, width, type, out) {
  const buf = new Uint8Array(count * width);
  for (let j = 0; j < width; j++) {
    const base = pos + j * count;
    for (let i = 0; i < count; i++) buf[i * width + j] = b[base + i];
  }
  const dv = new DataView(buf.buffer);
  for (let i = 0; i < count; i++) {
    switch (type) {
      case "FLOAT": out.push(dv.getFloat32(i * 4, true)); break;
      case "DOUBLE": out.push(dv.getFloat64(i * 8, true)); break;
      case "INT32": out.push(dv.getInt32(i * 4, true)); break;
      case "INT64": {
        const v = dv.getBigInt64(i * 8, true);
        out.push(v >= -9007199254740991n && v <= 9007199254740991n ? Number(v) : v);
        break;
      }
      default: out.push(buf.subarray(i * width, i * width + width));
    }
  }
  return pos + count * width;
}

/** Decodes one page's value section into physical values. */
function decodeValues(enc, b, pos, end, type, count, typeLength, dict, out) {
  switch (enc) {
    case "PLAIN":
      decodePlain(b, pos, end, type, count, typeLength, out);
      return;
    case "RLE": {                       // boolean data pages
      const len = u32le(b, pos);
      const idx = rleHybrid(b, pos + 4, pos + 4 + len, 1, count);
      for (let i = 0; i < count; i++) out.push(idx[i] === 1);
      return;
    }
    case "PLAIN_DICTIONARY":
    case "RLE_DICTIONARY": {
      if (!dict) throw new Error("dictionary page missing for a dictionary-encoded page");
      const w = b[pos];
      const idx = rleHybrid(b, pos + 1, end, w, count);
      for (let i = 0; i < count; i++) out.push(dict[idx[i]]);
      return;
    }
    case "DELTA_BINARY_PACKED": {
      const r = deltaBinaryPacked(b, pos, end, count, type === "INT64");
      for (let i = 0; i < count; i++) out.push(r.values[i]);
      return;
    }
    case "DELTA_LENGTH_BYTE_ARRAY": {
      const r = deltaBinaryPacked(b, pos, end, count, false);
      let p = r.pos;
      for (let i = 0; i < count; i++) { const n = r.values[i]; out.push(b.subarray(p, p + n)); p += n; }
      return;
    }
    case "DELTA_BYTE_ARRAY": {
      const pre = deltaBinaryPacked(b, pos, end, count, false);
      const suf = deltaBinaryPacked(b, pre.pos, end, count, false);
      let p = suf.pos;
      let prev = new Uint8Array(0);
      for (let i = 0; i < count; i++) {
        const pl = pre.values[i], sl = suf.values[i];
        const v = new Uint8Array(pl + sl);
        v.set(prev.subarray(0, pl));
        v.set(b.subarray(p, p + sl), pl);
        p += sl;
        out.push(v);
        prev = v;
      }
      return;
    }
    case "BYTE_STREAM_SPLIT": {
      const w = type === "FLOAT" || type === "INT32" ? 4 : type === "DOUBLE" || type === "INT64" ? 8
        : type === "FIXED_LEN_BYTE_ARRAY" ? typeLength : 0;
      if (!w) throw new Error("BYTE_STREAM_SPLIT: unsupported type " + type);
      byteStreamSplit(b, pos, count, w, type, out);
      return;
    }
    default:
      throw new Error("Unsupported encoding: " + enc + ".");
  }
}

/* ======================================================================

   ====================================================================== */
async function readColumnChunk(src, chunk, leaf) {
  const m = chunk.meta;
  if (!m) throw new Error("column chunk has no metadata (encrypted?)");

    start = m.dictionaryPageOffset;
  }

  const maxDef = leaf.maxDef, maxRep = leaf.maxRep;

  while (pos < buf.length && seen < m.numValues) {
    const c = new Cursor(buf, pos);
    const h = thriftStruct(c);

    const ptype = PAGE_TYPE[h[1]];

    pos = dataStart + compSize;

      const dh = h[7] || {};

      dict = [];
      decodePlain(page, 0, page.length, m.type, dh[1] | 0, leaf.typeLength, dict);
      continue;

    if (ptype === "DATA_PAGE") {
      const dh = h[5];

  return d ? d.order.filter((ci) => d.pinned.has(ci) && !d.hidden.has(ci)).length : 0;
}
function baseView(table) {
  return { cols: displayCols(table.cols), index: null, count: table.rowsLoaded, label: null, agg: false };
}
function viewValue(view, ci, row) {
  const rows = view.cols[ci].rows;
  return view.index ? rows[view.index[row]] : rows[row];
}
function summarizeView(view) {
  for (const col of view.cols) col.summary = summarize(col, view.index, view.count);
}
function setView(view) {
  state.view = view;
  state.page = 0;
  summarizeView(view);
  renderGrid();
  renderPager();
}

/* ------------------------------------------------------------ pagination */
function pageBounds() {
  const v = state.view;
  if (!v) return [0, 0];
  const size = state.pageSize;
  if (!isFinite(size)) return [0, v.count];
  const pages = Math.max(1, Math.ceil(v.count / size));
  if (state.page >= pages) state.page = pages - 1;
  if (state.page < 0) state.page = 0;
  const start = state.page * size;
  return [start, Math.min(v.count, start + size)];
}
function pageCount() {
  const v = state.view;
  if (!v || !isFinite(state.pageSize)) return 1;
  return Math.max(1, Math.ceil(v.count / state.pageSize));
}
function gotoPage(n) {
  const last = pageCount() - 1;
  const p = Math.max(0, Math.min(last, n));
  if (p === state.page) return;
  state.page = p;
  $("gridwrap").scrollTop = 0;
  state.first = -1;
  renderRows(true);
  renderPager();
}
function renderPager() {
  const v = state.view;
  const bar = $("pager");
  if (!v) { bar.hidden = true; return; }
  bar.hidden = false;
  const [from, to] = pageBounds();
  const pages = pageCount();
  const opts = PAGE_SIZES.map((n) => "<option value='" + n + "'" +
    (n === state.pageSize ? " selected" : "") + ">" + (isFinite(n) ? num(n) : "All") + "</option>").join("");
  const dis = (on) => (on ? " disabled" : "");
  bar.innerHTML =
    "<button id='pfirst' title='First page'" + dis(state.page === 0) + ">&laquo;</button>" +
    "<button id='pprev' title='Previous page'" + dis(state.page === 0) + ">&lsaquo;</button>" +
    "<span class='pinfo'>page <input id='pnum' value='" + (state.page + 1) +
    "' size='4' inputmode='numeric'> of " + num(pages) + "</span>" +
    "<button id='pnext' title='Next page'" + dis(state.page >= pages - 1) + ">&rsaquo;</button>" +
    "<button id='plast' title='Last page'" + dis(state.page >= pages - 1) + ">&raquo;</button>" +
    "<span class='psep'></span>" +
    "<label class='pinfo'>rows <select id='psize'>" + opts + "</select></label>" +
    "<span class='psep'></span>" +
    "<span class='pinfo'>" + (v.count ? num(from + 1) + "&ndash;" + num(to) : "0") + " of " + num(v.count) +
    (v.label ? " <b>" + esc(v.label) + "</b>" : "") + "</span>" +
    (state.table && state.table.truncated
      ? "<span class='pinfo muted'>&middot; " + num(state.table.rowsLoaded) + " of " +
        num(state.meta.numRows) + " rows read</span>" : "") +
    "<span class='grow'></span>" +
    "<span class='pinfo'>export <select id='expscope'>" +
    "<option value='page'>this page</option><option value='view'>all " + num(v.count) + " rows</option>" +
    "</select>" +
    "<button id='expcsv'>CSV</button><button id='exptsv'>TSV</button>" +
    "<button id='expjson'>JSON</button><button id='expcopy' title='Copy as TSV'>copy</button></span>";
  const scope = state.exportScope || "page";
  $("expscope").value = scope;
  $("expscope").onchange = (e) => { state.exportScope = e.target.value; };
  $("expcsv").onclick = () => doExport("csv");
  $("exptsv").onclick = () => doExport("tsv");
  $("expjson").onclick = () => doExport("json");
  $("expcopy").onclick = () => doExport("copy");
  $("pfirst").onclick = () => gotoPage(0);
  $("pprev").onclick = () => gotoPage(state.page - 1);
  $("pnext").onclick = () => gotoPage(state.page + 1);
  $("plast").onclick = () => gotoPage(pages - 1);
  $("pnum").onchange = (e) => {
    const n = parseInt(e.target.value, 10);
    if (isFinite(n)) gotoPage(n - 1); else renderPager();
  };
  $("psize").onchange = (e) => {
    const size = Number(e.target.value);
    const anchor = pageBounds()[0];
    state.pageSize = size;
    state.page = isFinite(size) ? Math.floor(anchor / size) : 0;
    try { localStorage.setItem("paris-parquet-pagesize", String(size)); } catch (err) { /* fine */ }
    $("gridwrap").scrollTop = 0;
    state.first = -1;
    renderRows(true);
    renderPager();
  };
}

/* -------------------------------------------------------------- export */
/** The value as the grid shows it, minus the display truncation. */
function exportText(v, spec) {
  return v === null || v === undefined ? null : fmtValue(v, spec);
}
/** Real JSON types where they exist, so numbers stay numbers. */
function exportJson(v, spec) {
  if (v === null || v === undefined) return null;
  if (spec.kind === "number") return typeof v === "number" ? v : typeof v === "bigint" ? v.toString() : v;
  if (spec.kind === "bool") return v === true;
  if (spec.kind === "nested") {
    const inner = { kind: spec.elementKind, sub: spec.sub, utc: spec.utc };
    const walk = (x) => (x === null || x === undefined ? null : Array.isArray(x) ? x.map(walk) : exportJson(x, inner));
    return walk(v);
  }
  return fmtValue(v, spec);
}
function csvField(text, sep) {
  if (text === null) return "";
  return /["\r\n]/.test(text) || text.indexOf(sep) >= 0 ? '"' + text.replace(/"/g, '""') + '"' : text;
}
/** Builds the export as an array of chunks; Blob takes it without a join. */
function exportParts(format, from, to) {
  const view = state.view;
  const cols = view.cols, n = cols.length;
  const parts = [];
  const sep = format === "tsv" ? "\t" : ",";
  if (format === "json") {
    parts.push("[\n");
    for (let r = from; r < to; r++) {
      const obj = {};
      for (let ci = 0; ci < n; ci++) obj[cols[ci].name] = exportJson(viewValue(view, ci, r), cols[ci].spec);
      parts.push("  " + JSON.stringify(obj) + (r < to - 1 ? ",\n" : "\n"));
    }
    parts.push("]\n");
    return parts;
  }
  parts.push(cols.map((c) => csvField(c.name, sep)).join(sep) + "\n");
  let row = new Array(n);
  for (let r = from; r < to; r++) {
    for (let ci = 0; ci < n; ci++) row[ci] = csvField(exportText(viewValue(view, ci, r), cols[ci].spec), sep);
    parts.push(row.join(sep) + "\n");
  }
  return parts;
}
function exportName(ext) {
  const base = (state.src && state.src.name ? state.src.name : "parquet").replace(/\.[^.]*$/, "");
  const v = state.view;
  return base + (v && v.label ? "-" + v.label : "") + "." + ext;
}
function exportScope() {
  return $("expscope") && $("expscope").value === "view" ? [0, state.view.count] : pageBounds();
}
function download(parts, mime, filename) {
  const url = URL.createObjectURL(new Blob(parts, { type: mime }));
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
const COPY_LIMIT = 200000;
function doExport(format) {
  if (!state.view) return;
  const [from, to] = exportScope();
  if (format === "copy") {
    const rows = Math.min(to, from + COPY_LIMIT);
    const text = exportParts("tsv", from, rows).join("");
    const say = (msg) => { const b = $("expcopy"); b.textContent = msg; setTimeout(() => { b.textContent = "copy"; }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(() => say(rows < to ? "copied " + num(rows - from) : "copied"))
        .catch(() => say("blocked"));
    } else say("blocked");
    return;
  }
  const ext = format === "tsv" ? "tsv" : format;
  const mime = format === "json" ? "application/json"
    : format === "tsv" ? "text/tab-separated-values" : "text/csv";
  download(exportParts(format, from, to), mime + ";charset=utf-8", exportName(ext));
}

/* ---------------------------------------------------------------- grid */
function summaryCard(col) {
  const s = col.summary, spec = col.spec;
  if (!s) return "";
  const out = [];
  const kv = (k, v) => '<div class="kv"><span class="lab">' + k + "</span><span>" + v + "</span></div>";
  out.push(kv("nulls", s.nulls ? num(s.nulls) + " &middot; " + pct(s.nulls, s.n) : "0"));
  const valid = s.n - s.nulls;
  out.push('<div class="nullbar"><i class="v" style="width:' + (s.n ? valid / s.n * 100 : 0) +
    '%"></i><i class="n" style="width:' + (s.n ? s.nulls / s.n * 100 : 0) + '%"></i></div>');

  if (spec.kind === "bool") {
    const t = s.trues, f = s.falses, tot = s.n || 1;
    out.push('<div class="bools"><i class="t" style="width:' + (t / tot * 100) + '%">' + (t / tot > 0.14 ? t : "") +
      '</i><i class="f" style="width:' + (f / tot * 100) + '%">' + (f / tot > 0.14 ? f : "") +
      '</i><i class="n" style="width:' + (s.nulls / tot * 100) + '%"></i></div>');
    out.push(kv("true", num(t) + " &middot; " + pct(t, tot)));
    out.push(kv("false", num(f) + " &middot; " + pct(f, tot)));
  } else if (spec.kind === "number" || spec.kind === "temporal") {
    if (!s.count) { out.push(kv("values", "0")); }
    else {
      out.push(kv("min", esc(s.minText)));
      out.push(kv("max", esc(s.maxText)));
      out.push(kv("mean", esc(s.meanText)));
      if (s.max > s.min) {                       /* a constant column has no shape to draw */
        let peak = 1;
        for (const h of s.hist) if (h > peak) peak = h;
        let bars = "";
        for (let i = 0; i < s.hist.length; i++) {
          bars += '<i style="height:' + Math.max(3, s.hist[i] / peak * 100) + '%" title="' + s.hist[i] + '"></i>';
        }
        out.push('<div class="hist">' + bars + "</div>");
      }
      if (s.nonFinite) out.push(kv("nan/inf", num(s.nonFinite)));
    }
  } else if (spec.kind === "string") {
    out.push(kv("distinct", (s.distinctCapped ? "&ge;" : "") + num(s.distinct || 0)));
    if (s.top) {
      let rows = "";
      const top = s.top[0] ? s.top[0][1] : 1;
      for (const pair of s.top) {
        const v = pair[0], c = pair[1];
        rows += '<div class="row" title="' + esc(v) + '"><i style="width:' + (c / top * 100) + '%"></i>' +
          "<span>" + (v === "" ? '<em class="null">(empty)</em>' : esc(v)) + '</span><span class="c">' +
          num(c) + "</span></div>";
      }
      out.push('<div class="top">' + rows + "</div>");
    }
    out.push(kv("length", s.count ? s.minLen + "-" + s.maxLen : "-"));
  } else if (spec.kind === "nested") {
    out.push(kv("empty", num(s.empties || 0)));
    out.push(kv("length", s.count ? s.minLen + "-" + s.maxLen : "-"));
    out.push(kv("avg length", s.count ? s.meanLen.toFixed(2) : "-"));
  } else {
    out.push(kv("size", s.count ? bytesHuman(s.minLen) + " - " + bytesHuman(s.maxLen) : "-"));
    out.push(kv("avg size", s.count ? bytesHuman(Math.round(s.meanLen)) : "-"));
  }
  return '<div class="sum">' + out.join("") + "</div>";
}

function renderGrid() {
  const view = state.view;
  if (!view) return;
  const grid = $("grid");
  const cols = view.cols;
  let html = "<colgroup><col style='width:62px'>";
  for (let i = 0; i < cols.length; i++) {
    if (!cols[i].width) cols[i].width = COL_W;
    html += "<col style='width:" + cols[i].width + "px'>";
  }
  html += "</colgroup><thead><tr class='r-name'><th class='rownum'>#</th>";
  for (let i = 0; i < cols.length; i++) {
    const c = cols[i];
    const title = (c.leaf ? c.leaf.path.join(".") : c.name) + "  -  " + c.spec.label +
      (c.leaf ? " (" + c.spec.physical + ", " + c.leaf.rep.toLowerCase() + ")" : "");
    html += "<th class='sortable' title='" + esc(title) + " — click to sort, shift-click to add a key'>" +
      sortMark(i) + "<span class='cname'>" + esc(c.name) +
      "</span><span class='ctype t-" + c.spec.kind + "'>" + esc(c.spec.label) +
      (c.leaf && c.leaf.rep === "OPTIONAL" && !c.spec.nested ? "?" : "") +
      "</span><i class='grip' data-col='" + i + "' title='Drag to resize, double-click to reset'></i></th>";
  }
  html += "</tr><tr class='r-sum'><th class='rownum'></th>";
  for (const c of cols) html += "<th>" + summaryCard(c) + "</th>";
  html += "</tr></thead><tbody id='tbody'></tbody>";
  grid.innerHTML = html;

  /* Per-column alignment and colour go in one stylesheet keyed by position,
     so a body cell can be a bare <td> - at 40 columns that is the difference
     between a smooth scroll and a stuttering one. */
  let css = "";
  const pins = pinnedCount();
  let pinLeft = 62;                                   /* past the row-number column */
  for (let i = 0; i < cols.length; i++) {
    const kind = cols[i].spec.kind;
    const nth = "#grid td:nth-child(" + (i + 2) + ")";
    if (kind === "number") css += nth + "{text-align:right}";
    else if (kind === "bool") css += nth + "{color:var(--bool)}";
    else if (kind === "binary" || kind === "nested") css += nth + "{color:var(--dim)}";
    if (i < pins) {
      const n = i + 2;
      css += "#grid tbody td:nth-child(" + n + "){position:sticky;left:" + pinLeft + "px;z-index:2}";
      css += "#grid thead th:nth-child(" + n + "){left:" + pinLeft + "px;z-index:5}";
      css += "#grid tbody td:nth-child(" + n + "),#grid thead th:nth-child(" + n +
        "){border-right:1px solid var(--line)}";
      pinLeft += cols[i].width || COL_W;
    }
  }
  $("colstyle").textContent = css;

  $("gridwrap").hidden = false;
  $("drop").hidden = true;
  const nameRow = grid.querySelector("tr.r-name");
  document.documentElement.style.setProperty("--nameh", nameRow.offsetHeight + "px");
  state.first = -1;
  renderRows(true);
}

function renderRows(force) {
  const view = state.view;
  if (!view) return;
  const wrap = $("gridwrap"), body = $("tbody");
  if (!body) return;
  const [pageStart, pageEnd] = pageBounds();
  const total = pageEnd - pageStart;
  const ncols = view.cols.length;
  let first, visible;
  if (total * ncols <= CELL_BUDGET) {
    /* A small page goes into the DOM whole. Scrolling then costs nothing at
       all: the early return below sees the same window every time. Replacing
       the tbody is a fixed cost regardless of row count, so drawing 100 rows
       is no dearer than drawing the 35 that happen to be on screen. */
    first = 0;
    visible = total;
  } else {
    const head = wrap.querySelector("thead").offsetHeight;
    const viewport = wrap.clientHeight;
    const scroll = Math.max(0, wrap.scrollTop - head);
    visible = Math.ceil(viewport / ROW_H) + 12;
    first = Math.max(0, Math.floor(scroll / ROW_H) - 6);
    if (first + visible > total) first = Math.max(0, total - visible);
  }
  if (!force && first === state.first) return;
  state.first = first;
  const last = Math.min(total, first + visible);
  const cols = view.cols;
  const index = view.index;
  const span = ncols + 1;
  const specs = new Array(ncols), data = new Array(ncols);
  for (let i = 0; i < ncols; i++) { specs[i] = cols[i].spec; data[i] = cols[i].rows; }
  const parts = [];
  if (first > 0) {
    parts.push("<tr><td class='pad' colspan='" + span + "' style='height:" + first * ROW_H + "px'></td></tr>");
  }
  for (let r = first; r < last; r++) {
    const abs = pageStart + r;
    const src = index ? index[abs] : abs;
    parts.push("<tr data-r='", String(abs), "'><td class='rownum'>", String((view.agg ? abs : src) + 1), "</td>");
    for (let ci = 0; ci < ncols; ci++) {
      const v = data[ci][src];
      if (v === null || v === undefined) { parts.push("<td class='null'>null</td>"); continue; }
      let text = fmtValue(v, specs[ci]);
      if (text.length > 300) text = text.slice(0, 300) + "...";
      /* only long values need the tooltip, and skipping it halves the markup */
      parts.push(text.length > 22 ? "<td title='" + esc(text) + "'>" : "<td>", esc(text), "</td>");
    }
    parts.push("</tr>");
  }
  if (last < total) {
    parts.push("<tr><td class='pad' colspan='" + span + "' style='height:" + (total - last) * ROW_H + "px'></td></tr>");
  }
  body.innerHTML = parts.join("");
  if (state.inspectAt) closeInspector();
}

/* -------------------------------------------------------- column picker */
function refreshView(keepPage) {
  const page = state.page;
  if (state.query && state.query.active) runQuery();
  else setView(baseView(state.table));
  if (keepPage) { state.page = page; state.first = -1; renderRows(true); renderPager(); }
}
function renderPicker() {
  const table = state.table, d = state.display;
  if (!table || !d) return;
  const needle = ($("cpsearch") ? $("cpsearch").value : "").trim().toLowerCase();
  const order = d.order.filter((ci) => d.pinned.has(ci)).concat(d.order.filter((ci) => !d.pinned.has(ci)));
  let rows = "";
  for (const ci of order) {
    const c = table.cols[ci];
    if (!c) continue;
    if (needle && c.name.toLowerCase().indexOf(needle) < 0 && c.spec.label.toLowerCase().indexOf(needle) < 0) continue;
    const shown = !d.hidden.has(ci), pinned = d.pinned.has(ci);
    rows += "<div class='cprow" + (pinned ? " pinned" : "") + "' draggable='true' data-ci='" + ci + "'>" +
      "<span class='qgrab'>∷</span>" +
      "<input type='checkbox' data-act='cpshow' data-ci='" + ci + "'" + (shown ? " checked" : "") + ">" +
      "<span class='cpname" + (shown ? "" : " off") + "' title='" + esc(c.name) + "'>" + esc(c.name) + "</span>" +
      "<span class='qtag t-" + c.spec.kind + "'>" + typeTag(c.spec) + "</span>" +
      "<button class='cppin" + (pinned ? " on" : "") + "' data-act='cppin' data-ci='" + ci +
      "' title='" + (pinned ? "Unpin" : "Pin to the left") + "'>pin</button></div>";
  }
  const hidden = d.hidden.size;
  $("cphead").innerHTML = "<b>" + num(table.cols.length - hidden) + " of " + num(table.cols.length) +
    " columns</b><span class='grow'></span>" +
    "<button data-act='cpall' title='Show every column'>all</button>" +
    "<button data-act='cponly' title='Hide all but the first'>none</button>" +
    "<button data-act='cpclose'>×</button>";
  $("cplist").innerHTML = rows || "<div class='qhint' style='padding:8px'>no column matches</div>";
}
function togglePicker(show) {
  const el = $("colpick");
  const open = show === undefined ? el.hidden : show;
  el.hidden = !open;
  if (!open) return;
  renderPicker();
  const box = $("toggleCols").getBoundingClientRect();
  el.style.top = box.bottom + 4 + "px";
  el.style.left = Math.max(8, Math.min(box.left, window.innerWidth - el.offsetWidth - 8)) + "px";
  $("cpsearch").focus();
}
function initPicker() {
  $("toggleCols").addEventListener("click", () => togglePicker());
  $("cpsearch").addEventListener("input", renderPicker);
  const act = (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const d = state.display, ci = +el.dataset.ci;
    switch (el.dataset.act) {
      case "cpshow": if (d.hidden.has(ci)) d.hidden.delete(ci); else d.hidden.add(ci); break;
      case "cppin": if (d.pinned.has(ci)) d.pinned.delete(ci); else d.pinned.add(ci); break;
      case "cpall": d.hidden.clear(); break;
      case "cponly": {
        /* leaving everything hidden would be a blank grid, so keep the first */
        d.hidden = new Set(state.table.cols.map((c, i) => i).filter((i) => i !== displayOrder()[0]));
        break;
      }
      case "cpclose": togglePicker(false); return;
      default: return;
    }
    renderPicker();
    refreshView(true);
  };
  $("cphead").addEventListener("click", act);
  $("cplist").addEventListener("click", act);
  $("cplist").addEventListener("change", act);
  let dragging = null;
  $("cplist").addEventListener("dragstart", (e) => {
    const row = e.target.closest(".cprow");
    if (!row) return;
    dragging = +row.dataset.ci;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(dragging));
  });
  $("cplist").addEventListener("dragover", (e) => {
    const row = e.target.closest(".cprow");
    if (!row || dragging === null) return;
    e.preventDefault();
    for (const r of $("cplist").children) r.classList.remove("dropafter", "dropbefore");
    const box = row.getBoundingClientRect();
    row.classList.add(e.clientY > box.top + box.height / 2 ? "dropafter" : "dropbefore");
  });
  $("cplist").addEventListener("drop", (e) => {
    const row = e.target.closest(".cprow");
    if (!row || dragging === null) return;
    e.preventDefault();
    const target = +row.dataset.ci;
    const after = e.clientY > row.getBoundingClientRect().top + row.offsetHeight / 2;
    const d = state.display;
    d.order = d.order.filter((ci) => ci !== dragging);
    const at = d.order.indexOf(target);
    d.order.splice(at < 0 ? d.order.length : at + (after ? 1 : 0), 0, dragging);
    dragging = null;
    renderPicker();
    refreshView(true);
  });
  $("cplist").addEventListener("dragend", () => {
    dragging = null;
    for (const r of $("cplist").children) r.classList.remove("dropafter", "dropbefore");
  });
  document.addEventListener("pointerdown", (e) => {
    if (!$("colpick").hidden && !e.target.closest("#colpick") && !e.target.closest("#toggleCols")) {
      togglePicker(false);
    }
  }, true);
}

/* ------------------------------------------------------- cell inspector */
function hexDump(bytes) {
  const lines = [];
  for (let off = 0; off < bytes.length; off += 16) {
    const slice = bytes.subarray(off, off + 16);
    let h = "", a = "";
    for (let i = 0; i < 16; i++) {
      h += i < slice.length ? HEX[slice[i]] + (i === 7 ? "  " : " ") : (i === 7 ? "    " : "   ");
      if (i < slice.length) { const c = slice[i]; a += c >= 32 && c < 127 ? String.fromCharCode(c) : "."; }
    }
    lines.push(off.toString(16).padStart(8, "0") + "  " + h + " |" + a + "|");
  }
