/* ======================================================================
   Query builder — drop columns into zones, run it over the decoded rows.
   The generated SQL is shown for the record; the engine below is what
   actually executes, straight over the column arrays already in memory.
   ====================================================================== */
const PREDS = [
  { id: "eq", label: "=", sql: "=" },
  { id: "ne", label: "≠", sql: "<>" },
  { id: "lt", label: "<", sql: "<" },
  { id: "le", label: "≤", sql: "<=" },
  { id: "gt", label: ">", sql: ">" },
  { id: "ge", label: "≥", sql: ">=" },
  { id: "like", label: "LIKE", sql: "LIKE" },
  { id: "between", label: "BTW", sql: "BETWEEN" },
  { id: "null", label: "NULL", sql: "IS NULL" },
  { id: "notnull", label: "!NULL", sql: "IS NOT NULL" },
];
const NO_OPERAND = { null: 1, notnull: 1 };
const AGGS = ["COUNT", "COUNT_DISTINCT", "SUM", "AVG", "MIN", "MAX"];
const AGG_SHORT = { COUNT: "COUNT", COUNT_DISTINCT: "CNTD", SUM: "SUM", AVG: "AVG", MIN: "MIN", MAX: "MAX" };
const AGG_BY_NAME = { COUNT: "COUNT", SUM: "SUM", AVG: "AVG", MIN: "MIN", MAX: "MAX" };
let qid = 0;

function newQuery() {
  return { active: false, mode: "rows", select: [], filters: [], sort: [], groupBy: [], metrics: [], limit: null };
}

/* -------------------------------------------------------- value parsing */
function parseTemporal(text, spec) {
  const t = text.trim();
  if (/^-?\d+(\.\d+)?$/.test(t)) return parseFloat(t);          /* raw epoch millis */
  if (spec.sub === "time") {
    const m = t.match(/^(\d{1,2}):(\d{2})(?::(\d{2})(?:\.(\d+))?)?$/);
    if (!m) return NaN;
    return ((+m[1] * 60 + +m[2]) * 60 + (+m[3] || 0)) * 1000 + (m[4] ? +(m[4] + "000").slice(0, 3) : 0);
  }
  const m = t.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2})(?:\.(\d+))?)?)?Z?$/);
  if (!m) return NaN;
  return Date.UTC(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0),
    m[7] ? +(m[7] + "000").slice(0, 3) : 0);
}
function parseOperand(text, spec) {
  const t = String(text).trim();
  if (spec.kind === "number") return parseFloat(t);
  if (spec.kind === "temporal") return parseTemporal(t, spec);
  if (spec.kind === "bool") return /^(true|t|1|y|yes)$/i.test(t) ? 1 : 0;
  return t;
}
/** Numeric key for a stored value, or null when the column compares as text. */
function sortKey(spec) {
  if (spec.kind === "bool") return (v) => (v === true ? 1 : v === false ? 0 : NaN);
  if (spec.kind === "number" || spec.kind === "temporal") return numeric;
  return null;
}
function textOf(v, spec) {
  return spec.kind === "string" ? v : fmtValue(v, spec);
}

/* ------------------------------------------------------------- filtering */
/** Compiles one clause into a row test, or null if it is not filled in yet. */
function compileFilter(f, cols) {
  const col = cols[f.ci];
  if (!col) return null;
  const rows = col.rows, spec = col.spec, p = f.pred;
  if (p === "null") return (r) => rows[r] === null || rows[r] === undefined;
  if (p === "notnull") return (r) => rows[r] !== null && rows[r] !== undefined;
  if (f.value === "" || f.value == null) return null;
  if (p === "like") {
    const needle = String(f.value).toLowerCase();
    return (r) => {
      const v = rows[r];
      return v !== null && v !== undefined && String(textOf(v, spec)).toLowerCase().indexOf(needle) >= 0;
    };
  }
  const key = sortKey(spec);
  if (!key) {                                   /* text comparison */
    const a = String(f.value), b = String(f.valueTo == null ? f.value : f.valueTo);
    const get = (r) => { const v = rows[r]; return v === null || v === undefined ? null : String(textOf(v, spec)); };
    switch (p) {
      case "eq": return (r) => get(r) === a;
      case "ne": return (r) => { const x = get(r); return x !== null && x !== a; };
      case "lt": return (r) => { const x = get(r); return x !== null && x < a; };
      case "le": return (r) => { const x = get(r); return x !== null && x <= a; };
      case "gt": return (r) => { const x = get(r); return x !== null && x > a; };
      case "ge": return (r) => { const x = get(r); return x !== null && x >= a; };
      case "between": return (r) => { const x = get(r); return x !== null && x >= a && x <= b; };
      default: return null;
    }
  }
  const a = parseOperand(f.value, spec);
  if (!isFinite(a)) return null;
  const b = f.valueTo == null || f.valueTo === "" ? a : parseOperand(f.valueTo, spec);
  switch (p) {
    case "eq": return (r) => key(rows[r]) === a;
    case "ne": return (r) => { const x = key(rows[r]); return x === x && x !== a; };
    case "lt": return (r) => key(rows[r]) < a;
    case "le": return (r) => key(rows[r]) <= a;
    case "gt": return (r) => key(rows[r]) > a;
    case "ge": return (r) => key(rows[r]) >= a;
    case "between": return (r) => { const x = key(rows[r]); return x >= a && x <= b; };
    default: return null;
  }
}
/**
 * Why a clause will not be applied: "empty" if no value has been typed yet,
 * "invalid" if what was typed is not a value this column could hold. Either
 * way the clause is skipped, and the UI says so rather than quietly widening
 * the result.
 */
function filterIssue(f, cols) {
  const col = cols[f.ci];
  if (!col) return "missing";
  if (NO_OPERAND[f.pred]) return null;
  if (f.value === "" || f.value == null) return "empty";
  if (f.pred === "like") return null;
  if (!sortKey(col.spec)) return null;                 /* text compares anything */
  if (!isFinite(parseOperand(f.value, col.spec))) return "invalid";
  if (f.pred === "between" && f.valueTo !== "" && f.valueTo != null &&
      !isFinite(parseOperand(f.valueTo, col.spec))) return "invalid";
  return null;
}

/** AND binds tighter than OR, so the clauses become OR-ed groups of ANDs. */
function orGroups(filters, cols) {
  const groups = [];
  let current = null;
  for (const f of filters) {
    const test = compileFilter(f, cols);
    if (!test) continue;
    if (!current || f.linker === "OR") { current = []; groups.push(current); }
    current.push(test);
  }
  return groups;
}

function buildComparator(sorts, cols) {
  const parts = sorts.map((s) => {
    const col = cols[s.ci];
    const rows = col.rows, key = sortKey(col.spec), spec = col.spec;
    const sign = s.dir === "DESC" ? -1 : 1;
    if (key) {
      return (x, y) => {
        const a = key(rows[x]), b = key(rows[y]);
        const an = a !== a || a === undefined, bn = b !== b || b === undefined;
        if (an || bn) return an && bn ? 0 : an ? 1 : -1;     /* nulls last */
        return a < b ? -sign : a > b ? sign : 0;
      };
    }
    return (x, y) => {
      const va = rows[x], vb = rows[y];
      const an = va === null || va === undefined, bn = vb === null || vb === undefined;
      if (an || bn) return an && bn ? 0 : an ? 1 : -1;
      const a = String(textOf(va, spec)), b = String(textOf(vb, spec));
      return a < b ? -sign : a > b ? sign : 0;
    };
  });
  return (x, y) => {
    for (let i = 0; i < parts.length; i++) { const c = parts[i](x, y); if (c) return c; }
    return x - y;
  };
}

/* ------------------------------------------------------------ aggregates */
/* a group key joins its parts with \u0001 and writes null as \u0000, so no
   two group values can collide by running into each other */
const keyPart = (v) => (v === null || v === undefined ? "\u0000" : typeof v === "object" ? JSON.stringify(v) : String(v));

function aggregate(q, cols, index, n) {
  const gcis = q.groupBy;
  const metrics = q.metrics.filter((m) => cols[m.ci]);
  const gRows = gcis.map((ci) => cols[ci].rows);
  const mRows = metrics.map((m) => cols[m.ci].rows);
  const mKeys = metrics.map((m) => sortKey(cols[m.ci].spec));
  const mSpecs = metrics.map((m) => cols[m.ci].spec);
  const groups = new Map();
  const total = index ? index.length : n;

  for (let i = 0; i < total; i++) {
    const r = index ? index[i] : i;
    let key = "";
    for (let g = 0; g < gRows.length; g++) key += keyPart(gRows[g][r]) + "\u0001";
    let acc = groups.get(key);
    if (!acc) {
      acc = { row: r, m: metrics.map(() => ({ n: 0, sum: 0, c: 0, min: null, max: null, set: null })) };
      groups.set(key, acc);
    }
    for (let m = 0; m < metrics.length; m++) {
      const v = mRows[m][r];
      if (v === null || v === undefined) continue;
      const a = acc.m[m];
      a.n++;
      const kind = metrics[m].agg;
      if (kind === "SUM" || kind === "AVG") {
        const x = mKeys[m] ? mKeys[m](v) : NaN;
        if (x === x) {
          /* Neumaier summation: adding a million doubles naively drifts, and
             the lost low bits are exactly what a mean is made of */
          const t = a.sum + x;
          a.c += Math.abs(a.sum) >= Math.abs(x) ? (a.sum - t) + x : (x - t) + a.sum;
          a.sum = t;
        }
      }
      else if (kind === "COUNT_DISTINCT") { (a.set || (a.set = new Set())).add(keyPart(v)); }
      else if (kind === "MIN" || kind === "MAX") {
        const cmpLess = mKeys[m]
          ? (x, y) => lessThan(x, y)
          : (x, y) => String(textOf(x, mSpecs[m])) < String(textOf(y, mSpecs[m]));
        if (a.min === null || cmpLess(v, a.min)) a.min = v;
        if (a.max === null || cmpLess(a.max, v)) a.max = v;
      }
    }
  }

  const outCols = [];
  for (const ci of gcis) outCols.push({ name: cols[ci].name, spec: cols[ci].spec, leaf: cols[ci].leaf, rows: [] });
  const countSpec = { kind: "number", label: "count", physical: "INT64", convert: (v) => v };
  for (const m of metrics) {
    const src = cols[m.ci];
    const isCount = m.agg === "COUNT" || m.agg === "COUNT_DISTINCT";
    const keeps = m.agg === "MIN" || m.agg === "MAX";
    outCols.push({
      name: m.alias || AGG_SHORT[m.agg] + "(" + src.name + ")",
      spec: isCount ? countSpec : keeps ? src.spec : { kind: "number", label: m.agg.toLowerCase(), physical: src.spec.physical, convert: (v) => v },
      rows: [],
    });
  }
  for (const acc of groups.values()) {
    let k = 0;
    for (const ci of gcis) outCols[k++].rows.push(cols[ci].rows[acc.row]);
    for (let m = 0; m < metrics.length; m++) {
      const a = acc.m[m], kind = metrics[m].agg;
      let v = null;
      if (kind === "COUNT") v = a.n;
      else if (kind === "COUNT_DISTINCT") v = a.set ? a.set.size : 0;
      else if (kind === "SUM") v = a.n ? a.sum + a.c : null;
      else if (kind === "AVG") v = a.n ? (a.sum + a.c) / a.n : null;
      else if (kind === "MIN") v = a.min;
      else if (kind === "MAX") v = a.max;
      outCols[k++].rows.push(v);
    }
  }
  return outCols;
}

/* -------------------------------------------------------------- running */
function runQuery() {
  const q = state.query, table = state.table;
  if (!table) return;
  const t0 = performance.now();
  const cols = table.cols, n = table.rowsLoaded;

  const groups = orGroups(q.filters, cols);
  let index = null;
  if (groups.length) {
    const buf = new Int32Array(n);
    let k = 0;
    for (let r = 0; r < n; r++) {
      for (let g = 0; g < groups.length; g++) {
        const grp = groups[g];
        let ok = true;
        for (let i = 0; i < grp.length; i++) if (!grp[i](r)) { ok = false; break; }
        if (ok) { buf[k++] = r; break; }
      }
    }
    index = buf.slice(0, k);
  }

  let view;
  if (q.mode === "agg" && (q.groupBy.length || q.metrics.length)) {
    const outCols = aggregate(q, cols, index, n);
    let count = outCols.length ? outCols[0].rows.length : 0;
    const order = aggSort(q, cols, outCols);
    if (order) {
      const idx = new Int32Array(count);
      for (let i = 0; i < count; i++) idx[i] = i;
      idx.sort(buildComparator(order, outCols));
      for (const c of outCols) { const src = c.rows; c.rows = new Array(count); for (let i = 0; i < count; i++) c.rows[i] = src[idx[i]]; }
    }
    if (q.limit != null && q.limit < count) { count = q.limit; for (const c of outCols) c.rows.length = count; }
    view = { cols: outCols, index: null, count, agg: true, label: "grouped" };
  } else {
    const outCols = q.select.length ? q.select.map((ci) => cols[ci]).filter(Boolean) : displayCols(cols);
    if (q.sort.length) {
      if (!index) { index = new Int32Array(n); for (let i = 0; i < n; i++) index[i] = i; }
      index.sort(buildComparator(q.sort, cols));
    }
    let count = index ? index.length : n;
    if (q.limit != null && q.limit < count) {
      count = q.limit;
      if (index) index = index.subarray(0, count);
    }
    view = { cols: outCols, index, count, agg: false,
      label: !index ? (count < n ? "limited" : null) : groups.length ? "filtered" : "sorted" };
  }
  q.active = true;
  const ms = Math.round(performance.now() - t0);
  setView(view);
  const skipped = q.filters.filter((f) => filterIssue(f, cols)).length;
  $("qstat").innerHTML = "<b>" + num(view.count) + "</b> " + (view.agg ? "groups" : "rows") +
    " from " + num(n) + (table.truncated ? " read" : "") + " &middot; " + ms + " ms" +
    (skipped ? " &middot; <em class='qwarn'>" + skipped + " clause" + (skipped === 1 ? "" : "s") +
      " skipped</em>" : "");
  $("qclear").disabled = false;
}
/** Which output column a sort clause means in aggregate mode, or -1. */
function aggSortIndex(q, s) {
  if (s.mid) {
    const m = q.metrics.findIndex((x) => x.id === s.mid);
    return m >= 0 ? q.groupBy.length + m : -1;
  }
  const g = q.groupBy.indexOf(s.ci);
  if (g >= 0) return g;
  const m = q.metrics.findIndex((x) => x.ci === s.ci);
  return m >= 0 ? q.groupBy.length + m : -1;
}
/** In aggregate mode, ORDER BY can only mean one of the output columns. */
function aggSort(q, cols, outCols) {
  const order = [];
  for (const s of q.sort) {
    const at = aggSortIndex(q, s);
    if (at >= 0 && at < outCols.length) order.push({ ci: at, dir: s.dir });
  }
  return order.length ? order : null;
}
/**
 * Clicking a column header edits the query's ORDER BY, so the header arrows,
 * the ORDER BY zone and the SQL never disagree about how the rows are sorted.
 * Shift-click adds a key instead of replacing.
 */
function toggleSort(viewIdx, additive) {
  const view = state.view, q = state.query, table = state.table;
  if (!view || !table) return;
  const col = view.cols[viewIdx];
  if (!col) return;
  let ci = table.cols.indexOf(col), mid = null;
  if (ci < 0 && view.agg) {
    if (viewIdx < q.groupBy.length) ci = q.groupBy[viewIdx];
    else {
      const m = q.metrics[viewIdx - q.groupBy.length];
      if (m) { ci = m.ci; mid = m.id; }
    }
  }
  if (ci < 0) return;
  const same = (s) => (mid ? s.mid === mid : !s.mid && s.ci === ci);
  const at = q.sort.findIndex(same);
  const fresh = () => ({ id: "s" + ++qid, ci, dir: "ASC", mid });
  if (!additive) {
    if (at < 0) q.sort = [fresh()];
    else if (q.sort[at].dir === "ASC") q.sort = [Object.assign(q.sort[at], { dir: "DESC" })];
    else q.sort = [];
  } else if (at < 0) q.sort.push(fresh());
  else if (q.sort[at].dir === "ASC") q.sort[at].dir = "DESC";
  else q.sort.splice(at, 1);
  renderQuery();
  runQuery();
}
/** The arrow a header shows: direction, plus its place when there are several. */
function sortMark(viewIdx) {
  const view = state.view, q = state.query, table = state.table;
  if (!view || !q || !q.sort.length) return "";
  const col = view.cols[viewIdx];
  let at = -1;
  if (view.agg) {
    at = q.sort.findIndex((s) => aggSortIndex(q, s) === viewIdx);
  } else {
    const ci = table.cols.indexOf(col);
    at = ci < 0 ? -1 : q.sort.findIndex((s) => !s.mid && s.ci === ci);
  }
  if (at < 0) return "";
  return "<span class='sortmark'>" + (q.sort[at].dir === "ASC" ? "▲" : "▼") +
    (q.sort.length > 1 ? "<i>" + (at + 1) + "</i>" : "") + "</span>";
}

function resetQuery() {
  const mode = state.query ? state.query.mode : "rows";
  state.query = newQuery();
  state.query.mode = mode;
  $("qstat").textContent = "";
  $("qclear").disabled = true;
  if (state.table) setView(baseView(state.table));
  renderQuery();
}

/* ------------------------------------------------------------ SQL text */
function sqlIdent(name) {
  return /^[A-Za-z_][A-Za-z0-9_]*$/.test(name) ? name : '"' + name.replace(/"/g, '""') + '"';
}
function sqlLiteral(text, spec) {
  if (spec.kind === "number" && isFinite(parseFloat(text))) return String(parseFloat(text));
  if (spec.kind === "bool") return /^(true|t|1|y|yes)$/i.test(String(text).trim()) ? "TRUE" : "FALSE";
  return "'" + String(text).replace(/'/g, "''") + "'";
}
function querySql() {
  const q = state.query, table = state.table;
  if (!table) return "";
  const cols = table.cols;
  const from = (state.src && state.src.name ? state.src.name : "parquet").replace(/\.[^.]*$/, "");
  const lines = [];
  if (q.mode === "agg" && (q.groupBy.length || q.metrics.length)) {
    const sel = q.groupBy.map((ci) => sqlIdent(cols[ci].name));
    for (const m of q.metrics) {
      if (!cols[m.ci]) continue;
      const inner = sqlIdent(cols[m.ci].name);
      const fn = m.agg === "COUNT_DISTINCT" ? "COUNT(DISTINCT " + inner + ")" : m.agg + "(" + inner + ")";
      sel.push(m.alias ? fn + " AS " + sqlIdent(m.alias) : fn);
    }
    lines.push("SELECT " + (sel.length ? sel.join(",\n       ") : "*"));
  } else if (q.select.length) {
    lines.push("SELECT " + q.select.map((ci) => sqlIdent(cols[ci].name)).join(",\n       "));
  } else {
    lines.push("SELECT *");
  }
  lines.push("FROM " + sqlIdent(from));
  let pending = false;
  q.filters.forEach((f, i) => {
    const col = cols[f.ci];
    if (!col) return;
    const p = PREDS.find((x) => x.id === f.pred) || PREDS[0];
    let clause;
    if (NO_OPERAND[f.pred]) clause = sqlIdent(col.name) + " " + p.sql;
    else if (filterIssue(f, cols)) {
      /* no usable value yet: shown so the shape is visible, but not run */
      clause = sqlIdent(col.name) + " " + p.sql + " ?";
      pending = true;
    } else if (f.pred === "between") {
      clause = sqlIdent(col.name) + " BETWEEN " + sqlLiteral(f.value, col.spec) +
        " AND " + sqlLiteral(f.valueTo == null ? f.value : f.valueTo, col.spec);
    } else if (f.pred === "like") clause = sqlIdent(col.name) + " LIKE '%" + String(f.value).replace(/'/g, "''") + "%'";
    else clause = sqlIdent(col.name) + " " + p.sql + " " + sqlLiteral(f.value, col.spec);
    lines.push((i === 0 ? "WHERE " : "  " + (f.linker || "AND") + " ") + clause);
  });
  if (q.mode === "agg" && q.groupBy.length) {
    lines.push("GROUP BY " + q.groupBy.map((ci) => sqlIdent(cols[ci].name)).join(", "));
  }
  const agg = q.mode === "agg" && (q.groupBy.length || q.metrics.length);
  const order = [];
  for (const st of q.sort) {
    const col = cols[st.ci];
    if (!col) continue;
    if (!agg) { order.push(sqlIdent(col.name) + " " + st.dir); continue; }
    /* an aggregate can only be ordered by something it actually selects */
    if (!st.mid && q.groupBy.indexOf(st.ci) >= 0) { order.push(sqlIdent(col.name) + " " + st.dir); continue; }
    const m = st.mid ? q.metrics.find((x) => x.id === st.mid) : q.metrics.find((x) => x.ci === st.ci);
    if (m) {
      const inner = sqlIdent(col.name);
      order.push((m.alias ? sqlIdent(m.alias)
        : m.agg === "COUNT_DISTINCT" ? "COUNT(DISTINCT " + inner + ")" : m.agg + "(" + inner + ")") + " " + st.dir);
    }
  }
  if (order.length) lines.push("ORDER BY " + order.join(", "));
  if (q.limit != null) lines.push("LIMIT " + q.limit);
  return lines.join("\n") + ";" +
    (pending ? "\n\n-- clauses shown with ? are skipped: no value, or it does not\n" +
      "-- parse as this column's type" : "");
}


/* ======================================================================
   Reading SQL back
   The panel beside the zones is editable, so the SQL has to parse as well
   as print. This covers exactly what the builder can hold; anything else
   is named and refused rather than quietly half-applied.
   ====================================================================== */
const SQL_KEYWORDS = {
  SELECT: 1, FROM: 1, WHERE: 1, GROUP: 1, ORDER: 1, BY: 1, LIMIT: 1, AND: 1, OR: 1, NOT: 1,
  IS: 1, NULL: 1, LIKE: 1, BETWEEN: 1, AS: 1, ASC: 1, DESC: 1, DISTINCT: 1, TRUE: 1, FALSE: 1,
  HAVING: 1, JOIN: 1, UNION: 1, OFFSET: 1, INNER: 1, LEFT: 1, RIGHT: 1, FULL: 1, OUTER: 1,
  CROSS: 1, ON: 1, CASE: 1, WHEN: 1, WITH: 1, INTO: 1, VALUES: 1, INSERT: 1, UPDATE: 1, DELETE: 1,
};
const SQL_SCAN = /\s+|--[^\n]*|\/\*[\s\S]*?\*\/|'(?:[^']|'')*'|"(?:[^"]|"")*"|[A-Za-z_][A-Za-z_0-9$]*|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|<=|>=|<>|!=|[(),.*<>=;]|\S/g;

function sqlTokenize(text) {
  const out = [];
  SQL_SCAN.lastIndex = 0;
  let m;
  while ((m = SQL_SCAN.exec(text))) {
    const raw = m[0], at = m.index;
    const c = raw[0];
    if (/\s/.test(c) || raw.startsWith("--") || raw.startsWith("/*")) continue;
    if (c === "'") { out.push({ t: "str", v: raw.slice(1, -1).replace(/''/g, "'"), at, raw }); continue; }
    if (c === '"') { out.push({ t: "name", v: raw.slice(1, -1).replace(/""/g, '"'), at, raw, quoted: true }); continue; }
    if (/[0-9]/.test(c)) { out.push({ t: "num", v: parseFloat(raw), at, raw }); continue; }
    if (/[A-Za-z_]/.test(c)) {
      const up = raw.toUpperCase();
      out.push(SQL_KEYWORDS[up] ? { t: "kw", v: up, at, raw } : { t: "name", v: raw, at, raw });
      continue;
    }
    out.push({ t: "op", v: raw, at, raw });
  }
  out.push({ t: "end", v: "", at: text.length, raw: "" });
  return out;
}

/** Cheap edit distance, only used to suggest a column the user meant. */
function nearestName(name, names) {
  const a = name.toLowerCase();
  let best = null, bestScore = Infinity;
  for (const n of names) {
    const b = n.toLowerCase();
    if (Math.abs(a.length - b.length) > 3) continue;
    const d = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) d[j] = j;
    for (let i = 1; i <= a.length; i++) {
      let prev = d[0];
      d[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const t = d[j];
        d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = t;
      }
    }
    if (d[b.length] < bestScore) { bestScore = d[b.length]; best = n; }
  }
  return bestScore <= Math.max(2, Math.ceil(name.length / 3)) ? best : null;
}

const OP_PRED = { "=": "eq", "<>": "ne", "!=": "ne", "<": "lt", "<=": "le", ">": "gt", ">=": "ge" };

/**
 * Parses SQL into the builder's own shape.
 * Returns { query, errors, warnings }; query is null when it cannot be held.
 */
function parseSql(text, cols) {
  const toks = sqlTokenize(text);
  const errors = [], warnings = [];
  let p = 0;
  const at = (t) => (t ? t.at : text.length);
  const fail = (msg, tok) => { errors.push({ msg, at: at(tok || toks[p]) }); };
  /* p can run past the end when a clause is cut short, so every read clamps */
  const tokAt = (i) => toks[Math.min(i, toks.length - 1)];
  const peek = () => tokAt(p);
  const isKw = (w) => peek().t === "kw" && peek().v === w;
  const isOp = (w) => peek().t === "op" && peek().v === w;
  const step = () => { if (p < toks.length - 1) p++; };
  const eatKw = (w) => (isKw(w) ? (step(), true) : false);
  const eatOp = (w) => (isOp(w) ? (step(), true) : false);
  const names = cols.map((c) => c.name);

  const resolve = (tok) => {
    const name = tok.v;
    let i = names.indexOf(name);
    if (i >= 0) return i;
    const lower = name.toLowerCase();
    const hits = [];
    for (let k = 0; k < names.length; k++) if (names[k].toLowerCase() === lower) hits.push(k);
    if (hits.length === 1) return hits[0];
    if (hits.length > 1) { fail('"' + name + '" matches more than one column; quote the exact name', tok); return -1; }
    const near = nearestName(name, names);
    fail('no column named "' + name + '"' + (near ? ' — did you mean "' + near + '"?' : ""), tok);
    return -1;
  };

  const q = { active: false, mode: "rows", select: [], filters: [], sort: [], groupBy: [], metrics: [], limit: null };
  let starSelect = false;
  const selectAggs = [];      /* {ci, agg, alias, tok} */
  const selectPlain = [];     /* {ci, tok} */

  /* ---------------- SELECT ---------------- */
  if (!eatKw("SELECT")) { fail("expected SELECT"); return { query: null, errors, warnings }; }
  if (isKw("DISTINCT")) { fail("SELECT DISTINCT is not supported; use GROUP BY instead"); p++; }
  for (;;) {
    if (eatOp("*")) { starSelect = true; }
    else if (peek().t === "kw" && AGG_BY_NAME[peek().v]) { fail("unexpected keyword " + peek().v); p++; }
    else if (peek().t === "name" && tokAt(p + 1) && tokAt(p + 1).t === "op" && tokAt(p + 1).v === "(") {
      const fnTok = peek();
      const fn = fnTok.v.toUpperCase();
      step(); step();
      let agg = null;
      if (fn === "COUNT" && isKw("DISTINCT")) { p++; agg = "COUNT_DISTINCT"; }
      else if (AGG_BY_NAME[fn]) agg = AGG_BY_NAME[fn];
      else fail(fn + "() is not one of COUNT, SUM, AVG, MIN, MAX", fnTok);
      let ci = -1;
      if (eatOp("*")) {
        if (agg !== "COUNT") fail("only COUNT(*) may take a star", fnTok);
        ci = 0;                                        /* COUNT(*) counts rows */
      } else if (peek().t === "name") ci = resolve((step(), tokAt(p - 1)));
      else fail("expected a column inside " + fn + "()");
      if (!eatOp(")")) fail("expected )");
      let alias = "";
      if (eatKw("AS")) { if (peek().t === "name") alias = (step(), tokAt(p - 1)).v; else fail("expected a name after AS"); }
      else if (peek().t === "name") alias = (step(), tokAt(p - 1)).v;
      if (agg && ci >= 0) selectAggs.push({ ci, agg, alias, tok: fnTok });
    } else if (peek().t === "name") {
      const tok = (step(), tokAt(p - 1));
      const ci = resolve(tok);
      if (eatKw("AS") || peek().t === "name") {
        fail("a plain column cannot be renamed here; only aggregates take an alias", tok);
        if (peek().t === "name") p++;
      }
      if (ci >= 0) selectPlain.push({ ci, tok });
    } else { fail("expected a column, * or an aggregate"); break; }
    if (!eatOp(",")) break;
  }

  /* ---------------- FROM ---------------- */
  if (eatKw("FROM")) {
    if (peek().t === "name") p++;
    else fail("expected a table name after FROM");
    if (isOp(",") || isKw("JOIN") || isKw("INNER") || isKw("LEFT") || isKw("RIGHT") ||
        isKw("FULL") || isKw("CROSS")) {
      fail("one file at a time: joins are not supported");
    }
  } else fail("expected FROM");

  /* ---------------- WHERE ---------------- */
  const parsePredicate = () => {
    const colTok = peek();
    if (colTok.t !== "name") { fail("expected a column name in WHERE", colTok); p++; return null; }
    step();
    const ci = resolve(colTok);
    if (isKw("IS")) {
      step();
      const not = eatKw("NOT");
      if (!eatKw("NULL")) { fail("expected NULL after IS"); return null; }
      return { ci, pred: not ? "notnull" : "null", value: "", linker: "AND" };
    }
    if (isKw("NOT") && tokAt(p + 1) && tokAt(p + 1).t === "kw" &&
        (tokAt(p + 1).v === "LIKE" || tokAt(p + 1).v === "BETWEEN")) {
      fail("NOT " + tokAt(p + 1).v + " cannot be held by the builder");
      return null;
    }
    if (eatKw("LIKE")) {
      const t = peek();
      if (t.t !== "str") { fail("LIKE needs a quoted pattern", t); return null; }
      step();
      let v = t.v;
      const wrapped = v.startsWith("%") && v.endsWith("%") && v.length >= 2;
      v = v.replace(/^%/, "").replace(/%$/, "");
      if (!wrapped) warnings.push({ msg: "LIKE is matched as 'contains', so the pattern is treated as %" + v + "%", at: at(t) });
      if (v.indexOf("%") >= 0 || v.indexOf("_") >= 0) {
        warnings.push({ msg: "wildcards inside a LIKE pattern are matched literally", at: at(t) });
      }
      return { ci, pred: "like", value: v, linker: "AND" };
    }
    if (eatKw("BETWEEN")) {
      const lo = literal();
      if (!eatKw("AND")) { fail("expected AND in BETWEEN"); return null; }
      const hi = literal();
      if (lo === null || hi === null) return null;
      return { ci, pred: "between", value: lo, valueTo: hi, linker: "AND" };
    }
    const opTok = peek();
    if (opTok.t === "op" && OP_PRED[opTok.v]) {
      step();
      const v = literal();
      if (v === null) return null;
      return { ci, pred: OP_PRED[opTok.v], value: v, linker: "AND" };
    }
    fail("expected a comparison after " + colTok.v, opTok);
    return null;
  };
  function literal() {
    const t = peek();
    if (t.t === "str") { p++; return t.v; }
    if (t.t === "num") { p++; return t.raw; }
    if (t.t === "kw" && (t.v === "TRUE" || t.v === "FALSE")) { p++; return t.v.toLowerCase(); }
    if (t.t === "op" && (t.v === "-" || t.v === "+") && tokAt(p + 1) && tokAt(p + 1).t === "num") {
      step(); step();
      return (t.v === "-" ? "-" : "") + toks[p - 1].raw;
    }
    if (t.t === "kw" && t.v === "NULL") { fail("compare with IS NULL rather than = NULL", t); p++; return null; }
    fail("expected a value", t);
    step();
    return null;
  }
  /* boolean expression -> OR of ANDs, which is exactly what the zones hold */
  const parseAnd = () => {
    const items = [];
    for (;;) {
      if (isKw("NOT")) { fail("NOT cannot be held by the builder"); p++; }
      let pred;
      if (eatOp("(")) {
        const inner = parseOr();
        if (!eatOp(")")) fail("expected )");
        if (inner && inner.length === 1) pred = inner[0].length === 1 ? inner[0][0] : { group: inner[0] };
        else if (inner) { return { nested: inner, items }; }
        else pred = null;
      } else pred = parsePredicate();
      if (pred && pred.group) for (const x of pred.group) items.push(x);
      else if (pred) items.push(pred);
      if (!eatKw("AND")) break;
    }
    return { items };
  };
  const parseOr = () => {
    const groups = [];
    for (;;) {
      const and = parseAnd();
      if (and.nested) {
        fail("an OR inside an AND cannot be held: rewrite (a OR b) AND c as (a AND c) OR (b AND c)");
        return null;
      }
      groups.push(and.items);
      if (!eatKw("OR")) break;
    }
    return groups;
  };
  if (eatKw("WHERE")) {
    const groups = parseOr();
    if (groups) {
      groups.forEach((g, gi) => {
        g.forEach((f, fi) => {
          f.id = "f" + ++qid;
          f.linker = fi === 0 && gi > 0 ? "OR" : "AND";
          q.filters.push(f);
        });
      });
    }
  }

  /* ---------------- GROUP BY ---------------- */
  if (isKw("GROUP")) {
    step();
    if (!eatKw("BY")) fail("expected BY after GROUP");
    for (;;) {
      const t = peek();
      if (t.t !== "name") { fail("expected a column in GROUP BY", t); break; }
      step();
      const ci = resolve(t);
      if (ci >= 0 && q.groupBy.indexOf(ci) < 0) q.groupBy.push(ci);
      if (!eatOp(",")) break;
    }
  }
  if (isKw("HAVING")) fail("HAVING is not supported; filter before grouping with WHERE");

  /* ---------------- shape ---------------- */
  const agg = selectAggs.length > 0 || q.groupBy.length > 0;
  if (agg) {
    q.mode = "agg";
    q.metrics = selectAggs.map((m) => ({ id: "m" + ++qid, ci: m.ci, agg: m.agg, alias: m.alias }));
    if (starSelect) fail("SELECT * cannot be mixed with grouping; list the columns");
    for (const s of selectPlain) {
      if (q.groupBy.indexOf(s.ci) < 0) {
        fail('"' + cols[s.ci].name + '" is selected but not grouped; add it to GROUP BY or aggregate it', s.tok);
      }
    }
    for (const g of q.groupBy) {
      if (!selectPlain.some((s) => s.ci === g)) {
        warnings.push({ msg: '"' + cols[g].name + '" is grouped, so it is selected too', at: 0 });
      }
    }
  } else {
    q.mode = "rows";
    q.select = starSelect ? [] : selectPlain.map((s) => s.ci);
  }

  /* ---------------- ORDER BY ---------------- */
  if (isKw("ORDER")) {
    step();
    if (!eatKw("BY")) fail("expected BY after ORDER");
    for (;;) {
      const t = peek();
      let entry = null;
      if (t.t === "name" && tokAt(p + 1) && tokAt(p + 1).t === "op" && tokAt(p + 1).v === "(") {
        /* ORDER BY COUNT(x) — match it to the metric that produces it */
        const fnTok = toks[p];
        const fn = fnTok.v.toUpperCase();
        step(); step();
        const distinct = fn === "COUNT" && isKw("DISTINCT") ? (p++, true) : false;
        const kind = distinct ? "COUNT_DISTINCT" : AGG_BY_NAME[fn];
        let ci = -1;
        if (eatOp("*")) ci = 0; else if (peek().t === "name") ci = resolve((step(), tokAt(p - 1)));
        if (!eatOp(")")) fail("expected )");
        const m = q.metrics.find((x) => x.ci === ci && x.agg === kind);
        if (m) entry = { id: "s" + ++qid, ci: m.ci, mid: m.id, dir: "ASC" };
        else fail("ORDER BY " + fn + "(...) does not match anything selected", fnTok);
      } else if (t.t === "name") {
        step();
        const alias = q.metrics.find((m) => m.alias && m.alias === t.v);
        if (alias) entry = { id: "s" + ++qid, ci: alias.ci, mid: alias.id, dir: "ASC" };
        else {
          const ci = resolve(t);
          if (ci >= 0) {
            if (agg && q.groupBy.indexOf(ci) < 0 && !q.metrics.some((m) => m.ci === ci)) {
              fail('"' + t.v + '" is not selected, so it cannot be ordered by', t);
            } else entry = { id: "s" + ++qid, ci, dir: "ASC" };
          }
        }
      } else { fail("expected a column in ORDER BY", t); break; }
      if (eatKw("DESC")) { if (entry) entry.dir = "DESC"; }
      else eatKw("ASC");
      if (entry) q.sort.push(entry);
      if (!eatOp(",")) break;
    }
  }

  /* ---------------- LIMIT ---------------- */
  if (eatKw("LIMIT")) {
    const t = peek();
    if (t.t === "num" && t.v > 0 && Number.isInteger(t.v)) { q.limit = t.v; p++; }
    else { fail("LIMIT needs a positive whole number", t); p++; }
  }
  if (isKw("OFFSET")) fail("OFFSET is not supported; use the pager");
  if (isKw("UNION")) fail("UNION is not supported");
  eatOp(";");
  /* only worth saying when nothing more specific has already been said */
  if (peek().t !== "end" && !errors.length) fail("unexpected " + (peek().raw || "input"), peek());

  /* ---------------- values against the schema ---------------- */
  for (const f of q.filters) {
    const issue = filterIssue(f, cols);
    if (issue === "invalid") {
      const col = cols[f.ci];
      errors.push({ msg: '"' + f.value + '" is not a ' + col.spec.label + " value for " + col.name, at: 0 });
    }
  }
  for (const m of q.metrics) {
    const col = cols[m.ci];
    if ((m.agg === "SUM" || m.agg === "AVG") && col && col.spec.kind !== "number") {
      warnings.push({ msg: m.agg + "(" + col.name + ") over a " + col.spec.label + " column yields nothing", at: 0 });
    }
  }
  return { query: errors.length ? null : q, errors, warnings };
}

/* ----------------------------------------------------------------- UI */
const TYPE_TAG = { number: "NUM", string: "STR", bool: "BOOL", temporal: "TS", binary: "BIN", nested: "LIST" };
function typeTag(spec) {
  if (spec.kind === "temporal") return spec.sub === "date" ? "DATE" : spec.sub === "time" ? "TIME" : "TS";
  return TYPE_TAG[spec.kind] || "?";
}

function renderQueryColumns() {
  const table = state.table;
  if (!table) return;
  let html = "<div class='qhead'>Columns</div>";
  table.cols.forEach((c, i) => {
    html += "<div class='qcol' draggable='true' data-ci='" + i + "' title='" + esc(c.name + " - " + c.spec.label) +
      "'><span class='qgrab'>∷</span><span class='qcname'>" + esc(c.name) + "</span>" +
      "<span class='qtag t-" + c.spec.kind + "'>" + typeTag(c.spec) + "</span></div>";
  });
  $("qcols").innerHTML = html;
}

function zone(id, label, hint, body, empty) {
  return "<div class='qzone'><div class='qzlabel'>" + label + "</div>" +
    "<div class='qdrop" + (empty ? " empty" : "") + "' data-zone='" + id + "'>" +
    (empty ? "<span class='qhint'>" + hint + "</span>" : body) + "</div></div>";
}
const chip = (text, act, id) => "<span class='qchip'>" + esc(text) +
  "<button class='qx' data-act='" + act + "' data-id='" + id + "'>×</button></span>";

function renderZones() {
  const q = state.query, table = state.table;
  if (!table) return;
  const cols = table.cols;
  const nameOf = (ci) => (cols[ci] ? cols[ci].name : "?");
  const parts = [];

  if (q.mode === "rows") {
    parts.push(zone("select", "SELECT", "All columns &mdash; drop to pick specific ones",
      q.select.map((ci) => chip(nameOf(ci), "rm-select", ci)).join(""), q.select.length === 0));
  } else {
    parts.push(zone("groupBy", "GROUP BY", "Drop columns to group by",
      q.groupBy.map((ci) => chip(nameOf(ci), "rm-group", ci)).join(""), q.groupBy.length === 0));
    parts.push(zone("metrics", "METRICS", "Drop a column to aggregate it",
      q.metrics.map((m) => {
        let btns = "";
        for (const a of AGGS) {
          btns += "<button class='qb" + (m.agg === a ? " on" : "") + "' data-act='agg' data-id='" + m.id +
            "' data-v='" + a + "'>" + AGG_SHORT[a] + "</button>";
        }
        return "<div class='qrow'><span class='qbtns'>" + btns + "</span><code>" + esc(nameOf(m.ci)) + "</code>" +
          "<input class='qin' data-in='alias' data-id='" + m.id + "' value='" + esc(m.alias || "") +
          "' placeholder='alias' size='7'>" +
          "<button class='qx' data-act='rm-metric' data-id='" + m.id + "'>×</button></div>";
      }).join(""), q.metrics.length === 0));
  }

  parts.push(zone("where", "WHERE", "Drop a column to filter on it",
    q.filters.map((f, i) => {
      let btns = "";
      for (const p of PREDS) {
        btns += "<button class='qb" + (f.pred === p.id ? " on" : "") + "' data-act='pred' data-id='" + f.id +
          "' data-v='" + p.id + "'>" + p.label + "</button>";
      }
      const link = i === 0 ? "" : "<button class='qlink' data-act='link' data-id='" + f.id + "'>" +
        (f.linker || "AND") + "</button>";
      const issue = filterIssue(f, cols);
      const inputs = NO_OPERAND[f.pred] ? "" :
        "<input class='qin" + (issue === "invalid" ? " bad" : "") + "' data-in='val' data-id='" + f.id +
        "' value='" + esc(f.value || "") + "' placeholder='value' size='9'" +
        (issue === "invalid" ? " title='not a " + esc(cols[f.ci].spec.label) + " value'" : "") + ">" +
        (f.pred === "between" ? "<input class='qin' data-in='valTo' data-id='" + f.id + "' value='" +
          esc(f.valueTo || "") + "' placeholder='to' size='7'>" : "");
      return "<div class='qrow'>" + link + "<code>" + esc(nameOf(f.ci)) + "</code>" +
        "<span class='qbtns'>" + btns + "</span>" + inputs +
        "<button class='qx' data-act='rm-filter' data-id='" + f.id + "'>×</button></div>";
    }).join(""), q.filters.length === 0));

  /* a sort on a metric names the metric, matching the header and the SQL */
  const sortName = (s) => {
    if (!s.mid) return nameOf(s.ci);
    const m = q.metrics.find((x) => x.id === s.mid);
    return m ? (m.alias || AGG_SHORT[m.agg] + "(" + nameOf(m.ci) + ")") : nameOf(s.ci);
  };
  parts.push(zone("sort", "ORDER BY", "Drop a column to sort by",
    q.sort.map((s) => "<div class='qrow'><code>" + esc(sortName(s)) + "</code>" +
      "<button class='qb on' data-act='dir' data-id='" + s.id + "'>" +
      (s.dir === "ASC" ? "ASC ↑" : "DESC ↓") + "</button>" +
      "<button class='qx' data-act='rm-sort' data-id='" + s.id + "'>×</button></div>").join(""),
    q.sort.length === 0));

  parts.push("<div class='qzone qlimit'><div class='qzlabel'>LIMIT</div>" +
    "<input class='qin' data-in='limit' value='" + (q.limit == null ? "" : q.limit) +
    "' placeholder='none' size='7'></div>");

  $("qzones").innerHTML = parts.join("");
  for (const b of $("qmode").children) b.classList.toggle("on", b.dataset.mode === q.mode);
}
/** Anything the zones do overwrites the text; the builder wins its own edits. */
function renderQuery() {
  state.sqlDirty = false;
  renderZones();
  renderSql(true);
}
/** The builder owns the text unless the user is in the middle of editing it. */
function renderSql(force) {
  if (!force && state.sqlDirty) return;
  const el = $("qsql");
  el.value = querySql();
  el.classList.remove("bad");
  state.sqlDirty = false;
  showSqlMessages({ errors: [], warnings: [] }, true);
}
function lineCol(text, at) {
  const upto = text.slice(0, at);
  const line = upto.split("\n").length;
  return line + ":" + (at - upto.lastIndexOf("\n"));
}
function showSqlMessages(res, quiet) {
  const box = $("qsqlmsg"), state_ = $("qsqlstate"), text = $("qsql").value;
  const items = res.errors.map((e) => ({ cls: "e", m: e })).concat(res.warnings.map((w) => ({ cls: "w", m: w })));
  if (!items.length) {
    box.hidden = true;
    state_.className = quiet ? "" : "ok";
    state_.textContent = quiet ? "" : "· in step with the zones";
    return;
  }
  box.hidden = false;
  box.innerHTML = items.map((i) =>
    "<div class='" + i.cls + "'>" + (i.m.at ? lineCol(text, i.m.at) + "  " : "") + esc(i.m.msg) + "</div>").join("");
  state_.className = res.errors.length ? "bad" : "warn";
  state_.textContent = res.errors.length
    ? "· " + res.errors.length + " problem" + (res.errors.length === 1 ? "" : "s")
    : "· " + res.warnings.length + " note" + (res.warnings.length === 1 ? "" : "s");
}
/** Parses what is in the box and, if it holds together, adopts it. */
function adoptSql(andRun) {
  const table = state.table;
  if (!table) return false;
  const res = parseSql($("qsql").value, table.cols);
  showSqlMessages(res);
  $("qsql").classList.toggle("bad", res.errors.length > 0);
  if (!res.query) return false;
  res.query.active = state.query ? state.query.active : false;
  state.query = res.query;
  state.sqlDirty = false;
  renderZones();                       /* zones follow the text, text stays put */
  if (andRun) { renderSql(true); runQuery(); }
  return true;
}

function addToZone(zoneId, ci) {
  const q = state.query;
  switch (zoneId) {
    case "select": if (q.select.indexOf(ci) < 0) q.select.push(ci); break;
    case "groupBy": if (q.groupBy.indexOf(ci) < 0) q.groupBy.push(ci); break;
    case "metrics": q.metrics.push({ id: "m" + ++qid, ci, agg: "COUNT", alias: "" }); break;
    case "where": q.filters.push({ id: "f" + ++qid, ci, pred: "eq", value: "", valueTo: "", linker: "AND" }); break;
    case "sort": if (!q.sort.some((s) => s.ci === ci)) q.sort.push({ id: "s" + ++qid, ci, dir: "ASC" }); break;
    default: return;
  }
  renderQuery();
}

function initQuery() {
  state.query = newQuery();
  $("qmode").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-mode]");
    if (!b) return;
    state.query.mode = b.dataset.mode;
    renderQuery();
  });
  $("qcols").addEventListener("dragstart", (e) => {
    const row = e.target.closest(".qcol");
    if (!row) return;
    e.dataTransfer.setData("text/plain", row.dataset.ci);
    e.dataTransfer.effectAllowed = "copy";
  });
  $("qcols").addEventListener("dblclick", (e) => {
    const row = e.target.closest(".qcol");
    if (row) addToZone(state.query.mode === "rows" ? "select" : "groupBy", +row.dataset.ci);
  });
  const zoneAt = (e) => e.target.closest(".qdrop");
  $("qzones").addEventListener("dragover", (e) => {
    const z = zoneAt(e);
    if (!z) return;
    e.preventDefault();
    z.classList.add("over");
  });
  $("qzones").addEventListener("dragleave", (e) => { const z = zoneAt(e); if (z) z.classList.remove("over"); });
  $("qzones").addEventListener("drop", (e) => {
    const z = zoneAt(e);
    if (!z) return;
    e.preventDefault();
    z.classList.remove("over");
    const ci = parseInt(e.dataTransfer.getData("text/plain"), 10);
    if (isFinite(ci)) addToZone(z.dataset.zone, ci);
  });
  $("qzones").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    const q = state.query, id = b.dataset.id;
    switch (b.dataset.act) {
      case "rm-select": q.select = q.select.filter((ci) => ci !== +id); break;
      case "rm-group": q.groupBy = q.groupBy.filter((ci) => ci !== +id); break;
      case "rm-metric": q.metrics = q.metrics.filter((m) => m.id !== id); break;
      case "rm-filter": q.filters = q.filters.filter((f) => f.id !== id); break;
      case "rm-sort": q.sort = q.sort.filter((s) => s.id !== id); break;
      case "pred": { const f = q.filters.find((x) => x.id === id); if (f) f.pred = b.dataset.v; break; }
      case "link": { const f = q.filters.find((x) => x.id === id); if (f) f.linker = f.linker === "OR" ? "AND" : "OR"; break; }
      case "agg": { const m = q.metrics.find((x) => x.id === id); if (m) m.agg = b.dataset.v; break; }
      case "dir": { const s = q.sort.find((x) => x.id === id); if (s) s.dir = s.dir === "ASC" ? "DESC" : "ASC"; break; }
      default: return;
    }
    renderQuery();
  });
  /* typing must not re-render, or the input would lose focus mid-word */
  $("qzones").addEventListener("input", (e) => {
    const el = e.target.closest("[data-in]");
    if (!el) return;
    const q = state.query, id = el.dataset.id, v = el.value;
    switch (el.dataset.in) {
      case "val": { const f = q.filters.find((x) => x.id === id); if (f) f.value = v; break; }
      case "valTo": { const f = q.filters.find((x) => x.id === id); if (f) f.valueTo = v; break; }
      case "alias": { const m = q.metrics.find((x) => x.id === id); if (m) m.alias = v; break; }
      case "limit": { const n = parseInt(v, 10); q.limit = isFinite(n) && n > 0 ? n : null; break; }
      default: return;
    }
    /* typing does not re-render the zone, so mark the offending input here */
    if (el.dataset.in === "val" || el.dataset.in === "valTo") {
      const f = q.filters.find((x) => x.id === id);
      const cols = state.table ? state.table.cols : [];
      el.classList.toggle("bad", !!f && filterIssue(f, cols) === "invalid");
    }
    renderSql();
  });
  $("qzones").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); runQuery(); }
  });
  let sqlTimer = 0;
  $("qsql").addEventListener("input", () => {
    state.sqlDirty = true;
    clearTimeout(sqlTimer);
    sqlTimer = setTimeout(() => adoptSql(false), 260);
  });
  $("qsql").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); adoptSql(true); }
  });
  $("qsql").addEventListener("blur", () => { clearTimeout(sqlTimer); adoptSql(false); });
  $("qformat").addEventListener("click", () => { if (adoptSql(false)) renderSql(true); });
  $("qrun").addEventListener("click", () => {
    if (state.sqlDirty && !adoptSql(true)) return;    /* refuse to run text that does not parse */
    runQuery();
  });
  $("qclear").addEventListener("click", () => resetQuery());
  $("qcopy").addEventListener("click", () => {
    const text = querySql();
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
    $("qcopy").textContent = "copied";
    setTimeout(() => { $("qcopy").textContent = "copy"; }, 1200);
  });
  $("toggleQuery").addEventListener("click", () => {
    const q = $("query");
    const showing = q.hidden;
    q.hidden = !showing;
    $("qgrip").hidden = !showing;
    $("toggleQuery").textContent = showing ? "Hide query" : "Query";
    renderRows(true);
  });
  $("qgrip").addEventListener("pointerdown", (e) =>
    drag(e, "rowsizing", (ev) => queryHeight($("query").getBoundingClientRect().bottom - ev.clientY)));
}
function queryHeight(px) {
  const room = Math.max(120, window.innerHeight - 260);
  const h = Math.max(120, Math.min(Math.round(px), room));
  document.documentElement.style.setProperty("--queryh", h + "px");
  try { localStorage.setItem("paris-parquet-queryh", String(h)); } catch (e) { /* fine */ }
  renderRows(true);
  return h;
}

   Wiring

/* ---------------------------------------------------------- resizing */
function columnWidth(index, px) {
  const view = state.view;
  if (!view || !view.cols[index]) return;
  const w = Math.max(56, Math.round(px));
  view.cols[index].width = w;
  const col = $("grid").querySelectorAll("colgroup col")[index + 1];   /* +1: row numbers */
  if (col) col.style.width = w + "px";
}
function metaHeight(px) {
  const room = Math.max(90, window.innerHeight - 220);
  const h = Math.max(58, Math.min(Math.round(px), room));
  document.documentElement.style.setProperty("--metah", h + "px");
  try { localStorage.setItem("paris-parquet-metah", String(h)); } catch (e) { /* fine */ }
  renderRows(true);
  return h;
}
/** Runs a pointer drag, keeping the cursor and text selection sane. */
function drag(event, cls, onMove) {
  event.preventDefault();
  document.body.classList.add(cls);
  const move = (e) => onMove(e);
  const up = () => {
    document.body.classList.remove(cls);
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

const THEMES = ["auto", "light", "dark"];
function applyTheme(name) {
  const root = document.documentElement;
  if (name === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", name);
  $("theme").textContent = name;
  if (chart.on) renderChart();                 /* dark steps are chosen, not flipped */
  /* file:// pages may refuse storage entirely; the choice just won't persist */
  try { localStorage.setItem("paris-parquet-theme", name); } catch (e) { /* fine */ }
}
function storedTheme() {
  try {
    const v = localStorage.getItem("paris-parquet-theme");
    return THEMES.indexOf(v) >= 0 ? v : "auto";
  } catch (e) { return "auto"; }
}
function showError(e) {
  const old = $("err");
  if (old) old.remove();
  const box = document.createElement("div");
  box.id = "err";
  box.textContent = (e && e.message) ? e.message : String(e);
  $("stage").prepend(box);
  if (e && e.stack) console.error(e);
}
function busy(on, text) {
  const b = $("busy");
  b.hidden = !on;
  if (text) b.textContent = text;
}
const FIRST_ROWS = 20000;

function isParquetFile(f) { return isParquetPath(f.webkitRelativePath || f.name); }
function entriesFromFiles(list) {
  const out = [];
  for (const f of list) {
    const path = f.webkitRelativePath || f.name;
    if (isParquetPath(path)) out.push({ src: fileSource(f), path });
  }
  out.sort((a, b) => (a.path < b.path ? -1 : a.path > b.path ? 1 : 0));
  return out;
}
/** A dropped folder arrives as directory entries, not files; walk it. */
async function entriesFromDrop(dt) {
  const roots = [];
  if (dt.items) {
    for (const item of dt.items) {
      const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
      if (entry) roots.push(entry);
    }
  }
  if (!roots.length || !roots.some((r) => r.isDirectory)) return entriesFromFiles(dt.files);
  const out = [];
  const walk = async (entry, prefix) => {
    if (entry.isFile) {
      const path = prefix + entry.name;
      if (!isParquetPath(path)) return;
      const file = await new Promise((res, rej) => entry.file(res, rej));
      out.push({ src: fileSource(file), path });
      return;
    }
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const e of batch) await walk(e, prefix + entry.name + "/");
    }
  };
  for (const r of roots) await walk(r, "");
  out.sort((a, b) => (a.path < b.path ? -1 : a.path > b.path ? 1 : 0));
  return out;
}

async function openFile(file) { return openEntries(entriesFromFiles([file])); }

async function openEntries(entries, label) {
  const old = $("err");
  if (old) old.remove();
  busy(true, "reading footers...");
  const named = !!label || entries.length === 1;
  const name = label || (entries.length === 1 ? entries[0].path : entries.length + " files");
  $("fileline").innerHTML = "<b>" + esc(name) + "</b>";
  try {
    if (!entries.length) throw new Error("No .parquet files here.");
    const dataset = await readDataset(entries, async (i, n, path) => {
      if (n > 1 && (i % 16 === 0 || i === n - 1)) {
        busy(true, "reading footers… " + (i + 1) + " of " + n);
        await new Promise((r) => setTimeout(r, 0));
      }
    });
    const meta = dataset.reference;
    const table = newTable(dataset);
    state.dataset = dataset;
    state.src = dataset.parts[0].src;
    state.meta = meta;
    state.table = table;
    state.display = newDisplay(table.cols);
    busy(true, "decoding " + num(Math.min(dataset.numRows, FIRST_ROWS)) + " rows...");
    await new Promise((r) => setTimeout(r, 0));
    await loadMore(dataset, table, FIRST_ROWS);
    setView(baseView(table));
    state.query = newQuery();          /* a new file means new columns */
    $("qstat").textContent = "";
    $("qclear").disabled = true;
    renderQueryColumns();
    renderQuery();
    renderMeta();
    updateButtons();
    const parts = dataset.parts.length;
    $("fileline").innerHTML = "<b>" + esc(name) + "</b> &middot; " +
      (parts > 1 && named ? num(parts) + " files &middot; " : "") + bytesHuman(dataset.size) + " &middot; " +
      num(dataset.numRows) + " rows x " + num(table.cols.length) + " cols &middot; " +
      num(dataset.numGroups) + " row group" + (dataset.numGroups === 1 ? "" : "s");
  } catch (e) {
    $("gridwrap").hidden = true;
    $("pager").hidden = true;
    $("query").hidden = true;
    $("qgrip").hidden = true;
    $("drop").hidden = false;
    $("meta").hidden = true;
    $("mgrip").hidden = true;
    $("more").hidden = true;
    $("all").hidden = true;
    $("toggleCols").hidden = true;
    $("toggleChart").hidden = true;
    $("chartwrap").hidden = true;
    $("colpick").hidden = true;
    $("toggleMeta").hidden = true;
    showError(e);
    /* the footer usually parses even when a page does not, and it is the part
       that explains why: codec, encodings, encryption, who wrote the file */
    if (state.meta && state.table) {
      try { renderMeta(); $("toggleMeta").hidden = false; } catch (e2) { /* nothing to show */ }
    }
  } finally {
    busy(false);
  }
}

function updateButtons() {
  const t = state.table;
  const can = !!(t && t.truncated);
  $("more").hidden = !can;
  $("all").hidden = !can;
  $("toggleMeta").hidden = !t;
  $("toggleQuery").hidden = !t;
  $("toggleCols").hidden = !t;
  $("toggleChart").hidden = !t;
  if (t && $("toggleQuery").textContent === "Query" && $("query").hidden) {
    $("query").hidden = false;
    $("qgrip").hidden = false;
    $("toggleQuery").textContent = "Hide query";
  }
  if (can) {
    const left = t.dataset.numRows - t.rowsLoaded;
    let next = 0;
    for (let pi = t.nextPart; pi < t.dataset.parts.length && next < FIRST_ROWS; pi++) {
      const groups = t.dataset.parts[pi].meta.rowGroups;
      for (let g = pi === t.nextPart ? t.nextGroup : 0; g < groups.length && next < FIRST_ROWS; g++) {
        next += groups[g].numRows;
      }
    }
    $("more").textContent = "Load " + num(next) + " more";
    $("all").textContent = "Load all " + num(left);
  }
}
async function grow(n) {
  busy(true, "decoding...");
  await new Promise((r) => setTimeout(r, 0));
  try {
    await loadMore(state.dataset, state.table, n);
    if (state.query && state.query.active) runQuery(); else setView(baseView(state.table));
    renderMeta();
    updateButtons();
  } catch (e) { showError(e); } finally { busy(false); }
}

function init() {
  applyTheme(storedTheme());
  initQuery();
  initPicker();
  $("theme").addEventListener("click", () => {
    applyTheme(THEMES[(THEMES.indexOf($("theme").textContent) + 1) % THEMES.length]);
  });
  const fromPicker = (e, label) => {
    const entries = entriesFromFiles(e.target.files);
    const first = e.target.files[0];
    e.target.value = "";              /* so picking the same thing again re-reads it */
    if (entries.length) openEntries(entries, label && first ? (first.webkitRelativePath || "").split("/")[0] : null);
    else if (first) showError(new Error('"' + first.name + '" is not a .parquet file.'));
  };
  $("picker").addEventListener("change", (e) => fromPicker(e, false));
  $("dirpicker").addEventListener("change", (e) => fromPicker(e, true));
  $("more").addEventListener("click", () => grow(FIRST_ROWS));
  $("all").addEventListener("click", () => grow(Infinity));
  $("toggleMeta").addEventListener("click", () => {
    const m = $("meta");
    state.metaTouched = true;
    m.classList.toggle("collapsed");
    const hidden = m.classList.contains("collapsed");
    $("mgrip").hidden = hidden;
    $("toggleMeta").textContent = hidden ? "Show metadata" : "Hide metadata";
    renderRows(true);
  });
  try {
    const qh = +localStorage.getItem("paris-parquet-queryh");
    if (qh > 0) document.documentElement.style.setProperty("--queryh", qh + "px");
  } catch (e) { /* fine */ }
  try {
    const size = Number(localStorage.getItem("paris-parquet-pagesize"));
    if (PAGE_SIZES.indexOf(size) >= 0 || size === Infinity) state.pageSize = size;
  } catch (e) { /* fine */ }
  try {
    const saved = +localStorage.getItem("paris-parquet-metah");
    if (saved > 0) document.documentElement.style.setProperty("--metah", saved + "px");
  } catch (e) { /* fine */ }
  $("mgrip").addEventListener("pointerdown", (e) =>
    drag(e, "rowsizing", (ev) => metaHeight(window.innerHeight - ev.clientY)));
  $("gridwrap").addEventListener("pointerdown", (e) => {
    const grip = e.target.closest("i.grip");
    if (!grip) return;
    const index = +grip.dataset.col;
    const startX = e.clientX, startW = state.view.cols[index].width || COL_W;
    drag(e, "colsizing", (ev) => {
      state.justResized = true;
      columnWidth(index, startW + ev.clientX - startX);
    });
    window.addEventListener("pointerup", () => setTimeout(() => { state.justResized = false; }, 0), { once: true });
  });
  $("gridwrap").addEventListener("dblclick", (e) => {
    const grip = e.target.closest("i.grip");
    if (grip) columnWidth(+grip.dataset.col, COL_W);
  });
  $("gridwrap").addEventListener("click", (e) => {
    if (state.justResized) return;              /* the click that ends a drag */
    if (e.target.closest("i.grip")) return;
    const th = e.target.closest("tr.r-name th");
    if (th) {
      if (th.classList.contains("rownum")) return;
      const idx = Array.prototype.indexOf.call(th.parentNode.children, th) - 1;
      if (idx >= 0) toggleSort(idx, e.shiftKey);
      return;
    }
    const td = e.target.closest("#tbody td");
    if (!td || td.classList.contains("rownum") || td.classList.contains("pad")) return;
    if (String(window.getSelection())) return;     /* they were selecting text */
    const tr = td.parentNode;
    const ci = Array.prototype.indexOf.call(tr.children, td) - 1;
    const r = +tr.dataset.r;
    if (ci >= 0 && isFinite(r)) openInspector(r, ci, td);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeInspector(); });
  document.addEventListener("pointerdown", (e) => {
    if (state.inspectAt && !e.target.closest("#inspect") && !e.target.closest("#tbody td")) closeInspector();
  }, true);
  let raf = 0;
  $("gridwrap").addEventListener("scroll", () => {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; renderRows(false); });
  });
  window.addEventListener("resize", () => {
    const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--metah"));
    if (cur > 0) metaHeight(cur); else renderRows(true);
    if (chart.on) renderChart();
  });
  const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
  document.addEventListener("dragover", (e) => { stop(e); document.body.classList.add("dragging"); });
  document.addEventListener("dragleave", (e) => { if (e.relatedTarget === null) document.body.classList.remove("dragging"); });
  document.addEventListener("drop", async (e) => {
    stop(e);
    document.body.classList.remove("dragging");
    busy(true, "looking through what you dropped…");
    let entries = [];
    try { entries = await entriesFromDrop(e.dataTransfer); }
    catch (err) { busy(false); showError(err); return; }
    if (!entries.length) {
      busy(false);
      showError(new Error("Nothing here ends in .parquet."));
      return;
    }
    const folder = entries[0].path.indexOf("/") > 0 ? entries[0].path.split("/")[0] : null;
    openEntries(entries, folder);
  });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

/* exposed so this file can be driven from a test harness */
window.PARIS = { readFooter, readDataset, loadMore, newTable, typeSpec, summarize, assemble, fmtValue, decompress,
  hivePartition, isParquetPath, entriesFromFiles,
  runQuery, querySql, parseSql, sqlTokenize, adoptSql, chart, chartData, chartDefaults, niceTicks,
  baseView, setView, compileFilter, aggregate, exportParts, viewValue,
  displayCols, newDisplay, refreshView,
  zstdDecompress, snappyDecompress, lz4BlockDecompress, gzipDecompress, fileSource, state };
</script>
