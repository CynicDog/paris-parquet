  if (real.length && real.every((v) => /^-?\d{1,15}$/.test(v))) {
    return { kind: "number", label, physical: "PATH", partition: true, convert: (v) => (v === null ? null : +v) };
  }
  if (real.length && real.every((v) => /^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(v))) {
    return { kind: "number", label, physical: "PATH", partition: true, convert: (v) => (v === null ? null : +v) };
  }
  if (real.length && real.every((v) => /^\d{4}-\d{2}-\d{2}$/.test(v))) {
    return { kind: "temporal", sub: "date", label: "partition date", physical: "PATH", partition: true,
      convert: (v) => (v === null ? null : Date.UTC(+v.slice(0, 4), +v.slice(5, 7) - 1, +v.slice(8, 10))) };
  }
  return { kind: "string", label, physical: "PATH", partition: true, convert: (v) => v };
}

/**
 * Reads every part's footer, then reconciles them into one column list.
 * Columns are the union across files; a file missing one reads as null.
 * A column that means something different in two files is fatal, and says so.
 */
async function readDataset(entries, onProgress) {
  const parts = [];
  const skipped = [];
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    if (onProgress) await onProgress(i, entries.length, e.path);
    let meta;
    try { meta = await readFooter(e.src); }
    catch (err) { skipped.push(e.path + " — " + err.message); continue; }
    parts.push({
      src: e.src, path: e.path, meta,
      partition: hivePartition(e.path),
      byPath: null, leafByPath: null,
    });
  }
  if (!parts.length) {
    throw new Error(entries.length
      ? "None of the " + entries.length + " file(s) could be read:\n" + skipped.join("\n")
      : "No .parquet files here.");
  }

  /* union the leaves, in first-seen order, and refuse real disagreements */
  const columns = [], byKey = new Map(), conflicts = [];
  for (const part of parts) {
    part.leafByPath = new Map();
    for (const leaf of part.meta.schema.leaves) {
      const key = leaf.path.join("\u0001");
      part.leafByPath.set(key, leaf);
      const seen = byKey.get(key);
      if (!seen) {
        const col = { key, leaf, name: leaf.label || leaf.path.join("."), sig: leafSignature(leaf), from: part };
        byKey.set(key, col);
        columns.push(col);
      } else if (seen.sig !== leafSignature(leaf)) {
        conflicts.push('"' + seen.name + '" is ' + seen.leaf.type + " in " + seen.from.path +
          " but " + leaf.type + " in " + part.path);
      }
    }
  }
  if (conflicts.length) {
    throw new Error("These files do not describe the same table:\n" + conflicts.slice(0, 6).join("\n") +
      (conflicts.length > 6 ? "\n…and " + (conflicts.length - 6) + " more" : ""));
  }

  /* partition keys, in the order the paths introduce them */
  const partKeys = [];
  for (const part of parts) {
    for (const p of part.partition) if (partKeys.indexOf(p.key) < 0) partKeys.push(p.key);
  }
  const partitionCols = partKeys.map((key) => {
    const raw = parts.map((part) => {
      const hit = part.partition.find((p) => p.key === key);
      return hit ? hit.value : null;
    });
    const spec = partitionSpec(raw);
    parts.forEach((part, i) => {
      part.partValues = part.partValues || {};
      part.partValues[key] = spec.convert(raw[i]);
    });
    return { key: "\u0000part\u0000" + key, name: key, partKey: key, spec, leaf: null };
  });

  for (const part of parts) {
    part.rows = part.meta.numRows;
    part.size = part.src.size;
  }
  const totalRows = parts.reduce((a, p) => a + p.rows, 0);
  const totalGroups = parts.reduce((a, p) => a + p.meta.rowGroups.length, 0);
  return {
    parts, columns, partitionCols, skipped,
    reference: parts[0].meta,
    numRows: totalRows,
    numGroups: totalGroups,
    size: parts.reduce((a, p) => a + p.size, 0),
  };
}

function newTable(dataset) {
  const cols = dataset.partitionCols.map((pc) => ({
    leaf: null, partKey: pc.partKey, key: pc.key, name: pc.name, spec: pc.spec, rows: [], sniffed: true,
  })).concat(dataset.columns.map((c) => ({
    leaf: c.leaf, key: c.key, name: c.name, spec: typeSpec(c.leaf), rows: [], sniffed: false,
  })));
  return {
    dataset, meta: dataset.reference, cols,
    nextPart: 0, nextGroup: 0, rowsLoaded: 0, groupsLoaded: 0,
    truncated: dataset.numGroups > 0,
  };
}

/** Reads row groups, part by part, until `maxRows` more rows have been added. */
async function loadMore(dataset, table, maxRows, onProgress) {
  let added = 0;
  while (table.nextPart < dataset.parts.length && added < maxRows) {
    const part = dataset.parts[table.nextPart];
    const meta = part.meta;
    if (table.nextGroup >= meta.rowGroups.length) { table.nextPart++; table.nextGroup = 0; continue; }
    const rg = meta.rowGroups[table.nextGroup];
    if (!part.byPath) {
      part.byPath = new Map();
      rg.columns.forEach((c, i) => { if (c.meta) part.byPath.set(c.meta.path.join("\u0001"), i); });
    }
    const byPath = new Map();
    rg.columns.forEach((c, i) => { if (c.meta) byPath.set(c.meta.path.join("\u0001"), i); });
    for (let ci = 0; ci < table.cols.length; ci++) {
      const col = table.cols[ci];
      if (col.partKey !== undefined) {
        const v = part.partValues ? part.partValues[col.partKey] : null;
        for (let i = 0; i < rg.numRows; i++) col.rows.push(v === undefined ? null : v);
        continue;
      }
      const leaf = part.leafByPath.get(col.key);
      const idx = byPath.has(col.key) ? byPath.get(col.key) : -1;
      if (!leaf || idx < 0) {                       /* this file does not have it */
        for (let i = 0; i < rg.numRows; i++) col.rows.push(null);
        continue;
      }
      const chunk = rg.columns[idx];
      if (chunk.filePath) {
        throw new Error("Column " + col.name + " lives in a separate file (" + chunk.filePath +
          "), which parquet allows but nothing writes.");
      }
      if (chunk.encryptedMetadata || chunk.cryptoMetadata) throw new Error("Column " + col.name + " is encrypted.");
      let raw;
      try {
        raw = await readColumnChunk(part.src, chunk, leaf);
      } catch (e) {
        throw new Error('Could not read column "' + col.name + '" in row group ' + table.nextGroup +
          " of " + part.path + " (" + chunk.meta.codec + ", " + chunk.meta.encodings.join("/") + "): " + e.message);
      }
      if (!col.sniffed && raw.values.length) {
        col.sniffed = true;
        if (col.spec.maybeUtf8 && looksUtf8(raw.values)) {
          if (col.spec.nested) col.spec.elementKind = "string"; else col.spec.kind = "string";
          col.spec.label = col.spec.label + " (utf-8)";
          col.spec.convert = (v) => utf8.decode(v);
        }
      }
      const rows = assemble(leaf, raw.values, raw.defs, raw.reps, col.spec.convert);
      for (let i = 0; i < rows.length; i++) col.rows.push(rows[i]);
      if (onProgress) onProgress(table.nextPart, table.nextGroup, ci, table.cols.length);
    }
    added += rg.numRows;
    table.rowsLoaded += rg.numRows;
    table.nextGroup++;
    table.groupsLoaded++;
  }
  table.truncated = table.nextPart < dataset.parts.length &&
    (table.nextGroup < dataset.parts[table.nextPart].meta.rowGroups.length ||
     table.nextPart < dataset.parts.length - 1);
  return added;
}

/* ======================================================================
   Rendering
   ====================================================================== */
const $ = (id) => document.getElementById(id);
const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESCAPES[c]);
const num = (n) => (n == null ? "-" : Number(n).toLocaleString("en-US"));
function bytesHuman(n) {
  if (n == null) return "-";
  if (n < 1024) return n + " B";
  const u = ["KB", "MB", "GB", "TB"];
  let v = n / 1024, i = 0;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.round(v)) + " " + u[i];
}
const pct = (a, b) => (b ? (a / b * 100).toFixed(a / b >= 0.1 || a === 0 ? 0 : 1) + "%" : "0%");

const COL_W = 178, ROW_H = 22;
/* how many cells may be drawn in one go before the grid falls back to
   windowing; 100 rows of 40 columns fits comfortably inside it */
const CELL_BUDGET = 8000;
const PAGE_SIZES = [10, 100, 200, 500, 1000, 3000, Infinity];
const state = { src: null, meta: null, table: null, view: null, page: 0, pageSize: 100, first: 0 };

/**
 * A view is what the grid draws: a list of columns, a row count, and an
 * optional Int32Array picking which underlying rows to show, in what order.
 * The unfiltered table is a view with no index, so nothing is copied until a
 * query actually reshapes the data.
 */
/**
 * Which of the table's columns the grid shows, in what order. Pinned columns
 * float to the front and stick to the left edge; hidden ones drop out. This is
 * a display concern only — every column stays decoded and queryable.
 */
function newDisplay(cols) {
  return { order: cols.map((c, i) => i), hidden: new Set(), pinned: new Set() };
}
function displayOrder() {
  const d = state.display;
  if (!d) return null;
  const pinned = d.order.filter((ci) => d.pinned.has(ci));
  const rest = d.order.filter((ci) => !d.pinned.has(ci));
  return pinned.concat(rest).filter((ci) => !d.hidden.has(ci));
}
function displayCols(cols) {
  const order = displayOrder();
  if (!order) return cols;
  const out = [];
  for (const ci of order) if (cols[ci]) out.push(cols[ci]);
  return out.length ? out : cols;
}
function pinnedCount() {
  const d = state.display;
  return d ? d.order.filter((ci) => d.pinned.has(ci) && !d.hidden.has(ci)).length : 0;
}
function baseView(table) {
  return { cols: displayCols(table.cols), index: null, count: table.rowsLoaded, label: null, agg: false };
}
function viewValue(view, ci, row) {
  const rows = view.cols[ci].rows;
  return view.index ? rows[view.index[row]] : rows[row];
}
function summarizeView(view) {
  for (const col of view.cols) col.summary = summarize(col, view.index, view.count);
}
function setView(view) {
  state.view = view;
  state.page = 0;
  summarizeView(view);
  renderGrid();
  renderPager();
  if (typeof chartDefaults === "function") {
    chartDefaults(view);                       /* axes follow whatever is on screen */
    if (chart.on) { renderChartControls(); renderChart(); }
  }
}

/* ------------------------------------------------------------ pagination */
function pageBounds() {
  const v = state.view;
  if (!v) return [0, 0];
  const size = state.pageSize;
  if (!isFinite(size)) return [0, v.count];
  const pages = Math.max(1, Math.ceil(v.count / size));
  if (state.page >= pages) state.page = pages - 1;
  if (state.page < 0) state.page = 0;
  const start = state.page * size;
  return [start, Math.min(v.count, start + size)];
}
function pageCount() {
  const v = state.view;
  if (!v || !isFinite(state.pageSize)) return 1;
  return Math.max(1, Math.ceil(v.count / state.pageSize));
}
function gotoPage(n) {
  const last = pageCount() - 1;
  const p = Math.max(0, Math.min(last, n));
  if (p === state.page) return;
  state.page = p;
  $("gridwrap").scrollTop = 0;
  state.first = -1;
  renderRows(true);
  renderPager();
}
function renderPager() {
  const v = state.view;
  const bar = $("pager");
  if (!v) { bar.hidden = true; return; }
  bar.hidden = false;
  const [from, to] = pageBounds();
  const pages = pageCount();
  const opts = PAGE_SIZES.map((n) => "<option value='" + n + "'" +
    (n === state.pageSize ? " selected" : "") + ">" + (isFinite(n) ? num(n) : "All") + "</option>").join("");
  const dis = (on) => (on ? " disabled" : "");
  bar.innerHTML =
    "<button id='pfirst' title='First page'" + dis(state.page === 0) + ">&laquo;</button>" +
    "<button id='pprev' title='Previous page'" + dis(state.page === 0) + ">&lsaquo;</button>" +
    "<span class='pinfo'>page <input id='pnum' value='" + (state.page + 1) +
    "' size='4' inputmode='numeric'> of " + num(pages) + "</span>" +
    "<button id='pnext' title='Next page'" + dis(state.page >= pages - 1) + ">&rsaquo;</button>" +
    "<button id='plast' title='Last page'" + dis(state.page >= pages - 1) + ">&raquo;</button>" +
    "<span class='psep'></span>" +
    "<label class='pinfo'>rows <select id='psize'>" + opts + "</select></label>" +
    "<span class='psep'></span>" +
    "<span class='pinfo'>" + (v.count ? num(from + 1) + "&ndash;" + num(to) : "0") + " of " + num(v.count) +
    (v.label ? " <b>" + esc(v.label) + "</b>" : "") + "</span>" +
    (state.table && state.table.truncated
      ? "<span class='pinfo muted'>&middot; " + num(state.table.rowsLoaded) + " of " +
        num(state.meta.numRows) + " rows read</span>" : "") +
    "<span class='grow'></span>" +
    "<span class='pinfo'>export <select id='expscope'>" +
    "<option value='page'>this page</option><option value='view'>all " + num(v.count) + " rows</option>" +
    "</select>" +
    "<button id='expcsv'>CSV</button><button id='exptsv'>TSV</button>" +
    "<button id='expjson'>JSON</button><button id='expmd' title='Markdown table'>MD</button>" +
    "<span class='psep'></span>" +
    "<button id='expcopy' title='Copy as TSV, for a spreadsheet'>copy</button>" +
    "<button id='expcopymd' title='Copy as a markdown table'>copy MD</button></span>";
  const scope = state.exportScope || "page";
  $("expscope").value = scope;
  $("expscope").onchange = (e) => { state.exportScope = e.target.value; };
  $("expcsv").onclick = () => doExport("csv");
  $("exptsv").onclick = () => doExport("tsv");
  $("expjson").onclick = () => doExport("json");
  $("expmd").onclick = () => doExport("md");
  $("expcopy").onclick = () => doExport("copy");
  $("expcopymd").onclick = () => doExport("copymd");
  $("pfirst").onclick = () => gotoPage(0);
  $("pprev").onclick = () => gotoPage(state.page - 1);
  $("pnext").onclick = () => gotoPage(state.page + 1);
  $("plast").onclick = () => gotoPage(pages - 1);
  $("pnum").onchange = (e) => {
    const n = parseInt(e.target.value, 10);
    if (isFinite(n)) gotoPage(n - 1); else renderPager();
  };
  $("psize").onchange = (e) => {
    const size = Number(e.target.value);
    const anchor = pageBounds()[0];
    state.pageSize = size;
    state.page = isFinite(size) ? Math.floor(anchor / size) : 0;
    try { localStorage.setItem("paris-parquet-pagesize", String(size)); } catch (err) { /* fine */ }
    $("gridwrap").scrollTop = 0;
    state.first = -1;
    renderRows(true);
    renderPager();
  };
}

/* -------------------------------------------------------------- export */
/** The value as the grid shows it, minus the display truncation. */
function exportText(v, spec) {
  return v === null || v === undefined ? null : fmtValue(v, spec);
}
/** Real JSON types where they exist, so numbers stay numbers. */
function exportJson(v, spec) {
  if (v === null || v === undefined) return null;
  if (spec.kind === "number") return typeof v === "number" ? v : typeof v === "bigint" ? v.toString() : v;
  if (spec.kind === "bool") return v === true;
  if (spec.kind === "nested") {
    const inner = { kind: spec.elementKind, sub: spec.sub, utc: spec.utc };
    const walk = (x) => (x === null || x === undefined ? null : Array.isArray(x) ? x.map(walk) : exportJson(x, inner));
    return walk(v);
  }
  return fmtValue(v, spec);
}
function csvField(text, sep) {
  if (text === null) return "";
  return /["\r\n]/.test(text) || text.indexOf(sep) >= 0 ? '"' + text.replace(/"/g, '""') + '"' : text;
}
/** A markdown cell: pipes escaped, and newlines turned into breaks so the
    row survives — a raw newline would end the table. */
function mdField(text) {
  if (text === null) return "";
  return text.replace(/\|/g, "\\|").replace(/\r?\n/g, "<br>");
}
/** Builds the export as an array of chunks; Blob takes it without a join. */
function exportParts(format, from, to) {
  const view = state.view;
  const cols = view.cols, n = cols.length;
  const parts = [];
  const sep = format === "tsv" ? "\t" : ",";
  if (format === "json") {
    parts.push("[\n");
    for (let r = from; r < to; r++) {
      const obj = {};
      for (let ci = 0; ci < n; ci++) obj[cols[ci].name] = exportJson(viewValue(view, ci, r), cols[ci].spec);
      parts.push("  " + JSON.stringify(obj) + (r < to - 1 ? ",\n" : "\n"));
    }
    parts.push("]\n");
    return parts;
  }
  if (format === "md") {
    parts.push("| " + cols.map((c) => mdField(c.name)).join(" | ") + " |\n");
    /* numbers line up on the right, the way the grid shows them */
    parts.push("| " + cols.map((c) => (c.spec.kind === "number" ? "---:" : ":---")).join(" | ") + " |\n");
    const cells = new Array(n);
    for (let r = from; r < to; r++) {
      for (let ci = 0; ci < n; ci++) cells[ci] = mdField(exportText(viewValue(view, ci, r), cols[ci].spec));
      parts.push("| " + cells.join(" | ") + " |\n");
    }
    return parts;
  }
  parts.push(cols.map((c) => csvField(c.name, sep)).join(sep) + "\n");
  let row = new Array(n);
  for (let r = from; r < to; r++) {
    for (let ci = 0; ci < n; ci++) row[ci] = csvField(exportText(viewValue(view, ci, r), cols[ci].spec), sep);
    parts.push(row.join(sep) + "\n");
  }
  return parts;
}
function exportName(ext) {
  const base = (state.src && state.src.name ? state.src.name : "parquet").replace(/\.[^.]*$/, "");
  const v = state.view;
  return base + (v && v.label ? "-" + v.label : "") + "." + ext;
}
function exportScope() {
  return $("expscope") && $("expscope").value === "view" ? [0, state.view.count] : pageBounds();
}
function download(parts, mime, filename) {
  const url = URL.createObjectURL(new Blob(parts, { type: mime }));
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
const COPY_LIMIT = 200000;
function doExport(format) {
  if (!state.view) return;
  const [from, to] = exportScope();
  if (format === "copy" || format === "copymd") {
    const rows = Math.min(to, from + COPY_LIMIT);
    const text = exportParts(format === "copymd" ? "md" : "tsv", from, rows).join("");
    const btn = $(format === "copymd" ? "expcopymd" : "expcopy");
    const was = btn.textContent;
    const say = (msg) => { btn.textContent = msg; setTimeout(() => { btn.textContent = was; }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(() => say(rows < to ? "copied " + num(rows - from) : "copied"))
        .catch(() => say("blocked"));
    } else say("blocked");
    return;
  }
  const mime = format === "json" ? "application/json"
    : format === "tsv" ? "text/tab-separated-values"
    : format === "md" ? "text/markdown" : "text/csv";
  const ext = format;
  download(exportParts(format, from, to), mime + ";charset=utf-8", exportName(ext));
}

/* ---------------------------------------------------------------- grid */
function summaryCard(col) {
  const s = col.summary, spec = col.spec;
  if (!s) return "";
  const out = [];
  const kv = (k, v) => '<div class="kv"><span class="lab">' + k + "</span><span>" + v + "</span></div>";
  out.push(kv("nulls", s.nulls ? num(s.nulls) + " &middot; " + pct(s.nulls, s.n) : "0"));
  const valid = s.n - s.nulls;
  out.push('<div class="nullbar"><i class="v" style="width:' + (s.n ? valid / s.n * 100 : 0) +
    '%"></i><i class="n" style="width:' + (s.n ? s.nulls / s.n * 100 : 0) + '%"></i></div>');

  if (spec.kind === "bool") {
    const t = s.trues, f = s.falses, tot = s.n || 1;
    out.push('<div class="bools"><i class="t" style="width:' + (t / tot * 100) + '%">' + (t / tot > 0.14 ? t : "") +
      '</i><i class="f" style="width:' + (f / tot * 100) + '%">' + (f / tot > 0.14 ? f : "") +
      '</i><i class="n" style="width:' + (s.nulls / tot * 100) + '%"></i></div>');
    out.push(kv("true", num(t) + " &middot; " + pct(t, tot)));
    out.push(kv("false", num(f) + " &middot; " + pct(f, tot)));
  } else if (spec.kind === "number" || spec.kind === "temporal") {
    if (!s.count) { out.push(kv("values", "0")); }
    else {
      out.push(kv("min", esc(s.minText)));
      out.push(kv("max", esc(s.maxText)));
      out.push(kv("mean", esc(s.meanText)));
      if (s.max > s.min) {                       /* a constant column has no shape to draw */
        let peak = 1;
        for (const h of s.hist) if (h > peak) peak = h;
        let bars = "";
        for (let i = 0; i < s.hist.length; i++) {
          bars += '<i style="height:' + Math.max(3, s.hist[i] / peak * 100) + '%" title="' + s.hist[i] + '"></i>';
        }
        out.push('<div class="hist">' + bars + "</div>");
      }
      if (s.nonFinite) out.push(kv("nan/inf", num(s.nonFinite)));
    }
  } else if (spec.kind === "string") {
    out.push(kv("distinct", (s.distinctCapped ? "&ge;" : "") + num(s.distinct || 0)));
    if (s.top) {
      let rows = "";
      const top = s.top[0] ? s.top[0][1] : 1;
      for (const pair of s.top) {
        const v = pair[0], c = pair[1];
        rows += '<div class="row" title="' + esc(v) + '"><i style="width:' + (c / top * 100) + '%"></i>' +
          "<span>" + (v === "" ? '<em class="null">(empty)</em>' : esc(v)) + '</span><span class="c">' +
          num(c) + "</span></div>";
      }
      out.push('<div class="top">' + rows + "</div>");
    }
    out.push(kv("length", s.count ? s.minLen + "-" + s.maxLen : "-"));
  } else if (spec.kind === "nested") {
    out.push(kv("empty", num(s.empties || 0)));
    out.push(kv("length", s.count ? s.minLen + "-" + s.maxLen : "-"));
    out.push(kv("avg length", s.count ? s.meanLen.toFixed(2) : "-"));
  } else {
    out.push(kv("size", s.count ? bytesHuman(s.minLen) + " - " + bytesHuman(s.maxLen) : "-"));
    out.push(kv("avg size", s.count ? bytesHuman(Math.round(s.meanLen)) : "-"));
  }
  return '<div class="sum">' + out.join("") + "</div>";
}

function renderGrid() {
  const view = state.view;
  if (!view) return;
  const grid = $("grid");
  const cols = view.cols;
  let html = "<colgroup><col style='width:62px'>";
  for (let i = 0; i < cols.length; i++) {
    if (!cols[i].width) cols[i].width = COL_W;
    html += "<col style='width:" + cols[i].width + "px'>";
  }
  html += "</colgroup><thead><tr class='r-name'><th class='rownum'>#</th>";
  for (let i = 0; i < cols.length; i++) {
    const c = cols[i];
    const title = (c.leaf ? c.leaf.path.join(".") : c.name) + "  -  " + c.spec.label +
      (c.leaf ? " (" + c.spec.physical + ", " + c.leaf.rep.toLowerCase() + ")" : "");
    html += "<th class='sortable' title='" + esc(title) + " — click to sort, shift-click to add a key'>" +
      sortMark(i) + "<span class='cname'>" + esc(c.name) +
      "</span><span class='ctype t-" + c.spec.kind + "'>" + esc(c.spec.label) +
      (c.leaf && c.leaf.rep === "OPTIONAL" && !c.spec.nested ? "?" : "") +
      "</span><i class='grip' data-col='" + i + "' title='Drag to resize, double-click to reset'></i></th>";
  }
  html += "</tr><tr class='r-sum'><th class='rownum'></th>";
  for (const c of cols) html += "<th>" + summaryCard(c) + "</th>";
  html += "</tr></thead><tbody id='tbody'></tbody>";
  grid.innerHTML = html;

  /* Per-column alignment and colour go in one stylesheet keyed by position,
     so a body cell can be a bare <td> - at 40 columns that is the difference
     between a smooth scroll and a stuttering one. */
  let css = "";
  const pins = pinnedCount();
  let pinLeft = 62;                                   /* past the row-number column */
  for (let i = 0; i < cols.length; i++) {
    const kind = cols[i].spec.kind;
    const nth = "#grid td:nth-child(" + (i + 2) + ")";
    if (kind === "number") css += nth + "{text-align:right}";
    else if (kind === "bool") css += nth + "{color:var(--bool)}";
    else if (kind === "binary" || kind === "nested") css += nth + "{color:var(--dim)}";
    if (i < pins) {
      const n = i + 2;
      css += "#grid tbody td:nth-child(" + n + "){position:sticky;left:" + pinLeft + "px;z-index:2}";
      css += "#grid thead th:nth-child(" + n + "){left:" + pinLeft + "px;z-index:5}";
      css += "#grid tbody td:nth-child(" + n + "),#grid thead th:nth-child(" + n +
        "){border-right:1px solid var(--line)}";
      pinLeft += cols[i].width || COL_W;
    }
  }
  $("colstyle").textContent = css;

  $("gridwrap").hidden = !!(typeof chart === "object" && chart.on);
  $("drop").hidden = true;
  const nameRow = grid.querySelector("tr.r-name");
  document.documentElement.style.setProperty("--nameh", nameRow.offsetHeight + "px");
  state.first = -1;
  renderRows(true);
}

function renderRows(force) {
  const view = state.view;
  if (!view) return;
  const wrap = $("gridwrap"), body = $("tbody");
  if (!body) return;
  const [pageStart, pageEnd] = pageBounds();
  const total = pageEnd - pageStart;
  const ncols = view.cols.length;
  let first, visible;
  if (total * ncols <= CELL_BUDGET) {
    /* A small page goes into the DOM whole. Scrolling then costs nothing at
       all: the early return below sees the same window every time. Replacing
       the tbody is a fixed cost regardless of row count, so drawing 100 rows
       is no dearer than drawing the 35 that happen to be on screen. */
    first = 0;
    visible = total;
  } else {
    const head = wrap.querySelector("thead").offsetHeight;
    const viewport = wrap.clientHeight;
    const scroll = Math.max(0, wrap.scrollTop - head);
    visible = Math.ceil(viewport / ROW_H) + 12;
    first = Math.max(0, Math.floor(scroll / ROW_H) - 6);
    if (first + visible > total) first = Math.max(0, total - visible);
  }
  if (!force && first === state.first) return;
  state.first = first;
  const last = Math.min(total, first + visible);
  const cols = view.cols;
  const index = view.index;
  const span = ncols + 1;
  const specs = new Array(ncols), data = new Array(ncols);
  for (let i = 0; i < ncols; i++) { specs[i] = cols[i].spec; data[i] = cols[i].rows; }
  const parts = [];
  if (first > 0) {
    parts.push("<tr><td class='pad' colspan='" + span + "' style='height:" + first * ROW_H + "px'></td></tr>");
  }
  for (let r = first; r < last; r++) {
    const abs = pageStart + r;
    const src = index ? index[abs] : abs;
    parts.push("<tr data-r='", String(abs), "'><td class='rownum'>", String((view.agg ? abs : src) + 1), "</td>");
    for (let ci = 0; ci < ncols; ci++) {
      const v = data[ci][src];
      if (v === null || v === undefined) { parts.push("<td class='null'>null</td>"); continue; }
      let text = fmtValue(v, specs[ci]);
      if (text.length > 300) text = text.slice(0, 300) + "...";
      /* only long values need the tooltip, and skipping it halves the markup */
      parts.push(text.length > 22 ? "<td title='" + esc(text) + "'>" : "<td>", esc(text), "</td>");
    }
    parts.push("</tr>");
  }
  if (last < total) {
    parts.push("<tr><td class='pad' colspan='" + span + "' style='height:" + (total - last) * ROW_H + "px'></td></tr>");
  }
  body.innerHTML = parts.join("");
  if (state.inspectAt) closeInspector();
}

/* -------------------------------------------------------- column picker */
function refreshView(keepPage) {
  const page = state.page;
  if (state.query && state.query.active) runQuery();
  else setView(baseView(state.table));
  if (keepPage) { state.page = page; state.first = -1; renderRows(true); renderPager(); }
}
function renderPicker() {
  const table = state.table, d = state.display;
  if (!table || !d) return;
  const needle = ($("cpsearch") ? $("cpsearch").value : "").trim().toLowerCase();
  const order = d.order.filter((ci) => d.pinned.has(ci)).concat(d.order.filter((ci) => !d.pinned.has(ci)));
  let rows = "";
  for (const ci of order) {
    const c = table.cols[ci];
    if (!c) continue;
    if (needle && c.name.toLowerCase().indexOf(needle) < 0 && c.spec.label.toLowerCase().indexOf(needle) < 0) continue;
    const shown = !d.hidden.has(ci), pinned = d.pinned.has(ci);
    rows += "<div class='cprow" + (pinned ? " pinned" : "") + "' draggable='true' data-ci='" + ci + "'>" +
      "<span class='qgrab'>∷</span>" +
      "<input type='checkbox' data-act='cpshow' data-ci='" + ci + "'" + (shown ? " checked" : "") + ">" +
      "<span class='cpname" + (shown ? "" : " off") + "' title='" + esc(c.name) + "'>" + esc(c.name) + "</span>" +
      "<span class='qtag t-" + c.spec.kind + "'>" + typeTag(c.spec) + "</span>" +
      "<button class='cppin" + (pinned ? " on" : "") + "' data-act='cppin' data-ci='" + ci +
      "' title='" + (pinned ? "Unpin" : "Pin to the left") + "'>pin</button></div>";
  }
  const hidden = d.hidden.size;
  $("cphead").innerHTML = "<b>" + num(table.cols.length - hidden) + " of " + num(table.cols.length) +
    " columns</b><span class='grow'></span>" +
    "<button data-act='cpall' title='Show every column'>all</button>" +
    "<button data-act='cponly' title='Hide all but the first'>none</button>" +
    "<button data-act='cpclose'>×</button>";
  $("cplist").innerHTML = rows || "<div class='qhint' style='padding:8px'>no column matches</div>";
}
function togglePicker(show) {
  const el = $("colpick");
  const open = show === undefined ? el.hidden : show;
  el.hidden = !open;
  if (!open) return;
  renderPicker();
  const box = $("toggleCols").getBoundingClientRect();
  el.style.top = box.bottom + 4 + "px";
  el.style.left = Math.max(8, Math.min(box.left, window.innerWidth - el.offsetWidth - 8)) + "px";
  $("cpsearch").focus();
}
function initPicker() {
  $("toggleCols").addEventListener("click", () => togglePicker());
  $("toggleChart").addEventListener("click", () => showChart(!chart.on));
  $("cpsearch").addEventListener("input", renderPicker);
  const act = (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const d = state.display, ci = +el.dataset.ci;
    switch (el.dataset.act) {
      case "cpshow": if (d.hidden.has(ci)) d.hidden.delete(ci); else d.hidden.add(ci); break;
      case "cppin": if (d.pinned.has(ci)) d.pinned.delete(ci); else d.pinned.add(ci); break;
      case "cpall": d.hidden.clear(); break;
      case "cponly": {
        /* leaving everything hidden would be a blank grid, so keep the first */
        d.hidden = new Set(state.table.cols.map((c, i) => i).filter((i) => i !== displayOrder()[0]));
        break;
      }
      case "cpclose": togglePicker(false); return;
      default: return;
    }
    renderPicker();
    refreshView(true);
  };
  $("cphead").addEventListener("click", act);
  $("cplist").addEventListener("click", act);
  $("cplist").addEventListener("change", act);
  let dragging = null;
  $("cplist").addEventListener("dragstart", (e) => {
    const row = e.target.closest(".cprow");
    if (!row) return;
    dragging = +row.dataset.ci;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(dragging));
  });
  $("cplist").addEventListener("dragover", (e) => {
    const row = e.target.closest(".cprow");
    if (!row || dragging === null) return;
    e.preventDefault();
    for (const r of $("cplist").children) r.classList.remove("dropafter", "dropbefore");
    const box = row.getBoundingClientRect();
    row.classList.add(e.clientY > box.top + box.height / 2 ? "dropafter" : "dropbefore");
  });
  $("cplist").addEventListener("drop", (e) => {
    const row = e.target.closest(".cprow");
    if (!row || dragging === null) return;
    e.preventDefault();
    const target = +row.dataset.ci;
    const after = e.clientY > row.getBoundingClientRect().top + row.offsetHeight / 2;
    const d = state.display;
    d.order = d.order.filter((ci) => ci !== dragging);
    const at = d.order.indexOf(target);
    d.order.splice(at < 0 ? d.order.length : at + (after ? 1 : 0), 0, dragging);
    dragging = null;
    renderPicker();
    refreshView(true);
  });
  $("cplist").addEventListener("dragend", () => {
    dragging = null;
    for (const r of $("cplist").children) r.classList.remove("dropafter", "dropbefore");
  });
  document.addEventListener("pointerdown", (e) => {
    if (!$("colpick").hidden && !e.target.closest("#colpick") && !e.target.closest("#toggleCols")) {
      togglePicker(false);
    }
  }, true);
}


/* ======================================================================
   Charts
   Inline SVG, drawn by hand. Colours are the validated categorical order
   (see the palette note below); both modes are stepped for their own
   surface rather than flipped. Series keep their slot when others are
   switched off, so a colour always means the same column.
   ====================================================================== */
const SVGNS = "http://www.w3.org/2000/svg";
/* validated with the data-viz palette validator against this page's own
   surfaces: light #ffffff and dark #1c1e22, adjacent pairs, 6 slots */
const SERIES_LIGHT = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300"];
const SERIES_DARK = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300"];
const SERIES_CAP = SERIES_LIGHT.length;
const CHART_MAX_CATS = 30;

function darkNow() {
  const stamped = document.documentElement.getAttribute("data-theme");
  if (stamped === "dark") return true;
  if (stamped === "light") return false;
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function chartInk() {
  const dark = darkNow();
  return {
    series: dark ? SERIES_DARK : SERIES_LIGHT,
    surface: dark ? "#1c1e22" : "#ffffff",
    text: dark ? "#e6e6e3" : "#1c1c1a",
    dim: dark ? "#9b9d9f" : "#6b6b66",
    faint: dark ? "#6e7073" : "#9a9a94",
    grid: dark ? "#2c2f34" : "#e2e2dd",
  };
}
const el = (name, attrs) => {
  const n = document.createElementNS(SVGNS, name);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) n.setAttribute(k, attrs[k]);
  return n;
};
/** Labels come out of the file, so they go in as text, never as markup. */
function svgText(x, y, text, attrs) {
  const n = el("text", Object.assign({ x, y }, attrs));
  n.textContent = text;
  return n;
}
/** Column with a rounded data end and a square foot on the baseline. */
function barPath(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h));
  return "M" + x + "," + (y + h) + "V" + (y + rr) + "a" + rr + "," + rr + " 0 0 1 " + rr + ",-" + rr +
    "h" + (w - 2 * rr) + "a" + rr + "," + rr + " 0 0 1 " + rr + "," + rr + "V" + (y + h) + "Z";
}
function barPathH(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, h / 2, w));
  return "M" + x + "," + y + "H" + (x + w - rr) + "a" + rr + "," + rr + " 0 0 1 " + rr + "," + rr +
    "v" + (h - 2 * rr) + "a" + rr + "," + rr + " 0 0 1 -" + rr + "," + rr + "H" + x + "Z";
}
/** Axis ticks on round numbers, so the reader gets 0 / 1,000 / 2,000. */
function niceTicks(lo, hi, want) {
  if (!isFinite(lo) || !isFinite(hi)) return { ticks: [0], lo: 0, hi: 1 };
  if (lo === hi) { const pad = Math.abs(lo) || 1; lo -= pad / 2; hi += pad / 2; }
  const raw = (hi - lo) / Math.max(1, want);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm >= 7.5 ? 10 : norm >= 3 ? 5 : norm >= 1.5 ? 2 : 1) * mag;
  const start = Math.ceil(lo / step) * step;
  const ticks = [];
  for (let t = start; t <= hi + step * 1e-9 && ticks.length < 40; t += step) {
    ticks.push(Math.abs(t) < step * 1e-9 ? 0 : t);
  }
  return { ticks, step };
}
function tickLabel(v, spec) {
  if (spec && spec.kind === "temporal") return fmtTemporal(v, spec);
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(a >= 1e10 ? 0 : 1) + "B";
  if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1) + "M";
  if (a >= 1e4) return (v / 1e3).toFixed(0) + "k";
  if (Number.isInteger(v)) return v.toLocaleString("en-US");
  return String(Number(v.toPrecision(4)));
}

const chart = { on: false, type: "auto", x: -1, series: [], stacked: false };

function numericCols(view) {
  return view.cols.map((c, i) => i).filter((i) => view.cols[i].spec.kind === "number");
}
/** Picks sensible axes for whatever the view currently is. */
function chartDefaults(view) {
  const nums = numericCols(view);
  let x = view.cols.findIndex((c) => c.spec.kind === "temporal");
  if (x < 0) x = view.cols.findIndex((c) => c.spec.kind === "string" || c.spec.kind === "bool");
  if (x < 0) x = nums.length > 1 ? nums[0] : 0;
  const series = nums.filter((i) => i !== x).slice(0, SERIES_CAP);
  chart.x = x;
  chart.series = series.length ? series : nums.slice(0, 1);
  chart.type = "auto";
  chart.stacked = false;
}
function effectiveType(view, cats) {
  if (chart.type !== "auto") return chart.type;
  const xs = view.cols[chart.x];
  if (xs && xs.spec.kind === "temporal") return "line";
  const longNames = cats.some((c) => String(c.label).length > 12);
  return cats.length > 14 || longNames ? "bar" : "column";
}

/** Rolls the view into one point per x, summing when an x repeats. */
function chartData(view) {
  const xi = chart.x;
  const xcol = view.cols[xi];
  if (!xcol) return null;
  const sers = chart.series.filter((i) => view.cols[i]).slice(0, SERIES_CAP);
  if (!sers.length) return null;
  const groups = new Map();
  let collapsed = 0;
  for (let r = 0; r < view.count; r++) {
    const xv = viewValue(view, xi, r);
    const key = xv === null || xv === undefined ? "\u0000null" : String(xv);
    let g = groups.get(key);
    if (!g) {
      g = { x: xv, label: xv === null || xv === undefined ? "(null)" : fmtValue(xv, xcol.spec),
        ys: sers.map(() => null), rows: 0 };
      groups.set(key, g);
    } else collapsed++;
    g.rows++;
    sers.forEach((ci, si) => {
      const v = numeric(viewValue(view, ci, r));
      if (v === v && isFinite(v)) g.ys[si] = (g.ys[si] === null ? 0 : g.ys[si]) + v;
    });
  }
  let points = [...groups.values()];
  const temporal = xcol.spec.kind === "temporal";
  const numericX = xcol.spec.kind === "number";
  if (temporal || numericX) points.sort((a, b) => numeric(a.x) - numeric(b.x));
  return {
    points, collapsed, temporal, numericX,
    xcol, series: sers.map((ci) => view.cols[ci]), seriesIdx: sers,
  };
}

function renderChart() {
  const host = $("chartbody");
  if (!host) return;
  host.textContent = "";
  $("chartlegend").textContent = "";
  const view = state.view;
  if (!view) return;
  if (chart.x < 0 || chart.x >= view.cols.length) chartDefaults(view);
  const data = chartData(view);
  const note = $("chartnote");
  note.textContent = "";
  if (!data) {
    host.appendChild(emptyMessage("Pick a column for each axis — a chart needs one to group by and one to measure."));
    return;
  }
  if (!view.count) {
    host.appendChild(emptyMessage("Nothing to chart: the current result has no rows."));
    return;
  }
  const ink = chartInk();

  /* one value is a number, not a chart */
  if (data.points.length === 1 && data.series.length === 1) {
    host.appendChild(heroFigure(data, ink));
    return;
  }

  renderChartLegend(data, ink);      /* before measuring: it takes height from the body */
  const box = host.getBoundingClientRect();
  const W = Math.max(320, Math.floor(box.width)), H = Math.max(160, Math.floor(box.height));

  let points = data.points;
  const type = effectiveType(view, points);
  /* a horizontal bar needs a readable row; never draw more than will fit */
  const maxCats = type === "bar" ? Math.max(5, Math.floor((H - 44) / 15)) : CHART_MAX_CATS;
  let capped = 0;
  if ((type === "column" || type === "bar") && points.length > maxCats) {
    const ranked = points.slice().sort((a, b) => Math.abs(b.ys[0] || 0) - Math.abs(a.ys[0] || 0));
    points = ranked.slice(0, maxCats);
    capped = data.points.length;
    if (data.temporal || data.numericX) points.sort((a, b) => numeric(a.x) - numeric(b.x));
  }
  const notes = [];
  if (capped) notes.push("top " + points.length + " of " + num(capped) + " by " + data.series[0].name);
  if (data.collapsed) notes.push(num(data.collapsed) + " rows summed into their category — group in the query for a cleaner chart");
  if (chart.series.length > SERIES_CAP) notes.push("first " + SERIES_CAP + " series shown");
  note.textContent = notes.join(" · ");

  const svg = el("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H,
    style: "display:block", role: "img" });
  svg.appendChild(el("rect", { x: 0, y: 0, width: W, height: H, fill: ink.surface }));
  const draw = type === "bar" ? drawHorizontal : type === "line" ? drawLine
    : type === "scatter" ? drawScatter : drawColumn;
  draw(svg, { W, H, ink, data, points, stacked: chart.stacked && data.series.length > 1 });
  host.appendChild(svg);
}
function emptyMessage(text) {
  const d = document.createElement("div");
  d.className = "chartempty";
  d.textContent = text;
  return d;
}
/** A single number is a hero figure; a one-bar bar chart is not a chart. */
function heroFigure(data, ink) {
  const d = document.createElement("div");
  d.className = "chartsolo";
  const v = document.createElement("div");
  v.className = "herofig";
  v.textContent = fmtValue(data.points[0].ys[0], data.series[0].spec);
  const l = document.createElement("div");
  l.className = "herolab";
  const same = data.xcol === data.series[0];
  l.textContent = same ? data.series[0].name : data.series[0].name + " · " + data.points[0].label;
  d.appendChild(v);
  d.appendChild(l);
  return d;
}

/* ---------------------------------------------------------- axes & grid */
function measureText(text, size) { return String(text).length * size * 0.58; }

function yAxis(svg, ink, lo, hi, plot, spec, horizontal) {
  const { ticks } = niceTicks(lo, hi, horizontal ? 5 : 5);
  const scale = (v) => (horizontal
    ? plot.x + (v - lo) / (hi - lo) * plot.w
    : plot.y + plot.h - (v - lo) / (hi - lo) * plot.h);
  for (const t of ticks) {
    const p = scale(t);
    if (horizontal) {
      svg.appendChild(el("line", { x1: p, y1: plot.y, x2: p, y2: plot.y + plot.h,
        stroke: ink.grid, "stroke-width": 1 }));
      svg.appendChild(svgText(p, plot.y + plot.h + 14, tickLabel(t, spec),
        { fill: ink.dim, "font-size": 10, "text-anchor": "middle", "font-family": "ui-monospace,monospace" }));
    } else {
      svg.appendChild(el("line", { x1: plot.x, y1: p, x2: plot.x + plot.w, y2: p,
        stroke: ink.grid, "stroke-width": 1 }));
      svg.appendChild(svgText(plot.x - 7, p + 3.5, tickLabel(t, spec),
        { fill: ink.dim, "font-size": 10, "text-anchor": "end", "font-family": "ui-monospace,monospace" }));
    }
  }
  return scale;
}
function domainOf(points, fromZero) {
  let lo = Infinity, hi = -Infinity;
  for (const p of points) for (const v of p.ys) { if (v === null) continue; if (v < lo) lo = v; if (v > hi) hi = v; }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  if (fromZero) { lo = Math.min(0, lo); hi = Math.max(0, hi); }
  if (lo === hi) { hi = lo + (Math.abs(lo) || 1); }
  return [lo, hi];
}
function stackDomain(points) {
  let lo = 0, hi = 0;
  for (const p of points) {
    let pos = 0, neg = 0;
    for (const v of p.ys) { if (v === null) continue; if (v >= 0) pos += v; else neg += v; }
    if (pos > hi) hi = pos;
    if (neg < lo) lo = neg;
  }
  if (lo === hi) hi = lo + 1;
  return [lo, hi];
}

/* ------------------------------------------------------------- columns */
function drawColumn(svg, ctx) {
  const { W, H, ink, data, points, stacked } = ctx;
  const n = data.series.length;
  const labelSize = 10;
  const maxLabel = points.reduce((a, p) => Math.max(a, measureText(p.label, labelSize)), 0);
  const slot = (W - 60) / Math.max(1, points.length);
  const rotate = maxLabel > slot - 6;
  const bottom = rotate ? Math.min(90, maxLabel + 16) : 26;
  const [lo, hi] = stacked ? stackDomain(points) : domainOf(points, true);
  const left = 14 + measureText(tickLabel(hi, data.series[0].spec), 10);
  const plot = { x: left, y: 12, w: W - left - 12, h: H - 12 - bottom };
  const scale = yAxis(svg, ink, lo, hi, plot, data.series[0].spec, false);
  svg.appendChild(el("line", { x1: plot.x, y1: scale(Math.max(lo, Math.min(hi, 0))),
    x2: plot.x + plot.w, y2: scale(Math.max(lo, Math.min(hi, 0))), stroke: ink.grid, "stroke-width": 1 }));

  const band = plot.w / points.length;
  const inner = Math.min(24 * (stacked ? 1 : n) + (stacked ? 0 : (n - 1) * 2), band * 0.72);
  const barW = stacked ? inner : Math.max(2, (inner - (n - 1) * 2) / n);
  points.forEach((p, pi) => {
    const cx = plot.x + band * (pi + 0.5);
    if (stacked) {
      let up = 0, down = 0;
      p.ys.forEach((v, si) => {
        if (v === null) return;
        const base = v >= 0 ? up : down;
        const y0 = scale(base), y1 = scale(base + v);
        if (v >= 0) up += v; else down += v;
        const top = Math.min(y0, y1), h = Math.max(0, Math.abs(y1 - y0) - 2);   /* 2px surface gap */
        if (h <= 0) return;
        svg.appendChild(markRect(barPath(cx - barW / 2, top, barW, h, si === 0 ? 4 : 0),
          ink.series[si % SERIES_CAP], p, si, data));
      });
    } else {
      p.ys.forEach((v, si) => {
        if (v === null) return;
        const zero = scale(Math.max(lo, Math.min(hi, 0)));
        const y = scale(v);
        const x = cx - inner / 2 + si * (barW + 2);
        const top = Math.min(zero, y), h = Math.max(1, Math.abs(zero - y));
        svg.appendChild(markRect(barPath(x, top, barW, h, 4), ink.series[si % SERIES_CAP], p, si, data));
      });
    }
    const t = svgText(cx, plot.y + plot.h + (rotate ? 12 : 16), p.label, {
      fill: ink.dim, "font-size": labelSize, "font-family": "ui-monospace,monospace",
      "text-anchor": rotate ? "end" : "middle",
    });
    if (rotate) t.setAttribute("transform", "rotate(-40 " + cx + " " + (plot.y + plot.h + 12) + ")");
    svg.appendChild(t);
  });
}
function markRect(d, fill, point, si, data) {
  const p = el("path", { d, fill, class: "mark" });
  p.addEventListener("pointerenter", (e) => showChartTip(e, point, data, si));
  p.addEventListener("pointerleave", hideChartTip);
  return p;
}

/* --------------------------------------------------------- horizontal */
function drawHorizontal(svg, ctx) {
  const { W, H, ink, data, points, stacked } = ctx;
  const n = data.series.length;
  const maxLabel = points.reduce((a, p) => Math.max(a, measureText(p.label, 10)), 0);
  const left = Math.min(190, maxLabel + 10);
  const plot = { x: left, y: 10, w: W - left - 16, h: H - 10 - 26 };
  const [lo, hi] = stacked ? stackDomain(points) : domainOf(points, true);
  const scale = yAxis(svg, ink, lo, hi, plot, data.series[0].spec, true);
  const band = plot.h / points.length;
  const inner = Math.min(24 * (stacked ? 1 : n) + (stacked ? 0 : (n - 1) * 2), band * 0.72);
  const barH = stacked ? inner : Math.max(2, (inner - (n - 1) * 2) / n);
  points.forEach((p, pi) => {
    const cy = plot.y + band * (pi + 0.5);
    if (stacked) {
      let up = 0;
      p.ys.forEach((v, si) => {
        if (v === null) return;
        const x0 = scale(up), x1 = scale(up + v);
        up += v;
        const x = Math.min(x0, x1), w = Math.max(0, Math.abs(x1 - x0) - 2);
        if (w <= 0) return;
        svg.appendChild(markRect(barPathH(x, cy - barH / 2, w, barH, si === 0 ? 4 : 0),
          ink.series[si % SERIES_CAP], p, si, data));
      });
    } else {
      p.ys.forEach((v, si) => {
        if (v === null) return;
        const zero = scale(Math.max(lo, Math.min(hi, 0)));
        const x1 = scale(v);
        const y = cy - inner / 2 + si * (barH + 2);
        svg.appendChild(markRect(barPathH(Math.min(zero, x1), y, Math.max(1, Math.abs(x1 - zero)), barH, 4),
          ink.series[si % SERIES_CAP], p, si, data));
      });
    }
    svg.appendChild(svgText(left - 6, cy + 3.5, p.label, {
      fill: ink.dim, "font-size": 10, "text-anchor": "end", "font-family": "ui-monospace,monospace" }));
  });
}

/* -------------------------------------------------------------- lines */
function drawLine(svg, ctx) {
  const { W, H, ink, data, points } = ctx;
  const [lo, hi] = domainOf(points, false);
  const left = 14 + measureText(tickLabel(hi, data.series[0].spec), 10);
  const plot = { x: left, y: 12, w: W - left - 14, h: H - 12 - 28 };
  const yScale = yAxis(svg, ink, lo, hi, plot, data.series[0].spec, false);
  const numericX = data.temporal || data.numericX;
  const xs = points.map((p, i) => (numericX ? numeric(p.x) : i));
  const xLo = Math.min.apply(null, xs), xHi = Math.max.apply(null, xs);
  const xScale = (v) => plot.x + (xHi === xLo ? plot.w / 2 : (v - xLo) / (xHi - xLo) * plot.w);

  const { ticks } = niceTicks(xLo, xHi, Math.max(2, Math.min(6, Math.floor(plot.w / 110))));
  for (const t of (numericX ? ticks : xs.filter((_, i) => i % Math.ceil(xs.length / 6) === 0))) {
    const px = xScale(t);
    svg.appendChild(svgText(px, plot.y + plot.h + 16,
      numericX ? tickLabel(t, data.xcol.spec) : points[xs.indexOf(t)].label,
      { fill: ink.dim, "font-size": 10, "text-anchor": "middle", "font-family": "ui-monospace,monospace" }));
  }
  data.series.forEach((s, si) => {
    let d = "", open = false;
    points.forEach((p, i) => {
      const v = p.ys[si];
      if (v === null) { open = false; return; }
      const px = xScale(xs[i]), py = yScale(v);
      d += (open ? "L" : "M") + px.toFixed(1) + "," + py.toFixed(1);
      open = true;
    });
    if (d) {
      svg.appendChild(el("path", { d, fill: "none", stroke: ink.series[si % SERIES_CAP],
        "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }
    if (points.length <= 60) {
      points.forEach((p, i) => {
        if (p.ys[si] === null) return;
        svg.appendChild(el("circle", { cx: xScale(xs[i]), cy: yScale(p.ys[si]), r: 4,
          fill: ink.series[si % SERIES_CAP], stroke: ink.surface, "stroke-width": 2 }));
      });
    }
  });
  crosshairLayer(svg, plot, points, xs, xScale, data, ink);
}
/** The reader aims at an x, never at a 2px line. */
function crosshairLayer(svg, plot, points, xs, xScale, data, ink) {
  const line = el("line", { x1: 0, y1: plot.y, x2: 0, y2: plot.y + plot.h,
    stroke: ink.faint, "stroke-width": 1, visibility: "hidden" });
  svg.appendChild(line);
  const hit = el("rect", { x: plot.x, y: plot.y, width: plot.w, height: plot.h, fill: "transparent" });
  hit.addEventListener("pointermove", (e) => {
    const box = svg.getBoundingClientRect();
    const px = e.clientX - box.left;
    let best = 0, bestD = Infinity;
    for (let i = 0; i < xs.length; i++) {
      const d = Math.abs(xScale(xs[i]) - px);
      if (d < bestD) { bestD = d; best = i; }
    }
    line.setAttribute("x1", xScale(xs[best]));
    line.setAttribute("x2", xScale(xs[best]));
    line.setAttribute("visibility", "visible");
    showChartTip(e, points[best], data, -1);
  });
  hit.addEventListener("pointerleave", () => { line.setAttribute("visibility", "hidden"); hideChartTip(); });
  svg.appendChild(hit);
}

/* ------------------------------------------------------------ scatter */
function drawScatter(svg, ctx) {
  const { W, H, ink, data, points } = ctx;
  const [lo, hi] = domainOf(points, false);
  const left = 14 + measureText(tickLabel(hi, data.series[0].spec), 10);
  const plot = { x: left, y: 12, w: W - left - 14, h: H - 12 - 28 };
  const yScale = yAxis(svg, ink, lo, hi, plot, data.series[0].spec, false);
  const numericX = data.temporal || data.numericX;
  const xs = points.map((p, i) => (numericX ? numeric(p.x) : i));
  const xLo = Math.min.apply(null, xs), xHi = Math.max.apply(null, xs);
  const xScale = (v) => plot.x + (xHi === xLo ? plot.w / 2 : (v - xLo) / (xHi - xLo) * plot.w);
  const { ticks } = niceTicks(xLo, xHi, Math.max(2, Math.min(6, Math.floor(plot.w / 110))));
  for (const t of ticks) {
    svg.appendChild(svgText(xScale(t), plot.y + plot.h + 16, tickLabel(t, data.xcol.spec),
      { fill: ink.dim, "font-size": 10, "text-anchor": "middle", "font-family": "ui-monospace,monospace" }));
  }
  data.series.forEach((s, si) => {
    points.forEach((p, i) => {
      if (p.ys[si] === null) return;
      const dot = el("circle", { cx: xScale(xs[i]), cy: yScale(p.ys[si]), r: 4,
        fill: ink.series[si % SERIES_CAP], stroke: ink.surface, "stroke-width": 2 });
      svg.appendChild(dot);
    });
  });
  /* dots are pinpoints; let the pointer be nearest rather than dead-centre */
  const hit = el("rect", { x: plot.x, y: plot.y, width: plot.w, height: plot.h, fill: "transparent" });
  hit.addEventListener("pointermove", (e) => {
    const box = svg.getBoundingClientRect();
    const px = e.clientX - box.left, py = e.clientY - box.top;
    let best = -1, bestD = Infinity, bestS = 0;
    points.forEach((p, i) => {
      p.ys.forEach((v, si) => {
        if (v === null) return;
        const dx = xScale(xs[i]) - px, dy = yScale(v) - py;
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; bestS = si; }
      });
    });
    if (best >= 0 && bestD < 40 * 40) showChartTip(e, points[best], data, bestS);
    else hideChartTip();
  });
  hit.addEventListener("pointerleave", hideChartTip);
  svg.appendChild(hit);
}

/* ------------------------------------------------------ legend & tooltip */

function showChartTip(e, point, data, si) {

/* --------------------------------------------------------------- panel */

/* ------------------------------------------------------- cell inspector */
function hexDump(bytes) {
  const lines = [];
  for (let off = 0; off < bytes.length; off += 16) {
    const slice = bytes.subarray(off, off + 16);
    let h = "", a = "";
    for (let i = 0; i < 16; i++) {
      h += i < slice.length ? HEX[slice[i]] + (i === 7 ? "  " : " ") : (i === 7 ? "    " : "   ");
      if (i < slice.length) { const c = slice[i]; a += c >= 32 && c < 127 ? String.fromCharCode(c) : "."; }
    }
    lines.push(off.toString(16).padStart(8, "0") + "  " + h + " |" + a + "|");
  }
  return lines.join("\n");
}
/** The whole value, laid out for reading rather than for a table cell. */
function inspectText(v, spec) {
  if (v === null || v === undefined) return "null";
  if (spec.kind === "binary" && v instanceof Uint8Array) return hexDump(v);
  if (spec.kind === "nested") {
    const inner = { kind: spec.elementKind, sub: spec.sub, utc: spec.utc };
    const walk = (x) => {
      if (x === null || x === undefined) return null;
      if (Array.isArray(x)) return x.map(walk);
      if (inner.kind === "bool") return x === true;
      if (inner.kind === "number" && typeof x === "number") return x;
      if (inner.kind === "binary" && x instanceof Uint8Array) return hex(x);
      return fmtValue(x, inner);
    };
    try { return JSON.stringify(walk(v), null, 2); } catch (e) { return String(v); }
  }
  return fmtValue(v, spec);
}
function closeInspector() {
  const el = $("inspect");
  el.hidden = true;
  state.inspectAt = null;
}
function openInspector(viewRow, ci, cell) {
  const view = state.view;
  if (!view || !view.cols[ci]) return;
  const col = view.cols[ci], spec = col.spec;
  const v = viewValue(view, ci, viewRow);
  const text = inspectText(v, spec);
  const isNull = v === null || v === undefined;
  const bits = [];
  if (col.leaf) {
    bits.push(col.leaf.type + (col.leaf.typeLength ? "(" + col.leaf.typeLength + ")" : ""));
    bits.push(col.leaf.rep.toLowerCase());
  }
  let size = "";
  if (typeof v === "string") size = num(v.length) + " chars";
  else if (v instanceof Uint8Array) size = num(v.length) + " bytes";
  else if (Array.isArray(v)) size = num(v.length) + (v.length === 1 ? " element" : " elements");
  const srcRow = view.index ? view.index[viewRow] : viewRow;
  $("inspect").innerHTML =
    "<div class='ihead'><b>" + esc(col.leaf ? col.leaf.path.join(".") : col.name) + "</b>" +
    "<span class='grow'></span><button id='icopy'>copy</button><button id='iclose'>×</button></div>" +
    "<div class='imeta'><span class='t-" + spec.kind + "'>" + esc(spec.label) + "</span>" +
    (bits.length ? "<span class='muted'>" + esc(bits.join(" · ")) + "</span>" : "") +
    "<span class='muted'>row " + num((view.agg ? viewRow : srcRow) + 1) + "</span>" +
    (size ? "<span class='muted'>" + size + "</span>" : "") + "</div>" +
    "<pre class='ibody" + (isNull ? " null" : "") + "'>" + esc(text) + "</pre>";
  const el = $("inspect");
  el.hidden = false;
  const box = cell.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = Math.min(box.left, window.innerWidth - w - 8);
  let top = box.bottom + 4;
  if (top + h > window.innerHeight - 8) top = Math.max(8, box.top - h - 4);
  el.style.left = Math.max(8, left) + "px";
  el.style.top = top + "px";
  state.inspectAt = { viewRow, ci };
  $("iclose").onclick = closeInspector;
  $("icopy").onclick = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
    $("icopy").textContent = "copied";
    setTimeout(() => { const b = $("icopy"); if (b) b.textContent = "copy"; }, 1200);
  };
}

/* ------------------------------------------------------------ metadata */
function statValue(bytes, leaf, spec) {
  if (!bytes || !bytes.length) return null;
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let raw;
  switch (leaf.type) {
    case "BOOLEAN": raw = bytes[0] === 1; break;
    case "INT32": raw = dv.getInt32(0, true); break;
    case "INT64": {
      const v = dv.getBigInt64(0, true);
      raw = (v >= -9007199254740991n && v <= 9007199254740991n) ? Number(v) : v;
      break;
    }
    case "FLOAT": raw = dv.getFloat32(0, true); break;
    case "DOUBLE": raw = dv.getFloat64(0, true); break;
    case "INT96": raw = { int96: true, nanos: dv.getBigUint64(0, true), julian: dv.getUint32(8, true) }; break;
    default: raw = bytes;
  }
  try {
    const elem = spec.nested ? Object.assign({}, spec, { kind: spec.elementKind }) : spec;
    const t = fmtValue(spec.convert(raw), elem);
    return t == null ? null : (t.length > 60 ? t.slice(0, 60) + "..." : t);
  } catch (e) { return hex(bytes, 16); }
}

function schemaTree(meta) {
  const lines = [];
  const walk = (node, depth) => {
    if (depth > 0) {
      const bits = [];
      bits.push(node.type ? node.type + (node.typeLength ? "(" + node.typeLength + ")" : "") : "group");
      const lt = node.logical ? node.logical.name : node.converted;
      if (lt) bits.push(lt.toLowerCase());
      lines.push("  ".repeat(depth - 1) + "<span class='rp'>" + node.rep.toLowerCase().padEnd(8) +
        "</span> <span class='nm'>" + esc(node.name) + "</span> <span class='ty'>" + esc(bits.join(" ")) + "</span>");
    }
    for (const c of node.children) walk(c, depth + 1);
  };
  walk(meta.schema.root, 0);
  return "<div class='tree'>" + lines.join("\n") + "</div>";
}

function datasetName(dataset) {
  const first = dataset.parts[0].path;
  const cut = first.indexOf("/");
  return cut > 0 ? first.slice(0, cut) + "/" : first;
}
function renderMeta() {
  const meta = state.meta, table = state.table, src = state.src;
  const dataset = state.dataset;
  const leaves = meta.schema.leaves;
  const agg = leaves.map(() => ({ comp: 0, uncomp: 0, values: 0, nulls: 0, statNulls: false,
    enc: new Set(), codec: new Set() }));
  let totalComp = 0, totalUncomp = 0;
  const allGroups = [];
  for (const part of (dataset ? dataset.parts : [{ meta }])) {
    for (const rg of part.meta.rowGroups) allGroups.push({ rg, part });
  }
  for (const { rg } of allGroups) {
    rg.columns.forEach((c, i) => {
      if (!c.meta || i >= agg.length) return;
      const a = agg[i];
      a.comp += c.meta.totalCompressedSize;
      a.uncomp += c.meta.totalUncompressedSize;
      a.values += c.meta.numValues;
      if (c.meta.statistics && c.meta.statistics.nullCount != null) {
        a.nulls += c.meta.statistics.nullCount;
        a.statNulls = true;
      }
      for (const e of c.meta.encodings) a.enc.add(e);
      a.codec.add(c.meta.codec);
      totalComp += c.meta.totalCompressedSize;
      totalUncomp += c.meta.totalUncompressedSize;
    });
  }
  const codecs = new Set(), encs = new Set();
  for (const a of agg) { for (const c of a.codec) codecs.add(c); for (const e of a.enc) encs.add(e); }

  $("mbar").innerHTML = [
    dataset && dataset.parts.length > 1
      ? "<span class='tag'>files <b>" + num(dataset.parts.length) + "</b></span>" : "",
