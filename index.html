<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>paris-parquet</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#fff; --ink:#1c1c1a; --dim:#6b6b66; --faint:#9a9a94;
  --line:#e2e2dd; --line2:#efefea; --accent:#2f6fdd; --accent-soft:#e8f0fd;
  --num:#1a6b4a; --str:#8a4b1f; --bool:#7a3fa0; --time:#1d5f8a; --bin:#6b6b66;
  --ok:#1a7a4a; --ok-soft:#e9f6ef; --err-soft:#fceded;
  --warn:#b3541e; --err:#b32020; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
/* dark follows the browser unless the theme button has picked a side */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --panel:#1c1e22; --ink:#e6e6e3; --dim:#9b9d9f; --faint:#6e7073;
    --line:#2c2f34; --line2:#242024; --accent:#6ea3ff; --accent-soft:#22293a;
    --num:#6fd0a3; --str:#e0a06a; --bool:#c59cf0; --time:#7cc4ef; --bin:#9b9d9f;
    --warn:#e09a5e; --err:#f08a8a; --ok:#6fd0a3; --ok-soft:#1b2c26; --err-soft:#2e2022;
  }
}
:root[data-theme="dark"]{
    --bg:#16171a; --panel:#1c1e22; --ink:#e6e6e3; --dim:#9b9d9f; --faint:#6e7073;
    --line:#2c2f34; --line2:#242024; --accent:#6ea3ff; --accent-soft:#22293a;
    --num:#6fd0a3; --str:#e0a06a; --bool:#c59cf0; --time:#7cc4ef; --bin:#9b9d9f;
    --warn:#e09a5e; --err:#f08a8a; --ok:#6fd0a3; --ok-soft:#1b2c26; --err-soft:#2e2022;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);
  background:var(--panel);flex:none;overflow:hidden}
h1{font:600 13px/1 var(--mono);margin:0;letter-spacing:.02em;white-space:nowrap;flex:none}
h1 span{color:var(--faint);font-weight:400}
.grow{flex:1}
button,label.btn{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:5px;
  background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;flex:none}
button:hover,label.btn:hover{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.45;cursor:default;border-color:var(--line);color:var(--dim)}
input[type=file]{display:none}
#fileline{font:11px/1.4 var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
#fileline b{color:var(--ink);font-weight:600}

/* ---------- drop zone / states ---------- */
#stage{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#drop{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim);text-align:center;padding:30px}
#drop .big{font:500 15px/1.4 var(--mono);color:var(--ink)}
#drop .hint{font-size:12px;max-width:44em;color:var(--faint)}
body.dragging #drop{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-14px}
#err{margin:14px;padding:10px 12px;border:1px solid var(--err);border-radius:6px;color:var(--err);
  font:12px/1.5 var(--mono);white-space:pre-wrap;background:var(--panel)}
#busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--bg) 80%,transparent);font:12px var(--mono);color:var(--dim);z-index:30}

/* ---------- pagination ---------- */
#pager{flex:none;display:flex;align-items:center;gap:7px;padding:4px 10px;border-top:1px solid var(--line);
  background:var(--panel);font:11px/1.6 var(--mono);color:var(--dim);flex-wrap:wrap}
#pager button{padding:1px 8px;font-size:12px;line-height:1.3;min-width:26px}
#pager input,#pager select{font:11px var(--mono);background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:1px 4px}
#pager input{width:52px;text-align:right}
#pager b{color:var(--accent);font-weight:600}
.pinfo{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.psep{width:1px;height:13px;background:var(--line);display:inline-block}
#pager .grow{flex:1;min-width:8px}
#pager #expscope{max-width:130px}

/* ---------- grid ---------- */
#gridwrap{flex:1;overflow:auto;min-height:0;position:relative}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;font:12px/1.4 var(--mono)}
table.grid th,table.grid td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
  padding:0 7px;text-align:left;vertical-align:top;overflow:hidden;background:var(--panel)}
table.grid thead th{position:sticky;background:var(--panel);z-index:3}
tr.r-name th{top:0;z-index:4;border-bottom:1px solid var(--line);padding:5px 7px}
tr.r-sum th{top:var(--nameh,28px);z-index:4;border-bottom:2px solid var(--line);padding:5px 7px;height:116px}
table.grid th.rownum,table.grid td.rownum{position:sticky;left:0;z-index:2;width:62px;min-width:62px;
  text-align:right;color:var(--faint);border-right:1px solid var(--line);font-size:11px}
tr.r-name th.rownum,tr.r-sum th.rownum{z-index:6}
tbody td{height:22px;line-height:22px;padding-top:0;padding-bottom:0;white-space:nowrap;text-overflow:ellipsis}
tbody tr:hover td{background:var(--accent-soft)}
td.pad{height:auto;padding:0;border:0}

i.grip{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;z-index:5}
i.grip:hover,body.colsizing i.grip{background:var(--accent);opacity:.45}
th.sortable{cursor:pointer}
th.sortable:hover .cname{color:var(--accent)}
.sortmark{float:right;color:var(--accent);font-size:10px;line-height:14px;padding-left:3px}
.sortmark i{font-style:normal;font-size:8px;vertical-align:super;color:var(--faint)}
.cname{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctype{display:block;color:var(--faint);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-number{color:var(--num)} .t-string{color:var(--str)} .t-bool{color:var(--bool)}
.t-temporal{color:var(--time)} .t-binary{color:var(--bin)} .t-nested{color:var(--dim)}
table.grid td.v-number{text-align:right}
td.v-bool{color:var(--bool)} td.v-binary{color:var(--dim)} td.v-nested{color:var(--dim)}
.null{color:var(--faint);font-style:italic}

/* ---------- summary cards ---------- */
.sum{font-size:10.5px;line-height:1.35;color:var(--dim);display:flex;flex-direction:column;gap:2px;height:106px;overflow:hidden}
.sum .kv{display:flex;justify-content:space-between;gap:6px}
.sum .kv span:last-child{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum .lab{color:var(--faint)}
.nullbar{height:4px;background:var(--line2);border-radius:2px;overflow:hidden;display:flex}
.nullbar i{display:block;height:100%}
.nullbar i.v{background:var(--accent)} .nullbar i.n{background:var(--line)}
.hist{display:flex;align-items:flex-end;gap:1px;height:26px;margin-top:1px}
.hist i{flex:1;background:var(--accent);opacity:.65;min-height:1px;border-radius:1px 1px 0 0}
.hist i:hover{opacity:1}
.top{display:flex;flex-direction:column;gap:1px}
.top .row{position:relative;display:flex;justify-content:space-between;gap:6px;padding:0 3px;border-radius:2px;overflow:hidden}
.top .row i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.16}
.top .row span{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .row span.c{color:var(--faint);flex:none}
.bools{display:flex;height:12px;border-radius:2px;overflow:hidden;font-size:9px;color:#fff;line-height:12px}
.bools i{display:block;text-align:center;overflow:hidden}
.bools i.t{background:var(--bool)} .bools i.f{background:var(--dim)} .bools i.n{background:var(--line)}

/* ---------- chart ---------- */
#chartwrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#chartbar{border-bottom:1px solid var(--line2)}
#chartbar select,#chartbar input[type=checkbox]{vertical-align:middle}
#chartbar select{font:11px var(--mono);background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:1px 4px;max-width:170px}
#chartbar button{padding:1px 8px;font-size:11px}
.cser{display:inline-flex;align-items:center;gap:3px;margin-right:7px;cursor:pointer}
.cser input{accent-color:var(--accent);margin:0}
#chartlegend{flex:none;display:flex;flex-wrap:wrap;gap:14px;padding:7px 14px 2px;font:11px var(--mono);
  color:var(--dim)}
#chartlegend:empty{display:none}
.lgi{display:inline-flex;align-items:center;gap:5px}
.lgi i{width:10px;height:10px;border-radius:2px;display:inline-block}
.lgi i.lgline{width:14px;height:2px;border-radius:1px}
#chartbody{flex:1;min-height:0;padding:4px 8px 6px;overflow:hidden}
#chartbody svg .mark{transition:opacity .08s}
#chartbody svg .mark:hover{opacity:.78}
.chartempty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--faint);font:12px var(--mono);padding:20px}
.chartsolo{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.herofig{font:600 52px/1 var(--mono);color:var(--ink)}
.herolab{font:12px var(--mono);color:var(--dim)}
#charttip{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:5px;
  box-shadow:0 4px 16px rgba(0,0,0,.18);padding:5px 8px;font:11px var(--mono);pointer-events:none;
  max-width:280px}
.ttcat{color:var(--dim);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttrow{display:flex;align-items:center;gap:6px;line-height:1.6}
.ttrow i{width:12px;height:2px;border-radius:1px;flex:none}
.ttrow b{color:var(--ink);font-weight:600}
.ttrow span{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- cell inspector ---------- */
#inspect{position:fixed;z-index:40;max-width:min(620px,92vw);max-height:60vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 6px 24px rgba(0,0,0,.18)}
.ihead{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line2);
  font:11px var(--mono)}
.ihead b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ihead button{padding:0 7px;font-size:11px;line-height:18px;min-width:0}
.imeta{display:flex;gap:9px;flex-wrap:wrap;padding:4px 8px;border-bottom:1px solid var(--line2);
  font:10.5px var(--mono)}
.ibody{margin:0;padding:8px;overflow:auto;font:11.5px/1.5 var(--mono);white-space:pre-wrap;
  word-break:break-word;color:var(--ink)}
.ibody.null{color:var(--faint);font-style:italic}

/* ---------- column picker ---------- */
#colpick{position:fixed;z-index:41;width:318px;max-height:70vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#cphead .muted{font-size:10px}
#cphead button{padding:0 6px;font-size:10.5px;line-height:18px;min-width:0}
.cpsearchwrap{padding:6px 8px;border-bottom:1px solid var(--line2)}
#cpsearch{width:100%;font:11px var(--mono);background:var(--bg);color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.cplist{overflow:auto;padding:2px 0}
.cprow{display:flex;align-items:center;gap:6px;padding:2px 8px;font:11px var(--mono);cursor:grab;
  border-top:1px solid transparent;border-bottom:1px solid transparent}
.cprow:hover{background:var(--accent-soft)}
.cprow.pinned{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.cprow.dropbefore{border-top-color:var(--accent)}
.cprow.dropafter{border-bottom-color:var(--accent)}
.cprow input[type=checkbox]{accent-color:var(--accent);margin:0}
.cpname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.cpname.off{color:var(--faint);text-decoration:line-through}
.cppin{font-size:9.5px;padding:0 5px;border:1px solid var(--line);border-radius:3px;background:var(--panel);
  color:var(--faint);min-width:0;line-height:15px}
.cppin.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- query builder ---------- */
#query{flex:none;height:var(--queryh,258px);display:flex;flex-direction:column;overflow:hidden;
  border-top:1px solid var(--line);background:var(--panel)}
.qbar{flex:none;display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid var(--line2);
  font:11px var(--mono);color:var(--dim);flex-wrap:wrap}
.qtitle{font-weight:700;letter-spacing:.08em;color:var(--dim)}
#qstat b{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:2px 9px;font-size:11px;background:var(--panel);color:var(--dim)}
.seg button.on{background:var(--accent);color:#fff}
.qbody{flex:1;display:flex;min-height:0}
.qcols{flex:0 0 196px;overflow:auto;border-right:1px solid var(--line2);background:var(--bg)}
.qhead{position:sticky;top:0;background:var(--bg);padding:5px 10px;font:10px var(--mono);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line2);
  display:flex;justify-content:space-between;align-items:center;z-index:1;
  white-space:nowrap;gap:6px}
.qcol{display:flex;align-items:center;gap:6px;padding:3px 10px;cursor:grab;font:11px var(--mono);
  border-bottom:1px solid var(--line2);user-select:none}
.qcol:hover{background:var(--accent-soft)}
.qgrab{color:var(--faint);font-size:10px;flex:none}
.qcname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.qtag{font-size:9px;font-weight:700;border:1px solid var(--line);border-radius:3px;padding:0 3px;flex:none}
.qzones{flex:1;overflow:auto;padding:9px 12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.qzone{min-width:0}
.qzlabel{font:10px var(--mono);font-weight:700;letter-spacing:.08em;color:var(--faint);margin-bottom:3px}
.qdrop{min-height:30px;border:1px dashed var(--line);border-radius:5px;padding:4px 7px;display:flex;
  flex-wrap:wrap;gap:4px;align-items:center;background:var(--panel)}
.qdrop.empty{background:var(--bg)}
.qdrop.over{border-color:var(--accent);background:var(--accent-soft)}
.qhint{font:11px var(--mono);color:var(--faint);user-select:none}
.qchip{display:inline-flex;align-items:center;gap:3px;font:11px var(--mono);background:var(--bg);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink)}
.qrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;width:100%}
.qrow code{font:11px var(--mono);background:var(--bg);border:1px solid var(--line2);border-radius:3px;
  padding:1px 6px;color:var(--ink)}
.qbtns{display:inline-flex;gap:2px}
.qb{font:10px var(--mono);padding:1px 5px;border:1px solid var(--line);border-radius:3px;background:var(--panel);
  color:var(--dim);font-weight:600;min-width:0}
.qb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.qlink{font:10px var(--mono);font-weight:700;color:var(--accent);background:none;border:1px solid var(--accent);
  border-radius:3px;padding:0 5px;width:36px}
.qin{font:11px var(--mono);background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:3px;padding:1px 5px}
.qx{background:none;border:0;color:var(--faint);cursor:pointer;font-size:13px;line-height:1;padding:0 2px;min-width:0}
.qx:hover{color:var(--err)}
.qin.bad{border-color:var(--err);color:var(--err)}
.qwarn{color:var(--warn);font-style:normal}
.qlimit{display:flex;align-items:center;gap:8px}
.qlimit .qzlabel{margin:0}
.qsqlwrap{flex:0 0 272px;border-left:1px solid var(--line2);display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg)}
.qsqlwrap .qhead button{font:10px var(--mono);padding:0 6px;border-radius:3px}
#qsql{margin:0;padding:8px 10px;overflow:auto;flex:1;font:11px/1.55 var(--mono);color:var(--ink);
  background:var(--bg);border:0;border-top:1px solid transparent;resize:none;outline:none;
  white-space:pre;min-height:60px;width:100%}
#qsql:focus{background:var(--panel);border-top-color:var(--accent)}
#qsql.bad{color:var(--err)}
#qsqlstate{font-size:10px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  min-width:0;flex:0 1 auto}
#qsqlstate.ok{color:var(--num)} #qsqlstate.bad{color:var(--err)} #qsqlstate.warn{color:var(--warn)}
#qsqlmsg{flex:none;max-height:38%;overflow:auto;border-top:1px solid var(--line2);padding:5px 8px;
  font:10.5px/1.5 var(--mono)}
#qsqlmsg .e{color:var(--err)} #qsqlmsg .w{color:var(--warn)}
#qsqlmsg div{margin-bottom:2px}
.qsqlwrap .qhead button{font:10px var(--mono);padding:0 6px;border-radius:3px}

#qplan{flex:none;padding:4px 12px;border-bottom:1px solid var(--line2);font:11px/1.5 var(--mono);
  color:var(--dim);background:var(--accent-soft)}
#qplan b{color:var(--accent);font-weight:600}
#qplan em{font-style:normal;color:var(--warn)}
#qscan.on{border-color:var(--accent);color:var(--accent)}

/* ---------- diff ---------- */
#diffwrap{flex:1;overflow:auto;min-height:0;background:var(--panel)}
#diffbar{display:flex;align-items:center;gap:9px;padding:6px 14px;border-bottom:1px solid var(--line2);
  position:sticky;top:0;background:var(--panel);z-index:3;font:11px var(--mono);color:var(--dim);flex-wrap:wrap}
#diffbar .btn,#diffbar button{padding:1px 8px;font-size:11px}
.dside{border:1px solid var(--line);border-radius:4px;padding:1px 6px;max-width:26vw;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.dside b{color:var(--accent);font-weight:600}
#diffbody{padding:4px 14px 18px;display:grid;grid-template-columns:minmax(300px,400px) 1fr;
  gap:2px 26px;align-items:start}
@media (max-width:980px){#diffbody{grid-template-columns:1fr}}
#dropb{grid-column:1/-1;margin:26px 0;padding:36px 20px;border:2px dashed var(--line);border-radius:8px;
  text-align:center;color:var(--dim)}
#dropb .big{font:500 14px/1.5 var(--mono);color:var(--ink)}
#dropb .hint{font-size:12px;color:var(--faint);margin-top:6px;line-height:1.6}
body.dragging #dropb{background:var(--accent-soft);border-color:var(--accent)}
table.dt td.d{text-align:right;width:20%}
/* the wide cards hug their content rather than stretching five columns
   across the window, which spreads a short answer into a sparse grid.
   #diffbody is here to outrank table.kvt's own width, set further down */
#diffbody table.dl,#diffbody table.ds,#diffbody table.dr{table-layout:auto;width:auto;max-width:100%}
#diffbody table.dl td,#diffbody table.ds td,#diffbody table.ds th,
#diffbody table.dr td,#diffbody table.dr th{padding-right:20px}
table.dl td.mk,table.dr td.mk{width:15px;font-weight:600;text-align:center;padding-right:6px}
.dfrom{color:var(--faint)}
.add{color:var(--ok)} .rem{color:var(--err)} .chg{color:var(--warn)} .ren{color:var(--accent)}
.da{color:var(--faint);text-decoration:line-through} .db{color:var(--ink)} .arrow{color:var(--faint)}
table.dr{table-layout:auto}
table.dr td,table.dr th{white-space:nowrap;max-width:26em}
table.dr td.moved{background:var(--accent-soft)}
table.dr tr.addrow td{background:var(--ok-soft)} table.dr tr.remrow td{background:var(--err-soft)}
table.dr td.ky{color:var(--accent)}
.okbox{border:1px solid var(--ok);color:var(--ok);border-radius:5px;padding:6px 9px;margin:8px 0;
  font:11px/1.5 var(--mono)}
.dnote{color:var(--faint);font:11px/1.6 var(--mono);padding-top:5px}
.dnote b{color:var(--dim)}
.dtally,.bycol,.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font:11px var(--mono);color:var(--dim)}
.dtally{padding:8px 0 4px} .bycol{padding:0 0 6px}
.dtally .tag,.bycol .tag{border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink)}
.dtally .tag b,.bycol .tag b{font-weight:600}
.chips{padding:3px 0 5px}
.chip{font:11px var(--mono);border:1px solid var(--line);background:var(--panel);color:var(--dim);
  border-radius:10px;padding:1px 9px;cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chips button.act{border-color:var(--accent);color:var(--accent);border-radius:5px;font-size:11px;padding:1px 9px}
.chips button{font:11px var(--mono);padding:1px 8px}

/* ---------- footer / metadata ---------- */
#mgrip{flex:none;height:7px;background:var(--bg);cursor:row-resize;position:relative;z-index:6}
#mgrip::after{content:"";position:absolute;left:50%;top:2px;margin-left:-19px;width:38px;height:3px;
  border-radius:2px;background:var(--line)}
#mgrip:hover::after,body.rowsizing #mgrip::after{background:var(--accent)}
#meta{flex:none;height:var(--metah,38vh);overflow:auto;border-top:1px solid var(--line);background:var(--panel)}
#meta.collapsed{height:auto;overflow:visible}
body.rowsizing{cursor:row-resize} body.colsizing{cursor:col-resize}
body.rowsizing,body.colsizing{user-select:none}
#meta.collapsed .mbody{display:none}
.mbar{display:flex;align-items:center;gap:10px;padding:6px 14px;border-bottom:1px solid var(--line2);
  position:sticky;top:0;background:var(--panel);z-index:2;font:11px var(--mono);color:var(--dim);flex-wrap:wrap}
#meta.collapsed .mbar{border-bottom:0}
.mbar .tag{border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink)}
.mbar .tag b{color:var(--accent);font-weight:600}
.mbody{padding:4px 14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:2px 22px;align-items:start}
.mcard{padding:8px 0;min-width:0}
.mcard h3{font:600 11px/1 var(--mono);margin:0 0 6px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
table.kvt{border-collapse:collapse;width:100%;font:11px/1.5 var(--mono);table-layout:fixed}
table.kvt td,table.kvt th{padding:1px 6px 1px 0;text-align:left;vertical-align:top;
  border-bottom:1px solid var(--line2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

table.kvt td.k{color:var(--faint);width:40%}
table.kvt td.n{text-align:right}

.wide{grid-column:1/-1}
.scrollx{overflow-x:auto}

.tree .nm{color:var(--ink)} .tree .ty{color:var(--accent)} .tree .rp{color:var(--faint)}

.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:5px;padding:6px 9px;margin:8px 0;font:11px/1.5 var(--mono)}

</head>
<body>
<header>
  <h1>paris-parquet <span>· single-file parquet viewer</span></h1>
  <label class="btn" for="picker">Open .parquet</label>
  <input type="file" id="picker" accept=".parquet,.pq,application/octet-stream" multiple>
  <label class="btn" for="dirpicker" title="Open a folder of parquet files as one table">Open folder</label>
  <input type="file" id="dirpicker" webkitdirectory directory>
  <input type="file" id="bpicker" accept=".parquet,.pq,application/octet-stream" multiple>
  <input type="file" id="bdirpicker" webkitdirectory directory>
  <div id="fileline"></div>
  <div class="grow"></div>
  <button id="more" hidden>Load more rows</button>
  <button id="all" hidden>Load all</button>
  <button id="toggleChart" hidden>Chart</button>
  <button id="toggleDiff" hidden title="Compare this file with another one">Diff</button>
  <button id="toggleCols" hidden>Columns</button>
  <button id="toggleQuery" hidden>Query</button>
  <button id="toggleMeta" hidden>Hide metadata</button>
  <button id="theme" title="Colour theme: follow the browser, or force light or dark">auto</button>
</header>

<div id="stage">
  <div id="drop">
    <div class="big">Drop a .parquet file here</div>
    <div class="hint">A file, several files, or a whole partitioned folder.
      Everything runs in this page: no server, no install, no network.
      Nothing leaves your machine.</div>
  </div>
  <div id="gridwrap" hidden><table class="grid" id="grid"></table></div>
  <div id="chartwrap" hidden>
    <div class="qbar" id="chartbar"></div>
    <div id="chartlegend"></div>
    <div id="chartbody"></div>
  </div>
  <div id="diffwrap" hidden>
    <div id="diffbar"></div>
    <div id="diffbody"></div>
  </div>
  <div id="pager" hidden></div>
  <div id="busy" hidden>reading…</div>
</div>

<div id="inspect" hidden></div>
<div id="charttip" hidden></div>
<div id="colpick" hidden>
  <div class="ihead" id="cphead"></div>
  <div class="cpsearchwrap"><input id="cpsearch" placeholder="search name or type"></div>
  <div class="cplist" id="cplist"></div>
</div>
<div id="qgrip" hidden title="Drag to resize the query panel"></div>
<section id="query" hidden>
  <div class="qbar">
    <span class="qtitle">QUERY</span>
    <span class="seg" id="qmode"><button data-mode="rows" class="on">Rows</button><button data-mode="agg">Aggregate</button></span>
    <button id="qrun" title="Run the query (Enter)">Run</button>
    <button id="qscan" disabled
      title="Read only the row groups whose own statistics allow a match, then run">Scan file</button>
    <button id="qclear" disabled>Reset</button>
    <span id="qstat"></span>
    <span class="grow"></span>
    <span class="muted">drag a column into a zone, or double-click it</span>
  </div>
  <div id="qplan" hidden></div>
  <div class="qbody">
    <div class="qcols" id="qcols"></div>
    <div class="qzones" id="qzones"></div>
    <div class="qsqlwrap">
      <div class="qhead">SQL <span id="qsqlstate"></span><span class="grow"></span>
        <button id="qformat" title="Rewrite it the way the builder would">tidy</button>
        <button id="qcopy">copy</button></div>
      <textarea id="qsql" spellcheck="false" wrap="off"
        title="Edit freely — valid SQL flows back into the zones"></textarea>
      <div id="qsqlmsg" hidden></div>
    </div>
  </div>
</section>
<div id="mgrip" hidden title="Drag to resize the metadata panel"></div>
<div id="meta" hidden>
  <div class="mbar" id="mbar"></div>
  <div class="mbody" id="mbody"></div>
</div>

<script>
"use strict";
/* =====================================================================
   paris-parquet — a self-contained parquet reader + viewer.
   No dependencies: thrift, snappy, lz4, zstd, gzip and every parquet
   encoding below are decoded in this file.
   ===================================================================== */

/* ---------------------------------------------------------------- bytes */
const utf8 = new TextDecoder("utf-8");

class Cursor {
  constructor(bytes, pos) {
    this.b = bytes;
    this.p = pos || 0;
    this.view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  }
  byte() { return this.b[this.p++]; }
  bytes(n) { const s = this.b.subarray(this.p, this.p + n); this.p += n; return s; }
  /** unsigned LEB128; uses float math so values above 2^31 stay correct */
  uvarint() {
    let shift = 1, out = 0, b;
    do { b = this.b[this.p++]; out += (b & 0x7f) * shift; shift *= 128; } while (b & 0x80);
    return out;
  }
  zigzag() { const v = this.uvarint(); return v % 2 ? -(v + 1) / 2 : v / 2; }
}

/* --------------------------------------------------- thrift compact read */
const TSTOP = 0, TTRUE = 1, TFALSE = 2, TBYTE = 3, TI16 = 4, TI32 = 5, TI64 = 6,
      TDOUBLE = 7, TBINARY = 8, TLIST = 9, TSET = 10, TMAP = 11, TSTRUCT = 12;

/** Reads a thrift-compact struct into a plain object keyed by field id. */
function thriftStruct(c) {
  const out = {};
  let last = 0;
  for (;;) {
    const head = c.byte();
    const type = head & 0x0f;
    if (type === TSTOP) return out;
    const delta = head >> 4;
    const id = delta ? last + delta : c.zigzag();
    last = id;
    out[id] = thriftValue(c, type);
  }
}
function thriftValue(c, type) {
  switch (type) {
    case TTRUE: return true;
    case TFALSE: return false;
    case TBYTE: return (c.byte() << 24) >> 24;
    case TI16: case TI32: case TI64: return c.zigzag();
    case TDOUBLE: { const v = c.view.getFloat64(c.p, true); c.p += 8; return v; }
    case TBINARY: return c.bytes(c.uvarint());
    case TLIST: case TSET: {
      const head = c.byte();
      const et = head & 0x0f;
      let n = head >> 4;
      if (n === 15) n = c.uvarint();
      const arr = new Array(n);
      /* compact writes list booleans as one byte each, unlike a struct field
         where the value lives in the type tag */
      const bools = et === TTRUE || et === TFALSE;
      for (let i = 0; i < n; i++) arr[i] = bools ? c.byte() === 1 : thriftValue(c, et);
      return arr;
    }
    case TMAP: {
      const n = c.uvarint();
      if (n === 0) return new Map();
      const kt = c.byte(), vt = kt & 0x0f, ktype = kt >> 4;
      const m = new Map();
      for (let i = 0; i < n; i++) m.set(thriftValue(c, ktype), thriftValue(c, vt));
      return m;
    }
    case TSTRUCT: return thriftStruct(c);
    default: throw new Error("thrift: unknown field type " + type);
  }
}
const str = (v) => (v == null ? null : utf8.decode(v));

/* ------------------------------------------------------------- constants */
const PTYPE = ["BOOLEAN", "INT32", "INT64", "INT96", "FLOAT", "DOUBLE", "BYTE_ARRAY", "FIXED_LEN_BYTE_ARRAY"];
const REP = ["REQUIRED", "OPTIONAL", "REPEATED"];
const CODEC = ["UNCOMPRESSED", "SNAPPY", "GZIP", "LZO", "BROTLI", "LZ4", "ZSTD", "LZ4_RAW"];
const ENC = { 0: "PLAIN", 1: "GROUP_VAR_INT", 2: "PLAIN_DICTIONARY", 3: "RLE", 4: "BIT_PACKED",
  5: "DELTA_BINARY_PACKED", 6: "DELTA_LENGTH_BYTE_ARRAY", 7: "DELTA_BYTE_ARRAY", 8: "RLE_DICTIONARY",
  9: "BYTE_STREAM_SPLIT" };
const PAGE_TYPE = ["DATA_PAGE", "INDEX_PAGE", "DICTIONARY_PAGE", "DATA_PAGE_V2"];
const CONVERTED = ["UTF8", "MAP", "MAP_KEY_VALUE", "LIST", "ENUM", "DECIMAL", "DATE", "TIME_MILLIS",
  "TIME_MICROS", "TIMESTAMP_MILLIS", "TIMESTAMP_MICROS", "UINT_8", "UINT_16", "UINT_32", "UINT_64",
  "INT_8", "INT_16", "INT_32", "INT_64", "JSON", "BSON", "INTERVAL"];
const UNIT = { 1: "MILLIS", 2: "MICROS", 3: "NANOS" };
const LOGICAL = { 1: "STRING", 2: "MAP", 3: "LIST", 4: "ENUM", 5: "DECIMAL", 6: "DATE", 7: "TIME",
  8: "TIMESTAMP", 10: "INTEGER", 11: "NULL", 12: "JSON", 13: "BSON", 14: "UUID", 15: "FLOAT16",
  16: "VARIANT", 17: "GEOMETRY", 18: "GEOGRAPHY" };

/* ------------------------------------------------------- schema handling */
/** Decodes SchemaElement.logicalType (a thrift union) into something usable. */
function logicalType(raw) {
  if (!raw) return null;
  for (const k in raw) {
    const id = +k, name = LOGICAL[id], body = raw[k] || {};
    if (!name) continue;
    const lt = { name };
    if (id === 5) { lt.scale = body[1] || 0; lt.precision = body[2] || 0; }
    if (id === 7 || id === 8) {
      lt.utc = body[1] === true;
      lt.unit = body[2] ? UNIT[+Object.keys(body[2])[0]] : "MILLIS";
    }
    if (id === 10) { lt.bits = body[1] || 64; lt.signed = body[2] !== false; }
    return lt;
  }
  return null;
}

const annotation = (n) => (n && (n.logical ? n.logical.name : n.converted)) || null;
/**
 * LIST and MAP wrap their values in two extra schema levels (`list.element`,
 * `key_value.value`). Those names are noise in a column header, so they are
 * dropped from the displayed path.
 */
function synthetic(node) {
  const parent = node.parent;
  if (!parent) return false;
  const up = annotation(parent);
  if (node.rep === "REPEATED" && (up === "LIST" || up === "MAP" || up === "MAP_KEY_VALUE")) return true;
  return parent.rep === "REPEATED" && parent.children.length === 1 && annotation(parent.parent) === "LIST";
}

/** Rebuilds the flat schema list into a tree; returns {root, leaves}. */
function buildSchema(elements) {
  const nodes = elements.map((e, i) => ({
    index: i,
    name: str(e[4]) || "",
    type: e[1] == null ? null : PTYPE[e[1]],
    typeLength: e[2] == null ? null : e[2],
    rep: e[3] == null ? (i === 0 ? "REQUIRED" : "REQUIRED") : REP[e[3]],
    numChildren: e[5] || 0,
    converted: e[6] == null ? null : CONVERTED[e[6]],
    scale: e[7] == null ? null : e[7],
    precision: e[8] == null ? null : e[8],
    fieldId: e[9] == null ? null : e[9],
    logical: logicalType(e[10]),
    children: [],
    path: [],
    maxDef: 0,
    maxRep: 0,
  }));
  let i = 0;
  const take = (node, path, maxDef, maxRep) => {
    node.path = path;
    node.maxDef = maxDef;
    node.maxRep = maxRep;
    for (let k = 0; k < node.numChildren; k++) {
      const child = nodes[++i];
      if (!child) throw new Error("schema: truncated (missing children)");
      child.parent = node;
      node.children.push(child);
      take(child, path.concat(child.name),
        maxDef + (child.rep === "REQUIRED" ? 0 : 1),
        maxRep + (child.rep === "REPEATED" ? 1 : 0));
    }
  };
  const root = nodes[0];
  if (!root) throw new Error("schema: empty");
  take(root, [], 0, 0);
  const leaves = nodes.filter((n) => n.numChildren === 0 && n !== root);
  for (const leaf of leaves) {
    const chain = [];
    for (let n = leaf; n && n !== root; n = n.parent) chain.unshift(n);
    leaf.chain = chain;
    leaf.label = chain.filter((n) => !synthetic(n)).map((n) => n.name).join(".") || leaf.name;
  }
  /* if stripping the wrappers made two columns look alike, keep the real paths */
  const seen = new Map();
  for (const leaf of leaves) seen.set(leaf.label, (seen.get(leaf.label) || 0) + 1);
  for (const leaf of leaves) if (seen.get(leaf.label) > 1) leaf.label = leaf.path.join(".");
  return { root, nodes, leaves };
}

/* ------------------------------------------------------- footer / header */
const MAGIC = [0x50, 0x41, 0x52, 0x31];          // "PAR1"
const MAGIC_ENC = [0x50, 0x41, 0x52, 0x45];      // "PARE" (encrypted footer)
const eq4 = (a, b) => a[0] === b[0] && a[1] === b[1] && a[2] === b[2] && a[3] === b[3];

async function readFooter(src) {
  if (src.size < 12) throw new Error("Not a parquet file: only " + src.size + " bytes.");
  const head = await src.read(0, 4);
  const tail = await src.read(src.size - 8, src.size);
  const endMagic = tail.subarray(4, 8);
  const encryptedFooter = eq4(endMagic, MAGIC_ENC);
  if (!eq4(endMagic, MAGIC) && !encryptedFooter) {
    throw new Error('Not a parquet file: the last 4 bytes are not "PAR1" (found "' +
      [...endMagic].map((b) => (b >= 32 && b < 127 ? String.fromCharCode(b) : ".")).join("") + '").');
  }
  if (!eq4(head, MAGIC) && !eq4(head, MAGIC_ENC)) throw new Error('Not a parquet file: missing "PAR1" header.');
  if (encryptedFooter) {
    throw new Error("This file has an encrypted footer (PARE).\n" +
      "paris-parquet cannot decrypt it — no keys, no crypto material, nothing to ask.");
  }
  const len = new DataView(tail.buffer, tail.byteOffset, 4).getUint32(0, true);
  const start = src.size - 8 - len;
  if (start < 4) throw new Error("Corrupt footer: metadata length " + len + " does not fit the file.");
  const buf = await src.read(start, src.size - 8);
  const meta = thriftStruct(new Cursor(buf, 0));
  return parseFileMetadata(meta, len);
}

function parseFileMetadata(m, footerLen) {
  const schema = buildSchema(m[2] || []);
  const enc = m[8] ? { algorithm: m[8][1] ? "AES_GCM_V1" : m[8][2] ? "AES_GCM_CTR_V1" : "UNKNOWN" } : null;
  return {
    version: m[1] ?? null,
    schema,
    numRows: m[3] ?? 0,
    rowGroups: (m[4] || []).map(parseRowGroup),
    keyValue: (m[5] || []).map((kv) => ({ key: str(kv[1]), value: str(kv[2]) })),
    createdBy: str(m[6]),
    columnOrders: m[7] || null,
    encryption: enc,
    footerSigned: !!m[9],
    footerLength: footerLen,
  };
}
function parseRowGroup(g) {
  return {
    columns: (g[1] || []).map(parseColumnChunk),
    totalByteSize: g[2] ?? 0,
    numRows: g[3] ?? 0,
    fileOffset: g[5] ?? null,
    totalCompressedSize: g[6] ?? null,
    ordinal: g[7] ?? null,
  };
}
function parseColumnChunk(c) {
  const md = c[3];
  return {
    filePath: str(c[1]),
    fileOffset: c[2] ?? 0,
    columnIndexOffset: c[6] ?? null,
    columnIndexLength: c[7] ?? null,
    offsetIndexOffset: c[4] ?? null,
    offsetIndexLength: c[5] ?? null,
    cryptoMetadata: c[8] ? true : false,
    encryptedMetadata: c[9] ? true : false,
    meta: md ? {
      type: PTYPE[md[1]],
      encodings: (md[2] || []).map((e) => ENC[e] || "ENC_" + e),
      path: (md[3] || []).map(str),
      codec: CODEC[md[4]] ?? "CODEC_" + md[4],
      numValues: md[5] ?? 0,
      totalUncompressedSize: md[6] ?? 0,
      totalCompressedSize: md[7] ?? 0,
      dataPageOffset: md[9] ?? 0,
      indexPageOffset: md[10] ?? null,
      dictionaryPageOffset: md[11] ?? null,
      statistics: md[12] ? parseStatistics(md[12]) : null,
      encodingStats: (md[13] || []).map((s) => ({
        pageType: PAGE_TYPE[s[1]] || "?", encoding: ENC[s[2]] || "?", count: s[3] || 0 })),
      bloomFilterOffset: md[14] ?? null,
      bloomFilterLength: md[15] ?? null,
    } : null,
  };
}
function parseStatistics(s) {
  return {
    max: s[1] ?? null, min: s[2] ?? null,
    nullCount: s[3] ?? null, distinctCount: s[4] ?? null,
    maxValue: s[5] ?? null, minValue: s[6] ?? null,
    /* set false when a writer truncated the blob: it then bounds the value */
    maxExact: s[7] ?? null, minExact: s[8] ?? null,
  };
}

/* ======================================================================
   Decompression
   ====================================================================== */

/* -------------------------------------------------------------- snappy */
function snappyDecompress(src, expected) {
  let p = 0, shift = 0, len = 0, b;
  do { b = src[p++]; len += (b & 0x7f) * Math.pow(2, shift); shift += 7; } while (b & 0x80);
  const out = new Uint8Array(expected != null ? expected : len);
  let o = 0;
  while (p < src.length) {
    const tag = src[p++];
    switch (tag & 3) {
      case 0: {                                   // literal
        let n = tag >> 2;
        if (n >= 60) {
          const extra = n - 59;
          n = 0;
          for (let i = 0; i < extra; i++) n |= src[p + i] << (8 * i);
          p += extra;
        }
        n = n + 1;
        out.set(src.subarray(p, p + n), o);
        p += n; o += n;
        break;
      }
      case 1: {                                   // copy, 1-byte offset
        const n = 4 + ((tag >> 2) & 7);
        const off = ((tag >> 5) << 8) | src[p++];
        o = snappyCopy(out, o, off, n);
        break;
      }
      case 2: {                                   // copy, 2-byte offset
        const n = (tag >> 2) + 1;
        const off = src[p] | (src[p + 1] << 8); p += 2;
        o = snappyCopy(out, o, off, n);
        break;
      }
      default: {                                  // copy, 4-byte offset
        const n = (tag >> 2) + 1;
        const off = (src[p] | (src[p + 1] << 8) | (src[p + 2] << 16) | (src[p + 3] << 24)) >>> 0; p += 4;
        o = snappyCopy(out, o, off, n);
      }
    }
  }
  return out;
}
function snappyCopy(out, o, off, n) {
  if (off <= 0 || off > o) throw new Error("snappy: bad copy offset " + off);
  let s = o - off;
  for (let i = 0; i < n; i++) out[o++] = out[s++];
  return o;
}

/* ----------------------------------------------------------- lz4 block */
function lz4BlockDecompress(src, expected) {
  const out = new Uint8Array(expected);
  let p = 0, o = 0;
  while (p < src.length) {
    const token = src[p++];
    let lit = token >> 4;
    if (lit === 15) { let b; do { b = src[p++]; lit += b; } while (b === 255); }
    for (let i = 0; i < lit; i++) out[o++] = src[p++];
    if (p >= src.length) break;
    const off = src[p] | (src[p + 1] << 8); p += 2;
    let n = (token & 15) + 4;
    if ((token & 15) === 15) { let b; do { b = src[p++]; n += b; } while (b === 255); }
    if (off <= 0 || off > o) throw new Error("lz4: bad match offset " + off);
    let s = o - off;
    for (let i = 0; i < n; i++) out[o++] = out[s++];
  }
  return out;
}
/** Hadoop-framed LZ4 (codec LZ4): repeated [u32 be rawLen][u32 be compLen][block]. */
function lz4HadoopDecompress(src, expected) {
  try {
    const out = new Uint8Array(expected);
    const dv = new DataView(src.buffer, src.byteOffset, src.byteLength);
    let p = 0, o = 0;
    while (p + 8 <= src.length && o < expected) {
      const raw = dv.getUint32(p, false), comp = dv.getUint32(p + 4, false);
      p += 8;
      if (comp > src.length - p || raw > expected - o) throw new Error("frame");
      out.set(lz4BlockDecompress(src.subarray(p, p + comp), raw), o);
      p += comp; o += raw;
    }
    if (o === expected) return out;
    throw new Error("frame");
  } catch (e) {
    return lz4BlockDecompress(src, expected);   // some writers emit a bare block
  }
}

/* ----------------------------------------------- gzip (browser builtin) */
async function inflate(src, format) {
  const ds = new DecompressionStream(format);
  const stream = new Blob([src]).stream().pipeThrough(ds);
  const chunks = [];
  let total = 0;
