      if (kind === "SUM" || kind === "AVG") { const x = mKeys[m] ? mKeys[m](v) : NaN; if (x === x) a.sum += x; }
      else if (kind === "COUNT_DISTINCT") { (a.set || (a.set = new Set())).add(keyPart(v)); }
      else if (kind === "MIN" || kind === "MAX") {
        const cmpLess = mKeys[m]
          ? (x, y) => lessThan(x, y)
          : (x, y) => String(textOf(x, mSpecs[m])) < String(textOf(y, mSpecs[m]));
        if (a.min === null || cmpLess(v, a.min)) a.min = v;
        if (a.max === null || cmpLess(a.max, v)) a.max = v;
      }
    }
  }

  const outCols = [];
  for (const ci of gcis) outCols.push({ name: cols[ci].name, spec: cols[ci].spec, leaf: cols[ci].leaf, rows: [] });
  const countSpec = { kind: "number", label: "count", physical: "INT64", convert: (v) => v };
  for (const m of metrics) {
    const src = cols[m.ci];
    const isCount = m.agg === "COUNT" || m.agg === "COUNT_DISTINCT";
    const keeps = m.agg === "MIN" || m.agg === "MAX";
    outCols.push({
      name: m.alias || AGG_SHORT[m.agg] + "(" + src.name + ")",
      spec: isCount ? countSpec : keeps ? src.spec : { kind: "number", label: m.agg.toLowerCase(), physical: src.spec.physical, convert: (v) => v },
      rows: [],
    });
  }
  for (const acc of groups.values()) {
    let k = 0;
    for (const ci of gcis) outCols[k++].rows.push(cols[ci].rows[acc.row]);
    for (let m = 0; m < metrics.length; m++) {
      const a = acc.m[m], kind = metrics[m].agg;
      let v = null;
      if (kind === "COUNT") v = a.n;
      else if (kind === "COUNT_DISTINCT") v = a.set ? a.set.size : 0;
      else if (kind === "SUM") v = a.n ? a.sum : null;
      else if (kind === "AVG") v = a.n ? a.sum / a.n : null;
      else if (kind === "MIN") v = a.min;
      else if (kind === "MAX") v = a.max;
      outCols[k++].rows.push(v);
    }
  }
  return outCols;
}

/* -------------------------------------------------------------- running */
function runQuery() {
  const q = state.query, table = state.table;
  if (!table) return;
  const t0 = performance.now();
  const cols = table.cols, n = table.rowsLoaded;

  const groups = orGroups(q.filters, cols);
  let index = null;
  if (groups.length) {
    const buf = new Int32Array(n);
    let k = 0;
    for (let r = 0; r < n; r++) {
      for (let g = 0; g < groups.length; g++) {
        const grp = groups[g];
        let ok = true;
        for (let i = 0; i < grp.length; i++) if (!grp[i](r)) { ok = false; break; }
        if (ok) { buf[k++] = r; break; }
      }
    }
    index = buf.slice(0, k);
  }

  let view;
  if (q.mode === "agg" && (q.groupBy.length || q.metrics.length)) {
    const outCols = aggregate(q, cols, index, n);
    let count = outCols.length ? outCols[0].rows.length : 0;
    const order = aggSort(q, cols, outCols);
    if (order) {
      const idx = new Int32Array(count);
      for (let i = 0; i < count; i++) idx[i] = i;
      idx.sort(buildComparator(order, outCols));
      for (const c of outCols) { const src = c.rows; c.rows = new Array(count); for (let i = 0; i < count; i++) c.rows[i] = src[idx[i]]; }
    }
    if (q.limit != null && q.limit < count) { count = q.limit; for (const c of outCols) c.rows.length = count; }
    view = { cols: outCols, index: null, count, agg: true, label: "grouped" };
  } else {
    const outCols = q.select.length ? q.select.map((ci) => cols[ci]).filter(Boolean) : displayCols(cols);
    if (q.sort.length) {
      if (!index) { index = new Int32Array(n); for (let i = 0; i < n; i++) index[i] = i; }
      index.sort(buildComparator(q.sort, cols));
    }
    let count = index ? index.length : n;
    if (q.limit != null && q.limit < count) {
      count = q.limit;
      if (index) index = index.subarray(0, count);
    }
    view = { cols: outCols, index, count, agg: false,
      label: !index ? (count < n ? "limited" : null) : groups.length ? "filtered" : "sorted" };
  }
  q.active = true;
  const ms = Math.round(performance.now() - t0);
  setView(view);
  const skipped = q.filters.filter((f) => filterIssue(f, cols)).length;
  $("qstat").innerHTML = "<b>" + num(view.count) + "</b> " + (view.agg ? "groups" : "rows") +
    " from " + num(n) + (table.truncated ? " read" : "") + " &middot; " + ms + " ms" +
    (skipped ? " &middot; <em class='qwarn'>" + skipped + " clause" + (skipped === 1 ? "" : "s") +
      " skipped</em>" : "");
  $("qclear").disabled = false;
}
/** Which output column a sort clause means in aggregate mode, or -1. */
function aggSortIndex(q, s) {
  if (s.mid) {
    const m = q.metrics.findIndex((x) => x.id === s.mid);
    return m >= 0 ? q.groupBy.length + m : -1;
  }
  const g = q.groupBy.indexOf(s.ci);
  if (g >= 0) return g;
  const m = q.metrics.findIndex((x) => x.ci === s.ci);
  return m >= 0 ? q.groupBy.length + m : -1;
}
/** In aggregate mode, ORDER BY can only mean one of the output columns. */
function aggSort(q, cols, outCols) {
  const order = [];
  for (const s of q.sort) {
    const at = aggSortIndex(q, s);
    if (at >= 0 && at < outCols.length) order.push({ ci: at, dir: s.dir });
  }
  return order.length ? order : null;
}
/**
 * Clicking a column header edits the query's ORDER BY, so the header arrows,
 * the ORDER BY zone and the SQL never disagree about how the rows are sorted.
 * Shift-click adds a key instead of replacing.
 */
function toggleSort(viewIdx, additive) {
  const view = state.view, q = state.query, table = state.table;
  if (!view || !table) return;
  const col = view.cols[viewIdx];
  if (!col) return;
  let ci = table.cols.indexOf(col), mid = null;
  if (ci < 0 && view.agg) {
    if (viewIdx < q.groupBy.length) ci = q.groupBy[viewIdx];
    else {
      const m = q.metrics[viewIdx - q.groupBy.length];
      if (m) { ci = m.ci; mid = m.id; }
    }
  }
  if (ci < 0) return;
  const same = (s) => (mid ? s.mid === mid : !s.mid && s.ci === ci);
  const at = q.sort.findIndex(same);
  const fresh = () => ({ id: "s" + ++qid, ci, dir: "ASC", mid });
  if (!additive) {
    if (at < 0) q.sort = [fresh()];
    else if (q.sort[at].dir === "ASC") q.sort = [Object.assign(q.sort[at], { dir: "DESC" })];
    else q.sort = [];
  } else if (at < 0) q.sort.push(fresh());
  else if (q.sort[at].dir === "ASC") q.sort[at].dir = "DESC";
  else q.sort.splice(at, 1);
  renderQuery();
  runQuery();
}
/** The arrow a header shows: direction, plus its place when there are several. */
function sortMark(viewIdx) {
  const view = state.view, q = state.query, table = state.table;
  if (!view || !q || !q.sort.length) return "";
  const col = view.cols[viewIdx];
  let at = -1;
  if (view.agg) {
    at = q.sort.findIndex((s) => aggSortIndex(q, s) === viewIdx);
  } else {
    const ci = table.cols.indexOf(col);
    at = ci < 0 ? -1 : q.sort.findIndex((s) => !s.mid && s.ci === ci);
  }
  if (at < 0) return "";
  return "<span class='sortmark'>" + (q.sort[at].dir === "ASC" ? "▲" : "▼") +
    (q.sort.length > 1 ? "<i>" + (at + 1) + "</i>" : "") + "</span>";
}

function resetQuery() {
  const mode = state.query ? state.query.mode : "rows";
  state.query = newQuery();
  state.query.mode = mode;
  $("qstat").textContent = "";
  $("qclear").disabled = true;
  if (state.table) setView(baseView(state.table));
  renderQuery();
}

/* ------------------------------------------------------------ SQL text */
function sqlIdent(name) {
  return /^[A-Za-z_][A-Za-z0-9_]*$/.test(name) ? name : '"' + name.replace(/"/g, '""') + '"';
}
function sqlLiteral(text, spec) {
  if (spec.kind === "number" && isFinite(parseFloat(text))) return String(parseFloat(text));
  if (spec.kind === "bool") return /^(true|t|1|y|yes)$/i.test(String(text).trim()) ? "TRUE" : "FALSE";
  return "'" + String(text).replace(/'/g, "''") + "'";
}
function querySql() {
  const q = state.query, table = state.table;
  if (!table) return "";
  const cols = table.cols;
  const from = (state.src && state.src.name ? state.src.name : "parquet").replace(/\.[^.]*$/, "");
  const lines = [];
  if (q.mode === "agg" && (q.groupBy.length || q.metrics.length)) {
    const sel = q.groupBy.map((ci) => sqlIdent(cols[ci].name));
    for (const m of q.metrics) {
      if (!cols[m.ci]) continue;
      const inner = sqlIdent(cols[m.ci].name);
      const fn = m.agg === "COUNT_DISTINCT" ? "COUNT(DISTINCT " + inner + ")" : m.agg + "(" + inner + ")";
      sel.push(m.alias ? fn + " AS " + sqlIdent(m.alias) : fn);
    }
    lines.push("SELECT " + (sel.length ? sel.join(",\n       ") : "*"));
  } else if (q.select.length) {
    lines.push("SELECT " + q.select.map((ci) => sqlIdent(cols[ci].name)).join(",\n       "));
  } else {
    lines.push("SELECT *");
  }
  lines.push("FROM " + sqlIdent(from));
  let pending = false;
  q.filters.forEach((f, i) => {
    const col = cols[f.ci];
    if (!col) return;
    const p = PREDS.find((x) => x.id === f.pred) || PREDS[0];
    let clause;
    if (NO_OPERAND[f.pred]) clause = sqlIdent(col.name) + " " + p.sql;
    else if (filterIssue(f, cols)) {
      /* no usable value yet: shown so the shape is visible, but not run */
      clause = sqlIdent(col.name) + " " + p.sql + " ?";
      pending = true;
    } else if (f.pred === "between") {
      clause = sqlIdent(col.name) + " BETWEEN " + sqlLiteral(f.value, col.spec) +
        " AND " + sqlLiteral(f.valueTo == null ? f.value : f.valueTo, col.spec);
    } else if (f.pred === "like") clause = sqlIdent(col.name) + " LIKE '%" + String(f.value).replace(/'/g, "''") + "%'";
    else clause = sqlIdent(col.name) + " " + p.sql + " " + sqlLiteral(f.value, col.spec);
    lines.push((i === 0 ? "WHERE " : "  " + (f.linker || "AND") + " ") + clause);
  });
  if (q.mode === "agg" && q.groupBy.length) {
    lines.push("GROUP BY " + q.groupBy.map((ci) => sqlIdent(cols[ci].name)).join(", "));
  }
  const agg = q.mode === "agg" && (q.groupBy.length || q.metrics.length);
  const order = [];
  for (const st of q.sort) {
    const col = cols[st.ci];
    if (!col) continue;
    if (!agg) { order.push(sqlIdent(col.name) + " " + st.dir); continue; }
    /* an aggregate can only be ordered by something it actually selects */
    if (!st.mid && q.groupBy.indexOf(st.ci) >= 0) { order.push(sqlIdent(col.name) + " " + st.dir); continue; }
    const m = st.mid ? q.metrics.find((x) => x.id === st.mid) : q.metrics.find((x) => x.ci === st.ci);
    if (m) {
      const inner = sqlIdent(col.name);
      order.push((m.alias ? sqlIdent(m.alias)
        : m.agg === "COUNT_DISTINCT" ? "COUNT(DISTINCT " + inner + ")" : m.agg + "(" + inner + ")") + " " + st.dir);
    }
  }
  if (order.length) lines.push("ORDER BY " + order.join(", "));
  if (q.limit != null) lines.push("LIMIT " + q.limit);
  return lines.join("\n") + ";" +
    (pending ? "\n\n-- clauses shown with ? are skipped: no value, or it does not\n" +
      "-- parse as this column's type" : "");
}

/* ----------------------------------------------------------------- UI */
const TYPE_TAG = { number: "NUM", string: "STR", bool: "BOOL", temporal: "TS", binary: "BIN", nested: "LIST" };
function typeTag(spec) {
  if (spec.kind === "temporal") return spec.sub === "date" ? "DATE" : spec.sub === "time" ? "TIME" : "TS";
  return TYPE_TAG[spec.kind] || "?";
}

function renderQueryColumns() {
  const table = state.table;
  if (!table) return;
  let html = "<div class='qhead'>Columns</div>";
  table.cols.forEach((c, i) => {
    html += "<div class='qcol' draggable='true' data-ci='" + i + "' title='" + esc(c.name + " - " + c.spec.label) +
      "'><span class='qgrab'>∷</span><span class='qcname'>" + esc(c.name) + "</span>" +
      "<span class='qtag t-" + c.spec.kind + "'>" + typeTag(c.spec) + "</span></div>";
  });
  $("qcols").innerHTML = html;
}

function zone(id, label, hint, body, empty) {
  return "<div class='qzone'><div class='qzlabel'>" + label + "</div>" +
    "<div class='qdrop" + (empty ? " empty" : "") + "' data-zone='" + id + "'>" +
    (empty ? "<span class='qhint'>" + hint + "</span>" : body) + "</div></div>";
}
const chip = (text, act, id) => "<span class='qchip'>" + esc(text) +
  "<button class='qx' data-act='" + act + "' data-id='" + id + "'>×</button></span>";

function renderQuery() {
  const q = state.query, table = state.table;
  if (!table) return;
  const cols = table.cols;
  const nameOf = (ci) => (cols[ci] ? cols[ci].name : "?");
  const parts = [];

  if (q.mode === "rows") {
    parts.push(zone("select", "SELECT", "All columns &mdash; drop to pick specific ones",
      q.select.map((ci) => chip(nameOf(ci), "rm-select", ci)).join(""), q.select.length === 0));
  } else {
    parts.push(zone("groupBy", "GROUP BY", "Drop columns to group by",
      q.groupBy.map((ci) => chip(nameOf(ci), "rm-group", ci)).join(""), q.groupBy.length === 0));
    parts.push(zone("metrics", "METRICS", "Drop a column to aggregate it",
      q.metrics.map((m) => {
        let btns = "";
        for (const a of AGGS) {
          btns += "<button class='qb" + (m.agg === a ? " on" : "") + "' data-act='agg' data-id='" + m.id +
            "' data-v='" + a + "'>" + AGG_SHORT[a] + "</button>";
        }
        return "<div class='qrow'><span class='qbtns'>" + btns + "</span><code>" + esc(nameOf(m.ci)) + "</code>" +
          "<input class='qin' data-in='alias' data-id='" + m.id + "' value='" + esc(m.alias || "") +
          "' placeholder='alias' size='7'>" +
          "<button class='qx' data-act='rm-metric' data-id='" + m.id + "'>×</button></div>";
      }).join(""), q.metrics.length === 0));
  }

  parts.push(zone("where", "WHERE", "Drop a column to filter on it",
    q.filters.map((f, i) => {
      let btns = "";
      for (const p of PREDS) {
        btns += "<button class='qb" + (f.pred === p.id ? " on" : "") + "' data-act='pred' data-id='" + f.id +
          "' data-v='" + p.id + "'>" + p.label + "</button>";
      }
      const link = i === 0 ? "" : "<button class='qlink' data-act='link' data-id='" + f.id + "'>" +
        (f.linker || "AND") + "</button>";
      const issue = filterIssue(f, cols);
      const inputs = NO_OPERAND[f.pred] ? "" :
        "<input class='qin" + (issue === "invalid" ? " bad" : "") + "' data-in='val' data-id='" + f.id +
        "' value='" + esc(f.value || "") + "' placeholder='value' size='9'" +
        (issue === "invalid" ? " title='not a " + esc(cols[f.ci].spec.label) + " value'" : "") + ">" +
        (f.pred === "between" ? "<input class='qin' data-in='valTo' data-id='" + f.id + "' value='" +
          esc(f.valueTo || "") + "' placeholder='to' size='7'>" : "");
      return "<div class='qrow'>" + link + "<code>" + esc(nameOf(f.ci)) + "</code>" +
        "<span class='qbtns'>" + btns + "</span>" + inputs +
        "<button class='qx' data-act='rm-filter' data-id='" + f.id + "'>×</button></div>";
    }).join(""), q.filters.length === 0));

  /* a sort on a metric names the metric, matching the header and the SQL */
  const sortName = (s) => {
    if (!s.mid) return nameOf(s.ci);
    const m = q.metrics.find((x) => x.id === s.mid);
    return m ? (m.alias || AGG_SHORT[m.agg] + "(" + nameOf(m.ci) + ")") : nameOf(s.ci);
  };
  parts.push(zone("sort", "ORDER BY", "Drop a column to sort by",
    q.sort.map((s) => "<div class='qrow'><code>" + esc(sortName(s)) + "</code>" +
      "<button class='qb on' data-act='dir' data-id='" + s.id + "'>" +
      (s.dir === "ASC" ? "ASC ↑" : "DESC ↓") + "</button>" +
      "<button class='qx' data-act='rm-sort' data-id='" + s.id + "'>×</button></div>").join(""),
    q.sort.length === 0));

  parts.push("<div class='qzone qlimit'><div class='qzlabel'>LIMIT</div>" +
    "<input class='qin' data-in='limit' value='" + (q.limit == null ? "" : q.limit) +
    "' placeholder='none' size='7'></div>");

  $("qzones").innerHTML = parts.join("");
  for (const b of $("qmode").children) b.classList.toggle("on", b.dataset.mode === q.mode);
  renderSql();
}
function renderSql() { $("qsql").textContent = querySql(); }

function addToZone(zoneId, ci) {
  const q = state.query;
  switch (zoneId) {
    case "select": if (q.select.indexOf(ci) < 0) q.select.push(ci); break;
    case "groupBy": if (q.groupBy.indexOf(ci) < 0) q.groupBy.push(ci); break;
    case "metrics": q.metrics.push({ id: "m" + ++qid, ci, agg: "COUNT", alias: "" }); break;
    case "where": q.filters.push({ id: "f" + ++qid, ci, pred: "eq", value: "", valueTo: "", linker: "AND" }); break;
    case "sort": if (!q.sort.some((s) => s.ci === ci)) q.sort.push({ id: "s" + ++qid, ci, dir: "ASC" }); break;
    default: return;
  }
  renderQuery();
}

function initQuery() {
  state.query = newQuery();
  $("qmode").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-mode]");
    if (!b) return;
    state.query.mode = b.dataset.mode;
    renderQuery();
  });
  $("qcols").addEventListener("dragstart", (e) => {
    const row = e.target.closest(".qcol");
    if (!row) return;
    e.dataTransfer.setData("text/plain", row.dataset.ci);
    e.dataTransfer.effectAllowed = "copy";
  });
  $("qcols").addEventListener("dblclick", (e) => {
    const row = e.target.closest(".qcol");
    if (row) addToZone(state.query.mode === "rows" ? "select" : "groupBy", +row.dataset.ci);
  });
  const zoneAt = (e) => e.target.closest(".qdrop");
  $("qzones").addEventListener("dragover", (e) => {
    const z = zoneAt(e);
    if (!z) return;
    e.preventDefault();
    z.classList.add("over");
  });
  $("qzones").addEventListener("dragleave", (e) => { const z = zoneAt(e); if (z) z.classList.remove("over"); });
  $("qzones").addEventListener("drop", (e) => {
    const z = zoneAt(e);
    if (!z) return;
    e.preventDefault();
    z.classList.remove("over");
    const ci = parseInt(e.dataTransfer.getData("text/plain"), 10);
    if (isFinite(ci)) addToZone(z.dataset.zone, ci);
  });
  $("qzones").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    const q = state.query, id = b.dataset.id;
    switch (b.dataset.act) {
      case "rm-select": q.select = q.select.filter((ci) => ci !== +id); break;
      case "rm-group": q.groupBy = q.groupBy.filter((ci) => ci !== +id); break;
      case "rm-metric": q.metrics = q.metrics.filter((m) => m.id !== id); break;
      case "rm-filter": q.filters = q.filters.filter((f) => f.id !== id); break;
      case "rm-sort": q.sort = q.sort.filter((s) => s.id !== id); break;
      case "pred": { const f = q.filters.find((x) => x.id === id); if (f) f.pred = b.dataset.v; break; }
      case "link": { const f = q.filters.find((x) => x.id === id); if (f) f.linker = f.linker === "OR" ? "AND" : "OR"; break; }
      case "agg": { const m = q.metrics.find((x) => x.id === id); if (m) m.agg = b.dataset.v; break; }
      case "dir": { const s = q.sort.find((x) => x.id === id); if (s) s.dir = s.dir === "ASC" ? "DESC" : "ASC"; break; }
      default: return;
    }
    renderQuery();
  });
  /* typing must not re-render, or the input would lose focus mid-word */
  $("qzones").addEventListener("input", (e) => {
    const el = e.target.closest("[data-in]");
    if (!el) return;
    const q = state.query, id = el.dataset.id, v = el.value;
    switch (el.dataset.in) {
      case "val": { const f = q.filters.find((x) => x.id === id); if (f) f.value = v; break; }
      case "valTo": { const f = q.filters.find((x) => x.id === id); if (f) f.valueTo = v; break; }
      case "alias": { const m = q.metrics.find((x) => x.id === id); if (m) m.alias = v; break; }
      case "limit": { const n = parseInt(v, 10); q.limit = isFinite(n) && n > 0 ? n : null; break; }
      default: return;
    }
    /* typing does not re-render the zone, so mark the offending input here */
    if (el.dataset.in === "val" || el.dataset.in === "valTo") {
      const f = q.filters.find((x) => x.id === id);
      const cols = state.table ? state.table.cols : [];
      el.classList.toggle("bad", !!f && filterIssue(f, cols) === "invalid");
    }
    renderSql();
  });
  $("qzones").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); runQuery(); }
  });
  $("qrun").addEventListener("click", () => runQuery());
  $("qclear").addEventListener("click", () => resetQuery());
  $("qcopy").addEventListener("click", () => {
    const text = querySql();
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
    $("qcopy").textContent = "copied";
    setTimeout(() => { $("qcopy").textContent = "copy"; }, 1200);
  });
  $("toggleQuery").addEventListener("click", () => {
    const q = $("query");
    const showing = q.hidden;
    q.hidden = !showing;
    $("qgrip").hidden = !showing;
    $("toggleQuery").textContent = showing ? "Hide query" : "Query";
    renderRows(true);
  });
  $("qgrip").addEventListener("pointerdown", (e) =>
    drag(e, "rowsizing", (ev) => queryHeight($("query").getBoundingClientRect().bottom - ev.clientY)));
}
function queryHeight(px) {
  const room = Math.max(120, window.innerHeight - 260);
  const h = Math.max(120, Math.min(Math.round(px), room));
  document.documentElement.style.setProperty("--queryh", h + "px");
  try { localStorage.setItem("paris-parquet-queryh", String(h)); } catch (e) { /* fine */ }
  renderRows(true);
  return h;
}

/* ======================================================================
   Wiring
   ====================================================================== */
/* ---------------------------------------------------------- resizing */
function columnWidth(index, px) {
  const view = state.view;
  if (!view || !view.cols[index]) return;
  const w = Math.max(56, Math.round(px));
  view.cols[index].width = w;
  const col = $("grid").querySelectorAll("colgroup col")[index + 1];   /* +1: row numbers */
  if (col) col.style.width = w + "px";
}
function metaHeight(px) {
  const room = Math.max(90, window.innerHeight - 220);
  const h = Math.max(58, Math.min(Math.round(px), room));
  document.documentElement.style.setProperty("--metah", h + "px");
  try { localStorage.setItem("paris-parquet-metah", String(h)); } catch (e) { /* fine */ }
  renderRows(true);
  return h;
}
/** Runs a pointer drag, keeping the cursor and text selection sane. */
function drag(event, cls, onMove) {
  event.preventDefault();
  document.body.classList.add(cls);
  const move = (e) => onMove(e);
  const up = () => {
    document.body.classList.remove(cls);
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

const THEMES = ["auto", "light", "dark"];
function applyTheme(name) {
  const root = document.documentElement;
  if (name === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", name);
  $("theme").textContent = name;
  /* file:// pages may refuse storage entirely; the choice just won't persist */
  try { localStorage.setItem("paris-parquet-theme", name); } catch (e) { /* fine */ }
}
function storedTheme() {
  try {
    const v = localStorage.getItem("paris-parquet-theme");
    return THEMES.indexOf(v) >= 0 ? v : "auto";
  } catch (e) { return "auto"; }
}
function showError(e) {
  const old = $("err");
  if (old) old.remove();
  const box = document.createElement("div");
  box.id = "err";
  box.textContent = (e && e.message) ? e.message : String(e);
  $("stage").prepend(box);
  if (e && e.stack) console.error(e);
}
function busy(on, text) {
  const b = $("busy");
  b.hidden = !on;
  if (text) b.textContent = text;
}
const FIRST_ROWS = 20000;

async function openFile(file) {
  const old = $("err");
  if (old) old.remove();
  busy(true, "reading footer...");
  $("fileline").innerHTML = "<b>" + esc(file.name) + "</b> &middot; " + bytesHuman(file.size);
  try {
    const src = fileSource(file);
    const meta = await readFooter(src);
    const table = newTable(meta);
    state.src = src; state.meta = meta; state.table = table;
    state.display = newDisplay(table.cols);
    busy(true, "decoding " + num(Math.min(meta.numRows, FIRST_ROWS)) + " rows...");
    await new Promise((r) => setTimeout(r, 0));
    await loadMore(src, table, FIRST_ROWS);
    setView(baseView(table));
    state.query = newQuery();          /* a new file means new columns */
    $("qstat").textContent = "";
    $("qclear").disabled = true;
    renderQueryColumns();
    renderQuery();
    renderMeta();
    updateButtons();
    $("fileline").innerHTML = "<b>" + esc(file.name) + "</b> &middot; " + bytesHuman(file.size) + " &middot; " +
      num(meta.numRows) + " rows x " + num(meta.schema.leaves.length) + " cols &middot; " +
      num(meta.rowGroups.length) + " row group" + (meta.rowGroups.length === 1 ? "" : "s");
  } catch (e) {
    $("gridwrap").hidden = true;
    $("pager").hidden = true;
    $("query").hidden = true;
    $("qgrip").hidden = true;
    $("drop").hidden = false;
    $("meta").hidden = true;
    $("mgrip").hidden = true;
    $("more").hidden = true;
    $("all").hidden = true;
    $("toggleCols").hidden = true;
    $("colpick").hidden = true;
    $("toggleMeta").hidden = true;
    showError(e);
    /* the footer usually parses even when a page does not, and it is the part
       that explains why: codec, encodings, encryption, who wrote the file */
    if (state.meta && state.table) {
      try { renderMeta(); $("toggleMeta").hidden = false; } catch (e2) { /* nothing to show */ }
    }
  } finally {
    busy(false);
  }
}

function updateButtons() {
  const t = state.table;
  const can = !!(t && t.truncated);
  $("more").hidden = !can;
  $("all").hidden = !can;
  $("toggleMeta").hidden = !t;
  $("toggleQuery").hidden = !t;
  $("toggleCols").hidden = !t;
  if (t && $("toggleQuery").textContent === "Query" && $("query").hidden) {
    $("query").hidden = false;
    $("qgrip").hidden = false;
    $("toggleQuery").textContent = "Hide query";
  }
  if (can) {
    const left = t.meta.numRows - t.rowsLoaded;
    let next = 0;
    for (let g = t.nextGroup; g < t.meta.rowGroups.length && next < FIRST_ROWS; g++) {
      next += t.meta.rowGroups[g].numRows;
    }
    $("more").textContent = "Load " + num(next) + " more";
    $("all").textContent = "Load all " + num(left);
  }
}
async function grow(n) {
  busy(true, "decoding...");
  await new Promise((r) => setTimeout(r, 0));
  try {
    await loadMore(state.src, state.table, n);
    if (state.query && state.query.active) runQuery(); else setView(baseView(state.table));
    renderMeta();
    updateButtons();
  } catch (e) { showError(e); } finally { busy(false); }
}

function init() {
  applyTheme(storedTheme());
  initQuery();
  initPicker();
  $("theme").addEventListener("click", () => {
    applyTheme(THEMES[(THEMES.indexOf($("theme").textContent) + 1) % THEMES.length]);
  });
  $("picker").addEventListener("change", (e) => {
    const f = e.target.files[0];
    e.target.value = "";              /* so picking the same file again re-reads it */
    if (f) openFile(f);
  });
  $("more").addEventListener("click", () => grow(FIRST_ROWS));
  $("all").addEventListener("click", () => grow(Infinity));
  $("toggleMeta").addEventListener("click", () => {
    const m = $("meta");
    state.metaTouched = true;
    m.classList.toggle("collapsed");
    const hidden = m.classList.contains("collapsed");
    $("mgrip").hidden = hidden;
    $("toggleMeta").textContent = hidden ? "Show metadata" : "Hide metadata";
    renderRows(true);
  });
  try {
    const qh = +localStorage.getItem("paris-parquet-queryh");
    if (qh > 0) document.documentElement.style.setProperty("--queryh", qh + "px");
  } catch (e) { /* fine */ }
  try {
    const size = Number(localStorage.getItem("paris-parquet-pagesize"));
    if (PAGE_SIZES.indexOf(size) >= 0 || size === Infinity) state.pageSize = size;
  } catch (e) { /* fine */ }
  try {
    const saved = +localStorage.getItem("paris-parquet-metah");
    if (saved > 0) document.documentElement.style.setProperty("--metah", saved + "px");
  } catch (e) { /* fine */ }
  $("mgrip").addEventListener("pointerdown", (e) =>
    drag(e, "rowsizing", (ev) => metaHeight(window.innerHeight - ev.clientY)));
  $("gridwrap").addEventListener("pointerdown", (e) => {
    const grip = e.target.closest("i.grip");
    if (!grip) return;
    const index = +grip.dataset.col;
    const startX = e.clientX, startW = state.view.cols[index].width || COL_W;
    drag(e, "colsizing", (ev) => {
      state.justResized = true;
      columnWidth(index, startW + ev.clientX - startX);
    });
    window.addEventListener("pointerup", () => setTimeout(() => { state.justResized = false; }, 0), { once: true });
  });
  $("gridwrap").addEventListener("dblclick", (e) => {
    const grip = e.target.closest("i.grip");
    if (grip) columnWidth(+grip.dataset.col, COL_W);
  });
  $("gridwrap").addEventListener("click", (e) => {
    if (state.justResized) return;              /* the click that ends a drag */
    if (e.target.closest("i.grip")) return;
    const th = e.target.closest("tr.r-name th");
    if (th) {
      if (th.classList.contains("rownum")) return;
      const idx = Array.prototype.indexOf.call(th.parentNode.children, th) - 1;
      if (idx >= 0) toggleSort(idx, e.shiftKey);
      return;
    }
    const td = e.target.closest("#tbody td");
    if (!td || td.classList.contains("rownum") || td.classList.contains("pad")) return;
    if (String(window.getSelection())) return;     /* they were selecting text */
    const tr = td.parentNode;
    const ci = Array.prototype.indexOf.call(tr.children, td) - 1;
    const r = +tr.dataset.r;
    if (ci >= 0 && isFinite(r)) openInspector(r, ci, td);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeInspector(); });
  document.addEventListener("pointerdown", (e) => {
    if (state.inspectAt && !e.target.closest("#inspect") && !e.target.closest("#tbody td")) closeInspector();
  }, true);
  let raf = 0;
  $("gridwrap").addEventListener("scroll", () => {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; renderRows(false); });
  });
  window.addEventListener("resize", () => {
    const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--metah"));
    if (cur > 0) metaHeight(cur); else renderRows(true);
  });
  const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
  document.addEventListener("dragover", (e) => { stop(e); document.body.classList.add("dragging"); });
  document.addEventListener("dragleave", (e) => { if (e.relatedTarget === null) document.body.classList.remove("dragging"); });
  document.addEventListener("drop", (e) => {
    stop(e);
    document.body.classList.remove("dragging");
    const f = e.dataTransfer.files[0];
    if (f) openFile(f);
  });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

/* exposed so this file can be driven from a test harness */
window.PARIS = { readFooter, loadMore, newTable, typeSpec, summarize, assemble, fmtValue, decompress,
  runQuery, querySql, baseView, setView, compileFilter, aggregate, exportParts, viewValue,
  displayCols, newDisplay, refreshView,
  zstdDecompress, snappyDecompress, lz4BlockDecompress, gzipDecompress, fileSource, state };
</script>
</body>
